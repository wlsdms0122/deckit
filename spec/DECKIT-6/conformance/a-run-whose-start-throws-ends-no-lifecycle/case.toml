case = 3
name = "a-run-whose-start-throws-ends-no-lifecycle"
note = "A run that fails to launch ends no lifecycle, so its stop is not called. The start of mod-b keeps the handle and throws, and its stop would hand the host an address, so after the launch mod-a asks for is refused the host has been handed none."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-b"]

[step.expect]
refuses = "launch"
kind = "NOT_LAUNCHED"

[[step]]
look = "opened"

[step.expect]
answers = []
