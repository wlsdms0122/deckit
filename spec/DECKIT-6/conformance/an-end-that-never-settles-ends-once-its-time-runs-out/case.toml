case = 3
name = "an-end-that-never-settles-ends-once-its-time-runs-out"
note = "Each lifecycle's end is given 5 seconds, and has ended once they run out. The stop of mod-b answers a promise that never settles, so the quit mod-a asks for is answered and mod-b is notRunning."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-b"]

[[step]]
input = "call"
mod = "mod-a"
member = "mods.quit"
args = ["mod-b"]

[[step]]
look = "run"
mod = "mod-b"

[step.expect]
answers = "notRunning"
