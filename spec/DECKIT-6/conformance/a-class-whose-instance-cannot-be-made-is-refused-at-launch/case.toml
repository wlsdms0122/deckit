case = 3
name = "a-class-whose-instance-cannot-be-made-is-refused-at-launch"
note = "A run whose instance cannot be made fails to launch. The constructor of mod-b throws, so the launch mod-a asks for is refused at launch with NOT_LAUNCHED."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-b"]

[step.expect]
refuses = "launch"
kind = "NOT_LAUNCHED"
