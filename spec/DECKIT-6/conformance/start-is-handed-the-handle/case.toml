case = 3
name = "start-is-handed-the-handle"
note = "The system starts the system's lifecycle by calling start with the handle. The start of mod-b hands the host an address through the handle it is handed, so once the launch mod-a asks for is answered the host has been handed it."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-b"]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://example.com/started", activates = true }]
