case = 3
name = "a-start-whose-promise-is-rejected-is-refused-at-launch"
note = "A run whose start answers a promise that is rejected fails to launch. The start of mod-b answers a promise rejected after it has answered, so the launch mod-a asks for is refused at launch with NOT_LAUNCHED."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-b"]

[step.expect]
refuses = "launch"
kind = "NOT_LAUNCHED"
