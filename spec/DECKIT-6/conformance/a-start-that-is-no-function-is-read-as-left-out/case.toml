case = 3
name = "a-start-that-is-no-function-is-read-as-left-out"
note = "A member the system reads of the instance that is not a function is read as one left out. The instance of mod-b has a start that is a string, so mod-b runs once the launch mod-a asks for is answered."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-b"]

[[step]]
look = "run"
mod = "mod-b"

[step.expect]
answers = "running"
