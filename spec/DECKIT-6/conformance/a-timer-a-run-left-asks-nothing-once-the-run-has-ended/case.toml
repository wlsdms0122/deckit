case = 3
name = "a-timer-a-run-left-asks-nothing-once-the-run-has-ended"
note = "Once a run's code has ended it, its sandbox has ended, and nothing its code left asks anything. The stop of mod-b sets a timer that hands the host an address each second and answers at once; mod-a then launches mod-c, whose start waits 2 seconds, so the timer would have gone off before the look."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b", "mod-c"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-b"]

[[step]]
input = "call"
mod = "mod-a"
member = "mods.quit"
args = ["mod-b"]

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-c"]

[[step]]
look = "opened"

[step.expect]
answers = []
