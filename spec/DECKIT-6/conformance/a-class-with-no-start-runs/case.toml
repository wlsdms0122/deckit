case = 3
name = "a-class-with-no-start-runs"
note = "Each member the system reads of the instance may be left out, and an instance with no start has started the system's lifecycle once it is made. mod-b, whose class has no member, runs once the launch mod-a asks for is answered."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-b"]

[[step]]
look = "run"
mod = "mod-b"

[step.expect]
answers = "running"
