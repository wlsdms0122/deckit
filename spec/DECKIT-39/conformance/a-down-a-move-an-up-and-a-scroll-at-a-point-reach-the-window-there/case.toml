case = 26
name = "a-down-a-move-an-up-and-a-scroll-at-a-point-reach-the-window-there"
note = "Each mod's code opens the windows the case says, each filled by a text field, and opens https://said.test/<name>/<event>/<what> outside the app for what the window's content hears: mousedown and mouseup with <button>/<detail>/<modifiers>, mousemove with <buttons>, wheel with <deltaX>/<deltaY>, keydown and keyup with <code>/<key>/<modifiers>/<repeat>, compositionstart and compositionupdate with the text composed, compositionend with <the text>/<the field's value>, and inserted with the text of each input event of the type insertText. The desktop is the base shell's, 1280 by 800. ada sits at s1. It sends a down at 600, 300, in main, a move to 610, 310 with the button held, the up there and a scroll at 600, 300: each answers over the window 1 and at its point, the down alone key and holder, and main's content hears each."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = 1, buttons = [0] }

[step.expect]
answers = { over = 1, key = "key", holder = "s1", at = { x = 600, y = 300 } }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "move", x = 610, y = 310, buttons = [0] }

[step.expect]
answers = { over = 1, at = { x = 610, y = 310 } }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 610, y = 310, button = 0, count = 1 }

[step.expect]
answers = { over = 1, at = { x = 610, y = 310 } }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "scroll", x = 600, y = 300, dx = 0, dy = 10 }

[step.expect]
answers = { over = 1, at = { x = 600, y = 300 } }

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/mousedown/0/1/", activates = true }, { url = "https://said.test/main/mousemove/1", activates = true }, { url = "https://said.test/main/mouseup/0/1/", activates = true }, { url = "https://said.test/main/wheel/0/10", activates = true }]
