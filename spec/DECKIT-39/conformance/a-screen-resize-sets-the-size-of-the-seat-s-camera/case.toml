case = 26
name = "a-screen-resize-sets-the-size-of-the-seat-s-camera"
note = "Each mod's code opens the windows the case says, each filled by a text field, and opens https://said.test/<name>/<event>/<what> outside the app for what the window's content hears: mousedown and mouseup with <button>/<detail>/<modifiers>, mousemove with <buttons>, wheel with <deltaX>/<deltaY>, keydown and keyup with <code>/<key>/<modifiers>/<repeat>, compositionstart and compositionupdate with the text composed, compositionend with <the text>/<the field's value>, and inserted with the text of each input event of the type insertText. The desktop is the base shell's, 1280 by 800, and each seat's camera is 1280 by 800 at 0,0 as it opens. mod-a opens main, and ada sits at s1. It scrolls 100 down on the desktop, its camera then at 0, 100, and tells its screen 1000 by 600: it answers its camera, at 0, 100 still, 1000 by 600."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "scroll", x = 100, y = 50, dx = 0, dy = 100 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "screen", type = "resize", width = 1000, height = 600 }

[step.expect]
answers = { x = 0, y = 100, width = 1000, height = 600 }
