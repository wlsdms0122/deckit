case = 26
name = "a-press-of-another-seat-on-a-seat-s-key-window-leaves-it-the-seat-s"
note = "Nothing of another seat changes a seat's key window. ada, at s1, presses main, its key window from then. The person then presses main: the party of s1 is told nothing, and the look windows answers main key for s1 still, and key for the local seat."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = 1 }

[step.expect]
answers = { over = 1, key = true, at = { x = 600, y = 300 } }

[[step]]
look = "told"
party = "p"
part = "messages"

[step.expect]
answers = []

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
look = "told"
party = "p"
part = "messages"

[step.expect]
answers = []

[[step]]
look = "windows"
seat = "s1"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = true, minimized = false }]

[[step]]
look = "windows"
seat = "local"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = true, minimized = false }]
