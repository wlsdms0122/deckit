case = 26
name = "a-key-of-a-seat-with-no-key-window-answers-to-nothing"
note = "mod-a opens the window main and ada sits at s1 and presses nothing, so nothing holds the keyboard of s1: a key down answers to null, which a case reads as an answer with no key to."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "key", type = "down", code = "KeyA", key = "a" }

[step.expect]
answers = {}

[[step]]
look = "windows"
seat = "s1"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = false, minimized = false }]
