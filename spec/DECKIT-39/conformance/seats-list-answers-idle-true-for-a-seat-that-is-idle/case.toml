case = 26
name = "seats-list-answers-idle-true-for-a-seat-that-is-idle"
note = "seats.list answers under idle whether a seat is idle. With the idle time 0 every seat is idle at once: the local seat and ada's are both answered idle true."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { idleTime = 0 }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "call"
mod = "mod-a"
member = "seats.list"
handle = "shell"

[step.expect]
answers = [{ id = "1", name = "Deckit conformance", colour = "blue", idle = true, following = false }, { id = "2", name = "Ada Lovelace", colour = "green", idle = true, following = false }]
