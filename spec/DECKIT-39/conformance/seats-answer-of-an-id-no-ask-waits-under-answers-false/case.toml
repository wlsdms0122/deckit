case = 26
name = "seats-answer-of-an-id-no-ask-waits-under-answers-false"
note = "seats.answer answers false, and nothing is done, where no ask of the id waits. ada sits at the seat of the id 2, which is a seat's id and no ask's, and no id 9 was given: each answers false, and the seats stand as they were."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "call"
mod = "mod-a"
member = "seats.answer"
handle = "shell"
args = ["2", false]

[step.expect]
answers = false

[[step]]
input = "call"
mod = "mod-a"
member = "seats.answer"
handle = "shell"
args = ["9", true]

[step.expect]
answers = false

[[step]]
input = "call"
mod = "mod-a"
member = "seats.list"
handle = "shell"

[step.expect]
answers = [{ id = "1", name = "Deckit conformance", colour = "blue", idle = false, following = false }, { id = "2", name = "Ada Lovelace", colour = "green", idle = false, following = false }]
