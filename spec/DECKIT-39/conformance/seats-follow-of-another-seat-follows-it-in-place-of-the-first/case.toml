case = 26
name = "seats-follow-of-another-seat-follows-it-in-place-of-the-first"
note = "The host app's window follows one seat at most. While it follows ada's seat, seats.follow of bob's follows bob's in its place: seats.list answers following true for bob's seat alone."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }, { id = "bob", name = "Bob Kahn" }]
keys = [{ principal = "ada", key = "first" }, { principal = "bob", key = "second" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "attach"
party = "q"
principal = "bob"
key = "second"

[[step]]
input = "call"
mod = "mod-a"
member = "seats.follow"
handle = "shell"
args = ["2"]

[step.expect]
answers = true

[[step]]
input = "call"
mod = "mod-a"
member = "seats.follow"
handle = "shell"
args = ["3"]

[step.expect]
answers = true

[[step]]
input = "call"
mod = "mod-a"
member = "seats.list"
handle = "shell"

[step.expect]
answers = [{ id = "1", name = "Deckit conformance", colour = "blue", idle = false, following = false }, { id = "2", name = "Ada Lovelace", colour = "green", idle = false, following = false }, { id = "3", name = "Bob Kahn", colour = "orange", idle = false, following = true }]
