case = 29
name = "a-window-opens-in-the-camera-of-the-seat-its-mod-acts-for"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event <mod>:go tells it. mod-b opens no window and has reopen(), which opens https://said.test/reopen/mod-b outside the app and opens the window again. The desktop is the base shell's, 1280 by 800, and each seat's camera is 1280 by 800 at 0,0 as it opens. ada sits at s1. It scrolls 1000 down on the desktop, its camera then at 0, 1000 and its zoom area { x = 6, y = 1000, width = 1274, height = 800 }, and clicks mod-b's item: reopen() opens again centred in that zoom area, at 283, 1107, key for s1."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-b"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "scroll", x = 100, y = 50, dx = 0, dy = 1000 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "dock.mod-b", button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "dock.mod-b", button = 0, count = 1 }

[[step]]
look = "windows"
seat = "s1"

[step.expect]
answers = [{ mod = "mod-b", name = "again", level = "normal", frame = { x = 283, y = 1107, width = 720, height = 480 }, key = true, minimized = false }]
