case = 26
name = "a-press-of-a-seat-on-an-item-of-the-dock-reaches-the-dock"
note = "A pointer event answers under over what it reached, dock for the Dock. A party's seat presses the item of mod-b at its ref and lets go there: each answers dock, and the up answers what the down reached."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b", "mod-c"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "dock.mod-b", button = 0, count = 1 }
part = "over"

[step.expect]
answers = "dock"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "dock.mod-b", button = 0, count = 1 }
part = "over"

[step.expect]
answers = "dock"
