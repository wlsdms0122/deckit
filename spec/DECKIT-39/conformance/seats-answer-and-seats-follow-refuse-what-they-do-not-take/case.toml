case = 26
name = "seats-answer-and-seats-follow-refuse-what-they-do-not-take"
note = "A member of shell.seats handed what it does not take is refused at call with kind INVALID_ARGUMENT: seats.answer with an ask that is no string or an allow that is no boolean, and seats.follow with a seat that is a number."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "seats.answer"
handle = "shell"
args = [2, true]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
input = "call"
mod = "mod-a"
member = "seats.answer"
handle = "shell"
args = ["2", "yes"]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
input = "call"
mod = "mod-a"
member = "seats.follow"
handle = "shell"
args = [7]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
