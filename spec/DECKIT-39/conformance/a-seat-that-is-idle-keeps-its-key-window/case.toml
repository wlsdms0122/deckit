case = 26
name = "a-seat-that-is-idle-keeps-its-key-window"
note = "Whether a seat is idle changes no seat's key window. With the idle time 0 every seat is idle at once. The person presses main, so it is the local seat's key window. ada, at s1, presses main: the press answers key true, and the look windows answers main key for s1 and key for the local seat still."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { idleTime = 0 }

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = 1 }

[step.expect]
answers = { over = 1, key = true, at = { x = 600, y = 300 } }

[[step]]
look = "windows"
seat = "s1"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = true, minimized = false }]

[[step]]
look = "windows"
seat = "local"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = true, minimized = false }]
