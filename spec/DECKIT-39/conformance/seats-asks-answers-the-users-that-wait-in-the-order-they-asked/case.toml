case = 26
name = "seats-asks-answers-the-users-that-wait-in-the-order-they-asked"
note = "seats.asks answers the users that wait for an answer, in the order they asked, each with the id of its ask and the user's name. With asking true, ada and then bob attach and wait: mod-a reads two asks, whose ids go on the count the local seat's id began, and seats.list answers the local seat alone, since neither sits."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }, { id = "bob", name = "Bob Kahn" }]
keys = [{ principal = "ada", key = "first" }, { principal = "bob", key = "second" }]
seats = { asking = true }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
waits = true

[[step]]
input = "attach"
party = "q"
principal = "bob"
key = "second"
waits = true

[[step]]
input = "call"
mod = "mod-a"
member = "seats.asks"
handle = "shell"

[step.expect]
answers = [{ id = "2", name = "Ada Lovelace" }, { id = "3", name = "Bob Kahn" }]

[[step]]
input = "call"
mod = "mod-a"
member = "seats.list"
handle = "shell"

[step.expect]
answers = [{ id = "1", name = "Deckit conformance", colour = "blue", idle = false, following = false }]
