case = 26
name = "seats-follow-of-a-seat-that-is-no-string-is-refused"
note = "seats.follow handed a seat that is neither a string nor null is refused at call with kind INVALID_ARGUMENT: here a number."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "seats.follow"
handle = "shell"
args = [7]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
