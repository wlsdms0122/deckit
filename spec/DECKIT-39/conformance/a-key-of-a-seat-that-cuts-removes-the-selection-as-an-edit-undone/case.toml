case = 32
name = "a-key-of-a-seat-that-cuts-removes-the-selection-as-an-edit-undone"
note = "mod-a's code opens the window main, filled by a text field, and opens https://said.test/main/<event>/<what> outside the app for what its content hears: keydown with <code>, paste with the plain text it carries, copy and cut, and edited with the field's value after each input event. The desktop is the base shell's, 1280 by 800. ada sits at s1. It presses main, sends the text event insert with ab, a down of KeyA with the key a, meta held, which selects all, a down of KeyX with the key x, meta held, the key that cuts on the machine of the base shell, and a down of KeyZ with the key z, meta held, which undoes: main's content hears the cut, its field is empty, and the undo puts ab back."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "text", type = "insert", text = "ab" }

[step.expect]
answers = { to = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "key", type = "down", code = "KeyA", key = "a", modifiers = ["meta"] }

[step.expect]
answers = { to = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "key", type = "down", code = "KeyX", key = "x", modifiers = ["meta"] }

[step.expect]
answers = { to = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "key", type = "down", code = "KeyZ", key = "z", modifiers = ["meta"] }

[step.expect]
answers = { to = 1 }

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/edited/ab", activates = true }, { url = "https://said.test/main/keydown/KeyA", activates = true }, { url = "https://said.test/main/keydown/KeyX", activates = true }, { url = "https://said.test/main/cut", activates = true }, { url = "https://said.test/main/edited/", activates = true }, { url = "https://said.test/main/keydown/KeyZ", activates = true }, { url = "https://said.test/main/edited/ab", activates = true }]
