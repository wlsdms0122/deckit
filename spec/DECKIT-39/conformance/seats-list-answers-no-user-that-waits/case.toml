case = 26
name = "seats-list-answers-no-user-that-waits"
note = "A mod granted deckit.seats reads who sits and no ask: the ask is the machine's. With asking true, ada and then bob attach and wait: seats.list answers the local seat alone, since neither sits."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }, { id = "bob", name = "Bob Kahn" }]
keys = [{ principal = "ada", key = "first" }, { principal = "bob", key = "second" }]
seats = { asking = true }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
waits = true

[[step]]
input = "attach"
party = "q"
principal = "bob"
key = "second"
waits = true

[[step]]
input = "call"
mod = "mod-a"
member = "seats.list"
handle = "shell"

[step.expect]
answers = [{ id = "1", name = "Deckit conformance", colour = "blue", idle = false, following = false }]
