case = 26
name = "a-commit-ends-the-composing-and-keeps-what-was-composed"
note = "Each mod's code opens the windows the case says, each filled by a text field, and opens https://said.test/<name>/<event>/<what> outside the app for what the window's content hears: mousedown and mouseup with <button>/<detail>/<modifiers>, mousemove with <buttons>, wheel with <deltaX>/<deltaY>, keydown and keyup with <code>/<key>/<modifiers>/<repeat>, compositionstart and compositionupdate with the text composed, compositionend with <the text>/<the field's value>, and inserted with the text of each input event of the type insertText. The desktop is the base shell's, 1280 by 800. ada sits at s1. It presses main, composes c and then cd, and commits with the text zz: the composing ends with cd, the text last composed, in the field, and the text the commit wrote is not read."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "text", type = "compose", text = "c" }

[step.expect]
answers = { to = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "text", type = "compose", text = "cd" }

[step.expect]
answers = { to = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "text", type = "commit", text = "zz" }

[step.expect]
answers = { to = 1 }

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/mousedown/0/1/", activates = true }, { url = "https://said.test/main/mouseup/0/1/", activates = true }, { url = "https://said.test/main/compositionstart/", activates = true }, { url = "https://said.test/main/compositionupdate/c", activates = true }, { url = "https://said.test/main/compositionupdate/cd", activates = true }, { url = "https://said.test/main/compositionend/cd/cd", activates = true }]
