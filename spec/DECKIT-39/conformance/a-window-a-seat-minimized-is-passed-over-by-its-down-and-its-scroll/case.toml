case = 26
name = "a-window-a-seat-minimized-is-passed-over-by-its-down-and-its-scroll"
note = "A down and a scroll reach what lies at the point in the seat's order, the windows it minimized left out. A party's seat presses second, in front at 600, 300, and sends the key KeyM with meta held, the chord that minimizes the key window: second is minimized for that seat alone. Its down and its scroll at the same point then answer main, the window under it, and second stays on the local seat's desktop."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = 1 }

[step.expect]
answers = { over = 2, key = true, at = { x = 600, y = 300 } }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "key", type = "down", code = "KeyM", key = "m", modifiers = ["meta"] }

[step.expect]
answers = { to = 2 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "key", type = "up", code = "KeyM", key = "m", modifiers = ["meta"] }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = 1 }

[step.expect]
answers = { over = 1, key = true, at = { x = 600, y = 300 } }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "scroll", x = 600, y = 300, dx = 0, dy = 40 }

[step.expect]
answers = { over = 1, at = { x = 600, y = 300 } }

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = false, minimized = false }, { mod = "mod-a", name = "second", level = "normal", frame = { x = 307, y = 131, width = 720, height = 480 }, key = false, minimized = false }]

[[step]]
look = "windows"
seat = "s1"

[step.expect]
answers = [{ mod = "mod-a", name = "second", level = "normal", frame = { x = 307, y = 131, width = 720, height = 480 }, key = false, minimized = true }, { mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = true, minimized = false }]
