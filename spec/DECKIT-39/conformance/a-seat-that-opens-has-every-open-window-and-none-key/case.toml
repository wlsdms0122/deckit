case = 26
name = "a-seat-that-opens-has-every-open-window-and-none-key"
note = "mod-a opens the window main and the person presses it, so it is the local seat's key window. ada then sits at s1: the look windows of s1 answers main on its desktop, not minimized and not key, and that of the local seat answers it key still."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
look = "windows"
seat = "s1"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = false, minimized = false }]

[[step]]
look = "windows"
seat = "local"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = true, minimized = false }]
