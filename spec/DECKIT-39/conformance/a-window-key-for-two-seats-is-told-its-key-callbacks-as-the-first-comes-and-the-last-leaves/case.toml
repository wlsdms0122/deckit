case = 26
name = "a-window-key-for-two-seats-is-told-its-key-callbacks-as-the-first-comes-and-the-last-leaves"
note = "mod-a opens main, the window 1 at 283, 107, and then second, the window 2 at 307, 131, each 720 by 480, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app. ada, at s1, and bob, at s2, each press at 290, 300, where main alone lies: main is the key window of both. ada and then bob press at 1010, 300, where second alone lies. main is told didBecomeKey once, as it becomes the key window of s1, and nothing as it becomes that of s2; second is told didBecomeKey once, as ada's press makes it the key window of s1; and main is told didResignKey once, as bob's press leaves it the key window of no seat."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }, { id = "bob", name = "Bob Kahn" }]
keys = [{ principal = "ada", key = "first" }, { principal = "bob", key = "second" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "attach"
party = "q"
principal = "bob"
key = "second"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 290, y = 300, button = 0, count = 1 }

[step.expect]
answers = { over = 1, key = true, at = { x = 290, y = 300 } }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 290, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "q"
method = "seat/input"
params = { event = "pointer", type = "down", x = 290, y = 300, button = 0, count = 1 }

[step.expect]
answers = { over = 1, key = true, at = { x = 290, y = 300 } }

[[step]]
input = "ask"
party = "q"
method = "seat/input"
params = { event = "pointer", type = "up", x = 290, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 1010, y = 300, button = 0, count = 1 }

[step.expect]
answers = { over = 2, key = true, at = { x = 1010, y = 300 } }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 1010, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "q"
method = "seat/input"
params = { event = "pointer", type = "down", x = 1010, y = 300, button = 0, count = 1 }

[step.expect]
answers = { over = 2, key = true, at = { x = 1010, y = 300 } }

[[step]]
input = "ask"
party = "q"
method = "seat/input"
params = { event = "pointer", type = "up", x = 1010, y = 300, button = 0, count = 1 }

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/didAppear", activates = true }, { url = "https://said.test/second/didAppear", activates = true }, { url = "https://said.test/main/didBecomeKey", activates = true }, { url = "https://said.test/second/didBecomeKey", activates = true }, { url = "https://said.test/main/didResignKey", activates = true }]
