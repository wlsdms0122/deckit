case = 26
name = "a-key-is-heard-with-its-modifiers-and-as-a-repeat"
note = "A key event may take modifiers and repeat, and the content is told the key by them. A party's seat presses main and sends a down of KeyA with the key A, shift held, as a repeat: the content hears a keydown of that code and key, with shift held and as a repeat, and the text the key makes is put in its field."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "key", type = "down", code = "KeyA", key = "A", modifiers = ["shift"], repeat = true }

[step.expect]
answers = { to = 1 }

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/mousedown/0/1/", activates = true }, { url = "https://said.test/main/mouseup/0/1/", activates = true }, { url = "https://said.test/main/keydown/KeyA/A/shift/true", activates = true }, { url = "https://said.test/main/inserted/A", activates = true }]
