case = 26
name = "seats-answer-answers-an-ask-no-member-read-before"
note = "An ask has its id from the moment it begins to wait, whether or not a mod read seats.asks. With asking true ada attaches and waits, the first ask of the start beside the local seat, so its id is 2. mod-a, which read nothing, answers 2 yes: seats.answer answers true and ada sits. Answered again, the id names no ask that waits: false."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { asking = true }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
waits = true

[[step]]
input = "call"
mod = "mod-a"
member = "seats.answer"
handle = "shell"
args = ["2", true]

[step.expect]
answers = true

[[step]]
look = "admitted"
party = "p"
part = "seat"

[step.expect]
answers = { id = "s1", local = false, user = { id = "ada", name = "Ada Lovelace" } }

[[step]]
input = "call"
mod = "mod-a"
member = "seats.answer"
handle = "shell"
args = ["2", true]

[step.expect]
answers = false
