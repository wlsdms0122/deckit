case = 25
name = "seat-watch-turned-off-for-an-output-not-watched-answers-true"
note = "seat/watch answers true for an output that is told, with on false as with on true: changes, which the seat of ada did not watch, is watched no more."

[host]
base = "shell"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/watch"
params = { of = "changes", on = false }

[step.expect]
answers = true
