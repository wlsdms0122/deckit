case = 26
name = "a-key-of-a-seat-that-pressed-a-panel-window-in-the-bar-goes-to-its-key-window"
note = "Each mod's code opens the windows the case says, each filled by a text field, and opens https://said.test/<name>/<event>/<what> outside the app for what the window's content hears: mousedown and mouseup with <button>/<detail>/<modifiers>, mousemove with <buttons>, wheel with <deltaX>/<deltaY>, keydown and keyup with <code>/<key>/<modifiers>/<repeat>, compositionstart and compositionupdate with the text composed, compositionend with <the text>/<the field's value>, and inserted with the text of each input event of the type insertText. The desktop is the base shell's, 1280 by 800, under a bar 52 high. ada sits at s1. mod-a opens main and p, a panel window 120 by 32 in the bar, which stands at 1152, 10. ada presses at 600, 300, in main, the window 1, and then at 1200, 20, in p, the window 2, and sends the key b down: a panel window in the bar holds no seat's keyboard, so the key answers to the window 1: p's content hears the press, and main's the key."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
bar = 52

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 1200, y = 20, button = 0, count = 1 }

[step.expect]
answers = { over = 2, key = false, at = { x = 1200, y = 20 } }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 1200, y = 20, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "key", type = "down", code = "KeyB", key = "b" }

[step.expect]
answers = { to = 1 }

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/mousedown/0/1/", activates = true }, { url = "https://said.test/main/mouseup/0/1/", activates = true }, { url = "https://said.test/p/mousedown/0/1/", activates = true }, { url = "https://said.test/p/mouseup/0/1/", activates = true }, { url = "https://said.test/main/keydown/KeyB/b//false", activates = true }, { url = "https://said.test/main/inserted/b", activates = true }]
