case = 26
name = "a-seat-and-an-ask-take-their-ids-from-one-count"
note = "The shell gives an id to each seat as it opens and to each ask as it begins to wait, from one count. With asking true, the local seat has the id 1 and ada's ask the id 2; answered yes, ada sits at a seat that takes the next id, 3, and the id 2 is given to nothing again."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { asking = true }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
waits = true

[[step]]
input = "call"
mod = "mod-a"
member = "seats.asks"
handle = "shell"

[step.expect]
answers = [{ id = "2", name = "Ada Lovelace" }]

[[step]]
input = "call"
mod = "mod-a"
member = "seats.answer"
handle = "shell"
args = ["2", true]

[step.expect]
answers = true

[[step]]
input = "call"
mod = "mod-a"
member = "seats.list"
handle = "shell"

[step.expect]
answers = [{ id = "1", name = "Deckit conformance", colour = "blue", idle = false, following = false }, { id = "3", name = "Ada Lovelace", colour = "green", idle = false, following = false }]

[[step]]
input = "call"
mod = "mod-a"
member = "seats.asks"
handle = "shell"

[step.expect]
answers = []
