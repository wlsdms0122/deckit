case = 25
name = "seat-input-of-an-event-that-is-none-is-refused"
note = "seat/input is refused at call with INVALID_ARGUMENT where event names no kind of device the shell names: it names pointer, key and text, and here it is wheel."

[host]
base = "shell"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "wheel", type = "down" }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
