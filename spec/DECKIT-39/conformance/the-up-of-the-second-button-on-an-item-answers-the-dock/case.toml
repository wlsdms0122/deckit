case = 26
name = "the-up-of-the-second-button-on-an-item-answers-the-dock"
note = "The up that ends a press answers what its down reached, whichever button it is of. A party's seat presses the second button on the item of mod-b at its ref and lets it go there: each answers dock."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b", "mod-c"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "dock.mod-b", button = 2, count = 1 }
part = "over"

[step.expect]
answers = "dock"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "dock.mod-b", button = 2, count = 1 }
part = "over"

[step.expect]
answers = "dock"
