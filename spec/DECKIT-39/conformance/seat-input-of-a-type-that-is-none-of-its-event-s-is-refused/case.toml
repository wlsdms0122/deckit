case = 25
name = "seat-input-of-a-type-that-is-none-of-its-event-s-is-refused"
note = "seat/input is refused at call with INVALID_ARGUMENT where type is none of the kind's the shell names: a key event is down or up, and here it is press."

[host]
base = "shell"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "key", type = "press", code = "KeyA", key = "a" }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
