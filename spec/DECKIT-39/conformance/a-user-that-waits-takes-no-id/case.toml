case = 31
name = "a-user-that-waits-takes-no-id"
note = "The shell gives an id to each seat as it opens, and to nothing else. With asking true, ada attaches and waits, and whoever is at the machine answers yes: the local seat has the id 1, and ada's seat the next, 2."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { asking = true }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
waits = true

[[step]]
input = "answer"
party = "p"
allow = true

[[step]]
look = "admitted"
party = "p"
part = "seat"

[step.expect]
answers = { id = "s1", local = false, user = { id = "ada", name = "Ada Lovelace" } }

[[step]]
input = "call"
mod = "mod-a"
member = "seats.list"
handle = "shell"

[step.expect]
answers = [{ id = "1", name = "Deckit conformance", colour = "blue", idle = false, following = false }, { id = "2", name = "Ada Lovelace", colour = "green", idle = false, following = false }]
