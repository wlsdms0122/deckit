case = 26
name = "seats-onchange-calls-its-listener-as-a-seat-opens"
note = "seats.onChange calls its listener with nothing as what seats.list answers changes. mod-a registers a listener and ada attaches and sits: the listener is called once, with no value."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "seats.onChange"
handle = "shell"
listener = true

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = [[]]
