case = 26
name = "a-key-of-a-seat-held-from-the-window-it-pressed-is-refused-held"
note = "The local seat holds main and is not idle. ada, at s1, presses main and is held from it, then sends a key down: the key is refused at call with kind HELD."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = 1 }

[step.expect]
answers = { over = 1, key = "held", holder = "local", at = { x = 600, y = 300 } }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "key", type = "down", code = "KeyA", key = "a" }

[step.expect]
refuses = "call"
kind = "HELD"
