case = 26
name = "a-pointer-event-with-a-button-or-a-count-below-0-is-refused"
note = "mod-a opens main, the window 1 at 283, 107, 720 by 480, filled by a text field. ada sits at s1 and sends a pointer down on main with the button -1, then one with the count -1: each is refused at call with kind INVALID_ARGUMENT, as a button and a count are counts."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = -1, count = 1 }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = -1 }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
