case = 29
name = "a-point-outside-the-seat-s-camera-reaches-nothing"
note = "Each mod's code opens the windows the case says, each filled by a text field, and opens https://said.test/<name>/<event>/<what> outside the app for what the window's content hears: mousedown and mouseup with <button>/<detail>/<modifiers>, mousemove with <buttons>, wheel with <deltaX>/<deltaY>, keydown and keyup with <code>/<key>/<modifiers>/<repeat>, compositionstart and compositionupdate with the text composed, compositionend with <the text>/<the field's value>, and inserted with the text of each input event of the type insertText. The desktop is the base shell's, 1280 by 800, and each seat's camera is 1280 by 800 at 0,0 as it opens. mod-a opens main, the window 1 at 283, 107, 720 by 480, and ada sits at s1. It scrolls 1000 down on the desktop, its camera then at 0, 1000, and sends a down at 600, 300, in main's frame and outside the camera: it answers over null, and main is not its key window."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "scroll", x = 100, y = 50, dx = 0, dy = 1000 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = 1 }

[step.expect]
answers = { at = { x = 600, y = 300 } }

[[step]]
look = "windows"
seat = "s1"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = false, minimized = false }]
