case = 26
name = "a-window-as-data-holds-what-its-lines-say"
note = "mod-a opens the window 1 at 283, 107, 720 by 480, with no title. Its content holds, each in a box of its own: the heading Notes, the button Bold, not pressed, the field Name with the value say \"a\", b, the empty field Find, the checkbox Done, the list Days of Mon, Tue and Wed, and the region Log, 60 high, that scrolls three paragraphs 40 high each. The desktop is the base shell, 1280 by 800, and ada sits at s1. It reads the window with format json: data holds the window, its parts, and its documents, each with the table of every element, and the mark."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1", format = "json" }

[step.expect]
answers = { data = { window = { kind = "window", id = "w1", title = "mod-a", mod = "mod-a", frame = { x = 283, y = 107, width = 720, height = 480 }, minimized = false, zoomed = false }, parts = [{ depth = 0, role = "button", name = "Close", states = [], ref = "w1.close" }, { depth = 0, role = "button", name = "Minimize", states = [], ref = "w1.minimize" }, { depth = 0, role = "button", name = "Zoom", states = [], ref = "w1.zoom" }, { depth = 0, role = "titlebar", states = [], ref = "w1.bar" }], documents = [{ document = 1, part = "content", width = 720, height = 480, lines = [{ depth = 0, role = "heading", states = ["level 1"], name = "Notes", ref = "1.1" }, { depth = 0, role = "button", states = ["not pressed"], name = "Bold", ref = "1.2" }, { depth = 0, role = "textbox", states = ["value \"say \\\"a\\\", b\""], name = "Name", ref = "1.3" }, { depth = 0, role = "textbox", states = ["value \"\""], name = "Find", ref = "1.4" }, { depth = 0, role = "checkbox", states = ["unchecked"], name = "Done", ref = "1.5" }, { depth = 0, role = "list", states = [], name = "Days", items = 3, inView = 3, ref = "1.6" }, { depth = 1, role = "listitem", states = [], name = "Mon", ref = "1.7" }, { depth = 1, role = "listitem", states = [], name = "Tue", ref = "1.8" }, { depth = 1, role = "listitem", states = [], name = "Wed", ref = "1.9" }, { depth = 0, role = "region", states = [], name = "Log", ref = "1.10" }] }], mark = 7 }, mark = 7 }
