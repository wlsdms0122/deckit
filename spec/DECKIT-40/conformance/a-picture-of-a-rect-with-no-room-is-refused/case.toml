case = 26
name = "a-picture-of-a-rect-with-no-room-is-refused"
note = "Each mod-a opens the windows the case says, each filled by a text field: main, the window 1 at 283, 107, 720 by 480. The desktop is the base shell, 1280 by 800, and ada sits at s1. It reads a picture of a rect whose width is 0. It is refused at call with kind INVALID_ARGUMENT."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "picture", rect = { x = 0, y = 0, width = 0, height = 10 } }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
