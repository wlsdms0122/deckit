case = 26
name = "changes-after-an-item-left-the-dock-list-it-gone-by-its-ref"
note = "Each mod opens the windows the case says. The desktop is the base shell, 1280 by 800, and ada sits at s1. mod-a opens main, the window 1, and mod-b opens none. ada reads the desktop at the mark 8. The person quits mod-b from its item and takes the item out of the Dock, and ada asks what changed since 8: the item told gone by its ref."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "desktop" }
part = "mark"

[step.expect]
answers = 8

[[step]]
input = "dock"
mod = "mod-b"
action = "quit"

[[step]]
input = "dock"
mod = "mod-b"
action = "remove"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "changes", since = 8 }

[step.expect]
answers = { text = "changes 8 to 10\n- dock.mod-b", mark = 10 }
