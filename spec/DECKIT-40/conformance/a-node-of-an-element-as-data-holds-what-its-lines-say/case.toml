case = 26
name = "a-node-of-an-element-as-data-holds-what-its-lines-say"
note = "mod-a opens the window 1 at 283, 107, 720 by 480, with no title. Its content holds, each in a box of its own: the heading Notes, the button Bold, not pressed, the field Name with the value say \"a\", b, the empty field Find, the checkbox Done, the list Days of Mon, Tue and Wed, and the region Log, 60 high, that scrolls three paragraphs 40 high each. The desktop is the base shell, 1280 by 800, and ada sits at s1. It reads the window, then the node of the region Log with format json: data holds the node, its table with depth 0, its rect on the desktop, its scroll, its lines of text at depth 1, and the mark."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }
part = "mark"

[step.expect]
answers = 7

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "1.10", format = "json" }

[step.expect]
answers = { data = { node = { depth = 0, role = "region", states = [], name = "Log", ref = "1.10" }, rect = { x = 283, y = 487, width = 200, height = 60 }, scroll = { top = 0, height = 120, left = 0, width = 200 }, lines = [{ depth = 1, role = "text", name = "First line." }, { depth = 1, role = "text", name = "Second line." }], mark = 7 }, mark = 7 }
