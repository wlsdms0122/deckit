case = 29
name = "changes-after-a-seat-closed-list-it-gone-by-its-id"
note = "Each mod opens the windows the case says. The desktop is the base shell, 1280 by 800, and ada sits at s1. mod-a opens main, the window 1. bob sits at s2, and ada reads the desktop at the mark 8. bob detaches, and ada asks what changed since 8: the seat s2 is told gone by its id."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }, { id = "bob", name = "Bob Kahn" }]
keys = [{ principal = "ada", key = "first" }, { principal = "bob", key = "second" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "attach"
party = "q"
principal = "bob"
key = "second"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "desktop" }
part = "mark"

[step.expect]
answers = 8

[[step]]
input = "detach"
party = "q"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "changes", since = 8 }
part = "text"

[step.expect]
answers = "changes 8 to \u001A\n- s2"
