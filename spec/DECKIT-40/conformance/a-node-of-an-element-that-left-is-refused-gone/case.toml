case = 26
name = "a-node-of-an-element-that-left-is-refused-gone"
note = "mod-a opens the window 1 at 283, 107, 720 by 480, with no title. Its content holds, each in a box of its own: the heading Notes, the button Bold, not pressed, the field Name with the value say \"a\", b, the empty field Find, the checkbox Done, the list Days of Mon, Tue and Wed, and the region Log, 60 high, that scrolls three paragraphs 40 high each. The desktop is the base shell, 1280 by 800, and ada sits at s1. It reads the window. Then mod-a sends its event drop, and at it the page takes the heading out. It reads the node of the ref the heading had. It is refused at call with kind GONE."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }
part = "mark"

[step.expect]
answers = 7

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["drop"]

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "7.1" }

[step.expect]
refuses = "call"
kind = "GONE"
