case = 26
name = "a-picture-of-a-ref-is-at-what-it-names"
note = "Each mod opens the windows the case says. The desktop is the base shell, 1280 by 800, and ada sits at s1. mod-a opens main, the window 1 at 283, 107. A picture of w1.bar, its title bar, has its top left at the frame's top left."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "picture", ref = "w1.bar" }
part = "at"

[step.expect]
answers = { x = 283, y = 107 }
