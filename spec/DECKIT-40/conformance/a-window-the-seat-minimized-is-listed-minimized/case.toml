case = 29
name = "a-window-the-seat-minimized-is-listed-minimized"
note = "Each mod-a opens the windows the case says, each filled by a text field: main, the window 1 at 283, 107, 720 by 480, and second, titled Second, the window 2 at 307, 131, in front of it; mod-b opens none. The desktop is the base shell, 1280 by 800, and ada sits at s1. It presses the button w1.minimize and reads the desktop: the window 1 is still listed, where it is in the seat order, with the state minimized."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "w1.minimize", button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "w1.minimize", button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "desktop" }
part = "text"

[step.expect]
answers = "desktop at 0,0 1280x800 mark \u001A\nseat local \"Deckit conformance\" blue\nseat s1 \"Ada Lovelace\" green at 327,131 key w2 (you)\ndock (2 items)\n  item \"mod-a\" [running, active] dock.mod-a\n  item \"mod-b\" [running] dock.mod-b\nwindow w1 \"mod-a\" mod-a at 283,107 720x480 [minimized]\nwindow w2 \"Second\" mod-a at 307,131 720x480 [key s1]"
