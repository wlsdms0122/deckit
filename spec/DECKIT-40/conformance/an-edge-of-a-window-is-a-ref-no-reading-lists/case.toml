case = 26
name = "an-edge-of-a-window-is-a-ref-no-reading-lists"
note = "Each mod-a opens the windows the case says, each filled by a text field: main, the window 1 at 283, 107, 720 by 480. The desktop is the base shell, 1280 by 800, and ada sits at s1. It reads the node w1.edge.top-left, a ref that no reading of the window lists: it reads as edge, named by the corner, with its place."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "w1.edge.top-left" }

[step.expect]
answers = { text = "edge \"top-left\" w1.edge.top-left at 271,95 24x24", mark = 7 }
