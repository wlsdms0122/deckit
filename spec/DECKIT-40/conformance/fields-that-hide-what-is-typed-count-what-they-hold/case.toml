case = 26
name = "fields-that-hide-what-is-typed-count-what-they-hold"
note = "mod-a opens the window 1 at 283, 107, 720 by 480. Its content holds, each in a box of its own: the field Secret, of the type password, holding abc; Draft, editable content that holds Hello; the field Span, holding abcdef with bcd selected; the empty field Auto, which the page focuses as the window appears; the region Feed, 60 high, that scrolls the buttons One, Two and Three, 40 high each; and an element of the role note that holds Aside. The desktop is the base shell, 1280 by 800, ada sits at s1, and no seat pressed the window. The window is read with all: Secret and Draft write text and how many characters each holds, and no value; Auto is focused with no seat, as no seat's keys go to its document; Three, out of view in Feed, is listed too, and the note, which has no name."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1", all = true }

[step.expect]
answers = { text = "window w1 \"mod-a\" mod-a at 283,107 720x480 mark 7\n  button \"Close\" w1.close\n  button \"Minimize\" w1.minimize\n  button \"Zoom\" w1.zoom\n  titlebar w1.bar\n  document 1 content 720x480\n    textbox \"Secret\" [text 3] 1.1\n    textbox \"Draft\" [text 5] 1.2\n    textbox \"Span\" [value \"abcdef\"] 1.3\n    textbox \"Auto\" [focused, value \"\"] 1.4\n    region \"Feed\" 1.5\n      button \"One\" 1.6\n      button \"Two\" 1.7\n      button \"Three\" 1.8\n    note 1.9", mark = 7 }
