case = 26
name = "changes-after-a-window-closed-list-it-gone-by-its-id"
note = "Each mod-a opens the windows the case says, each filled by a text field: main, the window 1 at 283, 107, 720 by 480. The desktop is the base shell, 1280 by 800, and ada sits at s1. The person closes the window and ada reads changes since 7: the line of the local seat, whose key window it was meanwhile, is listed as changed, and the window as gone, by its id."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "close"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "changes", since = 7 }

[step.expect]
answers = { text = "changes 7 to 9\n~ seat local \"Deckit conformance\" blue\n- w1", mark = 9 }
