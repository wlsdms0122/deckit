case = 29
name = "a-seat-that-pressed-reads-its-pointer-its-key-window-and-the-active-mod"
note = "Each mod-a opens the windows the case says, each filled by a text field: main, the window 1 at 283, 107, 720 by 480, and second, titled Second, the window 2 at 307, 131, in front of it; mod-b opens none. The desktop is the base shell, 1280 by 800, and ada sits at s1. It presses at 600, 300, on the window 2, and reads the desktop: its line holds at and the point and key and the window, the item of the mod is active, and the window holds key and the seat."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "desktop" }
part = "text"

[step.expect]
answers = "desktop 1280x800 mark \u001A\nseat local \"Deckit conformance\" blue\nseat s1 \"Ada Lovelace\" green at 600,300 key w2 (you)\ndock (2 items)\n  item \"mod-a\" [running, active] dock.mod-a\n  item \"mod-b\" [running] dock.mod-b\nwindow w2 \"Second\" mod-a at 307,131 720x480 [key s1]\nwindow w1 \"mod-a\" mod-a at 283,107 720x480"
