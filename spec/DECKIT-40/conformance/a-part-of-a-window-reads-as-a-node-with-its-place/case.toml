case = 26
name = "a-part-of-a-window-reads-as-a-node-with-its-place"
note = "Each mod-a opens the windows the case says, each filled by a text field: main, the window 1 at 283, 107, 720 by 480. The desktop is the base shell, 1280 by 800, and ada sits at s1. It reads the node w1.bar: the title bar, of a window with no title, reads as its role and its ref, then where it is on the desktop and its size."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "w1.bar" }

[step.expect]
answers = { text = "titlebar w1.bar at 283,107 720x48", mark = 7 }
