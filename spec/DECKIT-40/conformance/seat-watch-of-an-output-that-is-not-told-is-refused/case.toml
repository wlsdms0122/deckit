case = 25
name = "seat-watch-of-an-output-that-is-not-told-is-refused"
note = "seat/watch is refused at call with INVALID_ARGUMENT where of names no output a layer tells: the shell reads desktop and never tells it."

[host]
base = "shell"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/watch"
params = { of = "desktop", on = true }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
