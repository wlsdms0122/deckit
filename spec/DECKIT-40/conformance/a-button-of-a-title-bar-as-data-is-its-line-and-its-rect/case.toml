case = 26
name = "a-button-of-a-title-bar-as-data-is-its-line-and-its-rect"
note = "Each mod-a opens the windows the case says, each filled by a text field: main, the window 1 at 283, 107, 720 by 480. The desktop is the base shell, 1280 by 800, and ada sits at s1. It reads the node w1.close with format json: data holds the node, its role, name, states and ref, its rect on the desktop, and the mark."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "w1.close", format = "json" }

[step.expect]
answers = { data = { node = { depth = 0, role = "button", name = "Close", states = [], ref = "w1.close" }, rect = { x = 301, y = 125, width = 12, height = 12 }, mark = 7 }, mark = 7 }
