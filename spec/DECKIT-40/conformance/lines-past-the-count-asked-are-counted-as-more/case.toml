case = 26
name = "lines-past-the-count-asked-are-counted-as-more"
note = "mod-a opens the window 1 at 283, 107, 720 by 480, with no title. Its content holds, each in a box of its own: the heading Notes, the button Bold, not pressed, the field Name with the value say \"a\", b, the empty field Find, the checkbox Done, the list Days of Mon, Tue and Wed, and the region Log, 60 high, that scrolls three paragraphs 40 high each. The desktop is the base shell, 1280 by 800, and ada sits at s1. It reads the window, then the node of the region Log with all and lines 1: of its three lines of text the first is listed, and the two left out are counted."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }
part = "mark"

[step.expect]
answers = 7

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "7.10", all = true, lines = 1 }

[step.expect]
answers = { text = "region \"Log\" 7.10 at 283,487 200x60 scroll 0 of 120\n  text \"First line.\"\n  ... 2 more", mark = 7 }
