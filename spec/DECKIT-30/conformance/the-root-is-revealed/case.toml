case = 16
name = "the-root-is-revealed"
note = "A path is absolute where it begins with /, and / alone is one: mod-a, a mod granted nothing, reveals /."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "reveal"
handle = "shell"
args = ["/"]

[[step]]
look = "revealed"

[step.expect]
answers = ["/"]
