case = 6
name = "detach-is-called-after-an-attach-whose-promise-is-rejected"
note = "The shell's lifecycle ends at once where the promise attach answered is rejected: detach is called while the run goes on. mod-a's start and detach each open https://said.test/ and its name outside the app, and its attach answers a promise that is rejected."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-b"]

[[step]]
input = "start"

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/start", activates = true }, { url = "https://said.test/detach", activates = true }]
