case = 6
name = "a-detach-that-throws-ends-the-run-all-the-same"
note = "A detach that throws has ended the shell's lifecycle all the same, and the run ends as asked: stop is called and the run is notRunning. mod-a's detach throws, its stop opens https://said.test/stop outside the app, and mod-b quits mod-a."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-b"
member = "mods.quit"
args = ["mod-a"]

[[step]]
look = "run"
mod = "mod-a"

[step.expect]
answers = "notRunning"

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/stop", activates = true }]
