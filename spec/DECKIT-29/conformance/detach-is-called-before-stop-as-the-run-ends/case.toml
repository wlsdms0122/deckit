case = 6
name = "detach-is-called-before-stop-as-the-run-ends"
note = "The shell's lifecycle ends before the system's: as mod-a's run ends, detach is called, and stop once detach has ended. mod-a's start, attach, detach and stop each open https://said.test/ and its name outside the app, and mod-b quits mod-a."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-b"
member = "mods.quit"
args = ["mod-a"]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/start", activates = true }, { url = "https://said.test/attach", activates = true }, { url = "https://said.test/detach", activates = true }, { url = "https://said.test/stop", activates = true }]
