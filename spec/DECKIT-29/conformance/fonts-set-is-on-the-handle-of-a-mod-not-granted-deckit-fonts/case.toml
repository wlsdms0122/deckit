case = 15
name = "fonts-set-is-on-the-handle-of-a-mod-not-granted-deckit-fonts"
note = "Every member is on the handle shell, and what a permission guards is refused, not left off: fonts.set, a request deckit.fonts guards, made by mod-a, granted nothing, is refused NOT_PERMITTED."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "fonts.set"
handle = "shell"
args = [{ size = 14 }]

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"
