case = 3
name = "a-member-a-permission-guards-is-on-the-handle-of-a-mod-not-granted-it"
note = "Every member is on the handle of every mod, whatever the mod is granted. mod-a, granted nothing, makes a request through each member that a permission guards and a call can reach: it asks that it be removed, through mods.remove, that a folder be shown, that what was copied be read and replaced, that a notification be shown, and that a mod be reached. Each member is on its handle, and each request is refused at call with NOT_PERMITTED."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.remove"
args = ["mod-a", false]

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"

[[step]]
input = "call"
mod = "mod-a"
member = "reveal"
args = ["/"]

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"

[[step]]
input = "call"
mod = "mod-a"
member = "clipboard.readText"
args = []

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"

[[step]]
input = "call"
mod = "mod-a"
member = "clipboard.writeText"
args = ["a"]

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"

[[step]]
input = "call"
mod = "mod-a"
member = "notifications.show"
args = [{ title = "a" }]

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.reach"
args = ["mod-b"]

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"
