case = 4
name = "a-key-bound-to-no-value-is-left-out"
note = "A key of a table that the mod's code binds to no value is left out of the table, and a request takes the table without it. mod-a's start keeps a table whose key none is bound to no value as a record and as a value, and keeps the keys of each read back as the value kept."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "storage.values.get"
args = ["kept", "none"]

[step.expect]
answers = [["text"], ["text"]]
