case = 3
name = "the-permission-is-checked-before-the-arguments"
note = "A request is refused first as the permissions refuse one, and only then for its arguments. mod-a is not granted deckit.mods, so its launch of the mod 1 is refused at call with NOT_PERMITTED, not INVALID_ARGUMENT."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = [1]

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"
