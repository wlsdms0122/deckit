case = 3
name = "an-argument-of-another-type-is-refused"
note = "A request whose argument is of another type than its signature gives is refused at call with INVALID_ARGUMENT, and the argument is not turned into the type. mod-a, granted deckit.mods and each permission a request below needs, hands the integer 1 where each takes a string: it asks that the mod 1 launch, that the folder of the mod 1 be shown, that the file 1 be shown, that 1 be copied, that the module 1 be started in the host's process, and that the download 1 be removed."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = [1]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.reveal"
args = [1]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
input = "call"
mod = "mod-a"
member = "reveal"
args = [1]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
input = "call"
mod = "mod-a"
member = "clipboard.writeText"
args = [1]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
input = "call"
mod = "mod-a"
member = "mainProcess"
args = [1]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
input = "call"
mod = "mod-a"
member = "web.downloads.remove"
args = [1]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
