case = 3
name = "an-argument-past-those-the-signature-takes-is-not-read"
note = "An argument past those the signature takes is not read, and refuses nothing. mod-a, granted deckit.mods, asks that mod-b launch and hands an integer after the id: the launch is answered, and mod-b runs."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-b", 1]

[[step]]
look = "run"
mod = "mod-b"

[step.expect]
answers = "running"
