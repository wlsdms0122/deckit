case = 3
name = "the-arguments-are-checked-before-the-requests-own-refusals"
note = "A request is refused for its arguments before its own DECKIT refuses it. mod-a, granted deckit.mods, asks that mod-z be removed, which no bundle is listed under, and leaves out erase: it is refused at call with INVALID_ARGUMENT, not NOT_INSTALLED."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.remove"
args = ["mod-z"]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
