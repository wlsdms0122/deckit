case = 3
name = "a-key-of-a-table-of-another-type-is-refused"
note = "A request a key of whose table is of another type than the table gives is refused at call with INVALID_ARGUMENT. mod-a hands the host an address to open with options holding activates as a string where the options give a boolean."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "openExternal"
args = ["https://example.com/a", { activates = "no" }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
