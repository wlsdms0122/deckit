case = 4
name = "a-listener-added-twice-for-a-name-is-called-once"
note = "A listener is added once for a name, however often it is handed for it. mod-a hands the same listener for mod-a:ready twice and sends ready once, and the listener is called once."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.on"
args = ["mod-a:ready"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "events.on"
args = ["mod-a:ready"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["ready", 1]

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = [[1]]
