case = 4
name = "the-arguments-of-on-are-checked-before-the-name-is-heard"
note = "on refuses its arguments before it judges whose name it is handed: a listener that is no function for a name of another mod is refused at call with kind INVALID_ARGUMENT, not NOT_PERMITTED. mod-a listens to mod-b:ready with the listener 1."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.on"
args = ["mod-b:ready", 1]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
