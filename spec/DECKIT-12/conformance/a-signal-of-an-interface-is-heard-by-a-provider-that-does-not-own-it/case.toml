case = 4
name = "a-signal-of-an-interface-is-heard-by-a-provider-that-does-not-own-it"
note = "A mod that provides an interface hears its signals, whether or not it owns it. mod-b and mod-c provide mod-b/pages and mod-b owns it; mod-b sends mod-b/pages:changed, and mod-c hears it."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b", "mod-c"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-c"
member = "events.on"
args = ["mod-b/pages:changed"]
listener = true

[[step]]
input = "call"
mod = "mod-b"
member = "events.emit"
args = ["mod-b/pages:changed", "page-1"]

[[step]]
look = "heard"
mod = "mod-c"

[step.expect]
answers = [["page-1"]]
