case = 4
name = "listening-to-a-name-of-another-type-is-refused"
note = "on takes a name that is a string: one of another type is refused at call with kind INVALID_ARGUMENT, and never read as a string. mod-a listens to the name 1."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.on"
args = [1]
listener = true

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
