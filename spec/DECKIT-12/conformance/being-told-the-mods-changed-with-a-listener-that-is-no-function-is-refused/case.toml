case = 4
name = "being-told-the-mods-changed-with-a-listener-that-is-no-function-is-refused"
note = "mods.onChange takes a listener that is a function: one of another type is refused at call with kind INVALID_ARGUMENT. mod-a, a system mod granted deckit.mods, hands mods.onChange the listener 1."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.onChange"
args = [1]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
