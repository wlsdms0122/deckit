case = 4
name = "listening-to-a-name-of-another-mod-is-refused"
note = "A mod listens only to names of its own id and of the interfaces it uses or provides: on of any other is refused at call with kind NOT_PERMITTED. mod-a listens to mod-b:ready."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.on"
args = ["mod-b:ready"]
listener = true

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"
