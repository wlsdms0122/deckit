case = 4
name = "a-mod-that-uses-an-interface-is-told-its-owner-changed"
note = "The system tells <interface>:owner-changed, with no values, to the mods that hear the interface once its owner changes. mod-b and mod-c provide mod-b/pages, and mod-b owns it; mod-a, a system mod granted deckit.mods that uses it, listens to mod-b/pages:owner-changed and pins mod-c, and its listener is called once with no values."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b", "mod-c"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.on"
args = ["mod-b/pages:owner-changed"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "mods.pin"
args = ["mod-b/pages", "mod-c"]

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = [[]]
