case = 4
name = "the-owner-of-an-interface-sends-no-signal-the-system-tells"
note = "owner-changed and contributions-changed are the signals the system tells of an interface, and its owner's event of either name is not sent. mod-b owns mod-b/pages and sends mod-b/pages:owner-changed, and mod-a, listening to it, does not hear it."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.on"
args = ["mod-b/pages:owner-changed"]
listener = true

[[step]]
input = "call"
mod = "mod-b"
member = "events.emit"
args = ["mod-b/pages:owner-changed"]

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = []
