case = 27
name = "a-toast-is-shown-to-every-seat-as-a-notification-is-posted"
note = "The host ships the owner of deckit/notifications and of deckit/commands, and the status bar by its id, on the base shell, 1280 by 800, under a bar 32 high. ada sits at s1. mod-a posts to deckit/notifications what its event post tells it and takes its own away as its event clear tells it, runs in the background, and runs its commands ping and snooze by opening https://said.test/mod-a/ran/<command> outside the app. mod-a posts Standup, with the action Snooze: the toast stands at the top right on the screen of s1 and of the local seat, and s1 reads it, an alert named Standup."

[host]
base = "shell"
api = "1.0.0"
owners = ["deckit/notifications", "deckit/commands"]
mods = ["status-bar"]
ship = ["mod-a"]
bar = 32
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["post", { title = "Standup", command = "ping", actions = [{ title = "Snooze", command = "snooze" }] }]

[[step]]
look = "windows"
seat = "s1"
[step.expect]
answers = [{ mod = "status-bar", name = "bar", level = "panel", frame = { x = 1225, y = 2, width = 47, height = 28 }, key = false, minimized = false }, { mod = "notifications", name = "toasts", level = "panel", frame = { x = 912, y = 40, width = 360, height = 92 }, key = false, minimized = false }]

[[step]]
look = "windows"
seat = "local"
[step.expect]
answers = [{ mod = "status-bar", name = "bar", level = "panel", frame = { x = 1225, y = 2, width = 47, height = 28 }, key = false, minimized = false }, { mod = "notifications", name = "toasts", level = "panel", frame = { x = 912, y = 40, width = 360, height = 92 }, key = false, minimized = false }]

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w2" }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "1.1", lines = 0 }
part = "text"

[step.expect]
answers = "alert \"Standup\" 1.1 at 920,48 344x76\n  img \"mod-a\" 1.2\n  button \"Snooze\" 1.3\n  button \"Close\" 1.4\n  ... 2 more"
