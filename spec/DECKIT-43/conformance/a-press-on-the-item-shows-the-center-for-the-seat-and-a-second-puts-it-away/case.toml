case = 29
name = "a-press-on-the-item-shows-the-center-for-the-seat-and-a-second-puts-it-away"
note = "The host ships the owner of deckit/notifications and of deckit/commands, and the status bar by its id, on the base shell, 1280 by 800, under a bar 32 high. ada sits at s1. mod-a posts to deckit/notifications what its event post tells it and takes its own away as its event clear tells it, runs in the background, and runs its commands ping and snooze by opening https://said.test/mod-a/ran/<command> outside the app. mod-a posts Standup, with the action Snooze. ada presses the item: s1 reads its desktop, the center standing under the item. ada presses the item again, and the center is put away."

[host]
base = "shell"
api = "1.0.0"
owners = ["deckit/notifications", "deckit/commands"]
mods = ["status-bar"]
ship = ["mod-a"]
bar = 32
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["post", { title = "Standup", command = "ping", actions = [{ title = "Snooze", command = "snooze" }] }]

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "1.2", button = 0 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "1.2", button = 0 }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "desktop" }
part = "text"

[step.expect]
answers = "desktop at 0,0 1280x800 mark \u001A\nseat local \"Deckit conformance\" blue\nseat s1 \"Ada Lovelace\" green at \u001A,16 (you)\ndock (1 items)\n  item \"mod-a\" [running] dock.mod-a\npanel w1 \"Status Bar\" status-bar top at \u001A,2 \u001Ax28\npanel w2 \"Notifications\" notifications at 912,40 360x80\npanel w3 \"Notifications\" notifications at 910,40 360x110 [key s1]"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "1.2", button = 0 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "1.2", button = 0 }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "desktop" }
part = "text"

[step.expect]
answers = "desktop at 0,0 1280x800 mark \u001A\nseat local \"Deckit conformance\" blue\nseat s1 \"Ada Lovelace\" green at \u001A,16 (you)\ndock (1 items)\n  item \"mod-a\" [running] dock.mod-a\npanel w1 \"Status Bar\" status-bar top at \u001A,2 \u001Ax28\npanel w2 \"Notifications\" notifications at 912,40 360x80"
