case = 27
name = "remove-in-a-row-takes-it-away-and-runs-nothing"
note = "The host ships the owner of deckit/notifications and of deckit/commands, and the status bar by its id, on the base shell, 1280 by 800, under a bar 32 high. ada sits at s1. mod-a posts to deckit/notifications what its event post tells it and takes its own away as its event clear tells it, runs in the background, and runs its commands ping and snooze by opening https://said.test/mod-a/ran/<command> outside the app. mod-a posts Standup. ada presses the item and then Remove in the row: nothing runs, and the row, the toast and the count go."

[host]
base = "shell"
api = "1.0.0"
owners = ["deckit/notifications", "deckit/commands"]
mods = ["status-bar"]
ship = ["mod-a"]
bar = 32
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["post", { title = "Standup", command = "ping", actions = [{ title = "Snooze", command = "snooze" }] }]

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "1.2", button = 0 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "1.2", button = 0 }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w3" }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "2.7", button = 0 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "2.7", button = 0 }

[[step]]
look = "opened"

[step.expect]
answers = []

[[step]]
look = "windows"
seat = "s1"
[step.expect]
answers = [{ mod = "status-bar", name = "bar", level = "panel", frame = { x = 1236, y = 2, width = 36, height = 28 }, key = false, minimized = false }, { mod = "notifications", name = "center", level = "panel", frame = { x = 910, y = 40, width = 360, height = 240 }, key = false, minimized = false }]
