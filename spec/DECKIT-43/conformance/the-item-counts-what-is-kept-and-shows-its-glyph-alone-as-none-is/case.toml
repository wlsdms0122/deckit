case = 27
name = "the-item-counts-what-is-kept-and-shows-its-glyph-alone-as-none-is"
note = "The host ships the owner of deckit/notifications and of deckit/commands, and the status bar by its id, on the base shell, 1280 by 800, under a bar 32 high. ada sits at s1. mod-a posts to deckit/notifications what its event post tells it and takes its own away as its event clear tells it, runs in the background, and runs its commands ping and snooze by opening https://said.test/mod-a/ran/<command> outside the app. The capsule reads the item Notifications with no count; mod-a posts Standup, with the action Snooze, and the capsule grows by the count; mod-a takes it away, and the capsule is as it was, the item standing still."

[host]
base = "shell"
api = "1.0.0"
owners = ["deckit/notifications", "deckit/commands"]
mods = ["status-bar"]
ship = ["mod-a"]
bar = 32
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "1.1" }
part = "text"

[step.expect]
answers = "toolbar \"Status Bar\" 1.1 at 1236,2 36x28\n  button \"Notifications\" 1.2"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["post", { title = "Standup", command = "ping", actions = [{ title = "Snooze", command = "snooze" }] }]

[[step]]
look = "windows"
seat = "local"
[step.expect]
answers = [{ mod = "status-bar", name = "bar", level = "panel", frame = { x = 1225, y = 2, width = 47, height = 28 }, key = false, minimized = false }, { mod = "notifications", name = "toasts", level = "panel", frame = { x = 912, y = 40, width = 360, height = 92 }, key = false, minimized = false }]

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["clear"]

[[step]]
look = "opened"

[step.expect]
answers = []

[[step]]
look = "windows"
seat = "local"
[step.expect]
answers = [{ mod = "status-bar", name = "bar", level = "panel", frame = { x = 1236, y = 2, width = 36, height = 28 }, key = false, minimized = false }]
