case = 17
name = "an-overlay-window-is-neither-minimized-nor-zoomed"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. minimize() and zoom() do nothing to a window at the level overlay: mod-a, granted system.overlay-windows, has f pressed, and minimizes and zooms it."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "f"
action = "press"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "minimize", name = "f" }, { do = "zoom", name = "f" }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "f", level = "overlay", frame = { x = 540, y = 160, width = 200, height = 100 }, key = true, minimized = false }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/f/didAppear", activates = true }, { url = "https://said.test/f/didBecomeKey", activates = true }]
