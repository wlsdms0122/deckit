case = 29
name = "a-press-on-a-colour-field-opens-a-palette-of-colours"
note = "A press on a field that takes a colour opens its picker, whose options read as colours. mod-a opens main, the window 1 at 283, 107, 720 by 480, whose content holds the colour field Colour at 20, 100, 200 by 30, valued #010203. The desktop is the base shell, 1280 by 800, and ada sits at s1. ada presses the field at 403, 222 and reads w1.picker.1 as a node: an option whose label is a colour, #rrggbb, whatever colour the shell's palette begins with."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 403, y = 222, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 403, y = 222, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "w1.picker.1" }
part = "text"

[step.expect]
answers = "option \"#\u001A w1.picker.1 at \u001A"
