case = 17
name = "an-overlay-window-opens-where-it-was-left"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-a, granted system.overlay-windows, opens f at the level overlay; the person drags it 10 right and 20 down, the host app quits and starts, and f opens where it was left."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "f"
action = "move"
by = { x = 10, y = 20 }

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "f", level = "overlay", frame = { x = 550, y = 180, width = 200, height = 100 }, key = false, minimized = false }]
