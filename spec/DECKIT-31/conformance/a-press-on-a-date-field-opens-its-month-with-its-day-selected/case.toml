case = 29
name = "a-press-on-a-date-field-opens-its-month-with-its-day-selected"
note = "A press on a field that takes a date opens its picker on the month of its date, its day selected. mod-a opens main, the window 1 at 283, 107, 720 by 480, whose content holds the date field Day at 20, 100, 200 by 30, valued 2026-03-14. The page opens https://said.test/<type>/<value> outside the app for each input and change it hears. The desktop is the base shell, 1280 by 800, and ada sits at s1. ada presses the field at 403, 222 and reads w1.picker.14 as a node: the option 2026-03-14, selected."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 403, y = 222, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 403, y = 222, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "w1.picker.14" }
part = "text"

[step.expect]
answers = "option \"2026-03-14\" [selected] w1.picker.14 at \u001A"
