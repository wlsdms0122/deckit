case = 17
name = "zoom-of-a-tiled-window-fills-and-goes-back-to-its-tile"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 } and tile area { x = 8, y = 8, width = 1264, height = 784 }. The person presses on main, so mod-a may activate. zoom of a tiled window zooms it to the tile area, and zoomed again it is back at its tile: the person drags main to the left half and clicks its button zoom, then clicks it again."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "move"
by = { x = -640, y = 0 }

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "zoom"

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 8, y = 8, width = 1264, height = 784 }, key = true, minimized = false }]

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "zoom"

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 8, y = 8, width = 632, height = 784 }, key = true, minimized = false }]
