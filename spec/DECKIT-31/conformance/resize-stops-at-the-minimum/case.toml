case = 17
name = "resize-stops-at-the-minimum"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. The person presses on main, so mod-a may activate. resize leaves the window no smaller than its minimum, 120 by 48 where its mod gives none: mod-a resizes main to 10 by 10."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "resize", name = "main", args = [10, 10] }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 120, height = 48 }, key = true, minimized = false }]
