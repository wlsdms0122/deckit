case = 23
name = "a-window-holds-the-title-it-is-set"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-a reads, of the root element of the document main's content is in, whether it has the attribute data-deckit-title-bar and the properties --deckit-title-bar-area-height, --deckit-title-bar-area-x, --deckit-safe-area-inset-top, --deckit-safe-area-inset-right, --deckit-safe-area-inset-bottom and --deckit-safe-area-inset-left, which it says. A window opened with the title A holds it, and B once setTitle sets it."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "title", name = "main" }, { do = "setTitle", name = "main", args = ["B"] }, { do = "title", name = "main" }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/didAppear", activates = true }, { url = "https://said.test/main/title/A", activates = true }, { url = "https://said.test/main/title/B", activates = true }]
