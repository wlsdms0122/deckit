case = 17
name = "windows-list-answers-the-windows-open-in-the-order-they-opened"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. windows.list answers the handle of each window open in the order they opened, whatever their order on screen: mod-a opens main and b, main centred and b cascaded from it, the front window on screen where no window is key, and then orders main front."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "orderFront", name = "main" }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "b", level = "normal", frame = { x = 307, y = 131, width = 720, height = 480 }, key = false, minimized = false }, { mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = false, minimized = false }]

[[step]]
input = "call"
mod = "mod-a"
member = "windows.list"
handle = "shell"

[step.expect]
answers = [{ name = "main", isKey = false, title = "" }, { name = "b", isKey = false, title = "" }]
