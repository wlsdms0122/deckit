case = 17
name = "a-window-opens-where-its-mod-left-the-window-of-its-name"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. The person presses on main, so mod-a may activate. The frame a window is left at is kept by its mod and its name: the person drags main 10 right and 20 down, the host app quits and starts, and mod-a opens main there."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { open = { name = "main" } }]

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "move"
by = { x = 10, y = 20 }

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { open = { name = "main" } }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 293, y = 127, width = 720, height = 480 }, key = false, minimized = false }]
