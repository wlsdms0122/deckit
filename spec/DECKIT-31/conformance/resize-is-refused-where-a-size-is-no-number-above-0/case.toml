case = 17
name = "resize-is-refused-where-a-size-is-no-number-above-0"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. resize throws INVALID_ARGUMENT at call where width or height is not a number above 0, or is left out, and the window is as it was: mod-a resizes main to 0 by 10, to \"a\" by 10, and with 10 alone."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "resize", name = "main", args = [0, 10] }, { do = "resize", name = "main", args = ["a", 10] }, { do = "resize", name = "main", args = [10] }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/didAppear", activates = true }, { url = "https://said.test/main/threw/INVALID_ARGUMENT", activates = true }, { url = "https://said.test/main/threw/INVALID_ARGUMENT", activates = true }, { url = "https://said.test/main/threw/INVALID_ARGUMENT", activates = true }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = false, minimized = false }]
