case = 17
name = "the-handle-of-a-closed-window-does-nothing"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. The person presses on main, so mod-a may activate. Once a window has closed, each member of its handle does nothing, isKey is false and name the same: mod-a closes main, then zooms, resizes, orders front, makes key and minimizes it, and reads isKey and name."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "close", name = "main" }]

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "zoom", name = "main" }, { do = "resize", name = "main", args = [300, 200] }, { do = "orderFront", name = "main" }, { do = "makeKeyAndOrderFront", name = "main" }, { do = "minimize", name = "main" }, { do = "isKey", name = "main" }, { do = "name", name = "main" }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/didAppear", activates = true }, { url = "https://said.test/main/didBecomeKey", activates = true }, { url = "https://said.test/main/didResignKey", activates = true }, { url = "https://said.test/main/didDisappear", activates = true }, { url = "https://said.test/main/didClose", activates = true }, { url = "https://said.test/main/isKey/false", activates = true }, { url = "https://said.test/main/name/main", activates = true }]

[[step]]
look = "windows"

[step.expect]
answers = []
