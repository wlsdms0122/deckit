case = 23
name = "a-panel-window-at-the-right-edge-takes-the-keyboard-as-it-opens"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the base shell, 1280 by 800, under a bar 52 high across its top, so that its desktop is { x = 0, y = 52, width = 1280, height = 748 }. A panel window at the edge right takes the keyboard as it opens, where its mod may activate, as an overlay window does: it is key, and the desktop's key window is not, told didResignKey before r is told didBecomeKey. mod-a, granted deckit.panel-windows, opens main in attach; the person presses on main, so mod-a may activate, and mod-a opens r at the level panel and the edge right."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
bar = 52

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { open = { name = "r", level = "panel", edge = "right", width = 360, height = 100 } }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 141, width = 720, height = 480 }, key = false, minimized = false }, { mod = "mod-a", name = "r", level = "panel", frame = { x = 912, y = 60, width = 360, height = 732 }, key = true, minimized = false }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/didAppear", activates = true }, { url = "https://said.test/main/didBecomeKey", activates = true }, { url = "https://said.test/main/didResignKey", activates = true }, { url = "https://said.test/r/didAppear", activates = true }, { url = "https://said.test/r/didBecomeKey", activates = true }]
