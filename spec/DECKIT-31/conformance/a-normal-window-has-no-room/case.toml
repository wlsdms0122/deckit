case = 23
name = "a-normal-window-has-no-room"
note = "mod-a's code, in attach, opens the windows the case says, and tells of the window main alone, each time by opening an address outside the app: https://said.test/<name>/room/<room> as windows.open answers its handle and as the event mod-a:go asks for it, <room> the room the handle holds then, <width>x<height> or null; https://said.test/<name>/<callback> from a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose; and https://said.test/<name>/didChangeRoom/<room> from one for didChangeRoom. It opens a window as the event mod-a:go tells it, on the base shell, 1280 by 800, under a bar 52 high across its top, so that its desktop is { x = 0, y = 52, width = 1280, height = 748 }. The room of the handle of a window at another level than panel is null, and the window is told no didChangeRoom: mod-a, granted deckit.panel-windows, opens main in attach, and is asked for main's room."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
bar = 52

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { room = "main" }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/room/null", activates = true }, { url = "https://said.test/main/didAppear", activates = true }, { url = "https://said.test/main/room/null", activates = true }]
