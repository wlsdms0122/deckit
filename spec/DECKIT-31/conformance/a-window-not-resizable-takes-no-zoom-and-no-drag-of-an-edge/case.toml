case = 23
name = "a-window-not-resizable-takes-no-zoom-and-no-drag-of-an-edge"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-a reads, of the root element of the document main's content is in, whether it has the attribute data-deckit-title-bar and the properties --deckit-title-bar-area-height, --deckit-title-bar-area-x, --deckit-safe-area-inset-top, --deckit-safe-area-inset-right, --deckit-safe-area-inset-bottom and --deckit-safe-area-inset-left, which it says. A window that is not resizable takes no click of its button zoom, no double click on its title bar, whose base action is zoom, and no drag of its edge."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "zoom"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "doubleClick"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "resize"
edge = "right"
by = { x = 40, y = 0 }

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = true, minimized = false }]
