case = 26
name = "a-zoomed-window-s-right-edge-is-held-inside-the-screen"
note = "Each mod's code opens the windows the case says, each filled by a text field, and opens https://said.test/<name>/<event>/<what> outside the app for what the window's content hears: mousedown and mouseup with <button>/<detail>/<modifiers>, mousemove with <buttons>, wheel with <deltaX>/<deltaY>, keydown and keyup with <code>/<key>/<modifiers>/<repeat>, compositionstart and compositionupdate with the text composed, compositionend with <the text>/<the field's value>, and inserted with the text of each input event of the type insertText. The desktop is the base shell's, 1280 by 800, and each seat's camera is 1280 by 800 at 0,0 as it opens. mod-a opens main, the window 1 at 280, 109, 720 by 480, and ada sits at s1. It presses main, its key window, and clicks its button zoom, main then at the zoom area, 8, 8, 1264 by 784, its right side at 1272. A press 4 right of that side, within its reach and inside the screen, holds it: ada presses at 1276, 400, moves 100 left and lets go, and main is 1164 wide."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "w1.zoom", button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "w1.zoom", button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 1276, y = 400, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "move", x = 1176, y = 400, buttons = [0] }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 1176, y = 400, button = 0, count = 1 }

[[step]]
look = "windows"
seat = "s1"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 8, y = 8, width = 1164, height = 784 }, key = true, minimized = false }]
