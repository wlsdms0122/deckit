case = 17
name = "a-tiled-window-dragged-away-has-its-frame-before"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 } and tile area { x = 8, y = 8, width = 1264, height = 784 }. The person presses on main, so mod-a may activate. A tiled window a drag of its title bar starts to move is back at the frame it had before, the pointer as far across its title bar, the drag going on from there: the person drags main to the left half, then 100 right and 50 down."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "move"
by = { x = -640, y = 0 }

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "move"
by = { x = 100, y = 50 }

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 64, y = 58, width = 720, height = 480 }, key = true, minimized = false }]
