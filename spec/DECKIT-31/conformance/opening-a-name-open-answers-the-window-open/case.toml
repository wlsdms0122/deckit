case = 17
name = "opening-a-name-open-answers-the-window-open"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. A run has one window of a name: mod-a opens main, then main again 300 wide, and one window main is open, at the frame it opened at, and windows.list answers it once."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = false, minimized = false }]

[[step]]
input = "call"
mod = "mod-a"
member = "windows.list"
handle = "shell"

[step.expect]
answers = [{ name = "main", isKey = false }]
