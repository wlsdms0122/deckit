case = 23
name = "a-view-has-no-room"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as its event go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the base shell, 1280 by 800, under a bar 52 high across its top, so that its desktop is { x = 0, y = 52, width = 1280, height = 748 }. room of the handle of a view is null: mod-a opens v 320 by 240 at the place top-right, at the level panel with activates false, and is told to read room of its handle."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
bar = 52

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "room", name = "v" }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/v/didAppear", activates = true }, { url = "https://said.test/v/room/null", activates = true }]
