case = 23
name = "makekeyandorderfront-leaves-a-panel-window-without-the-keyboard"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the base shell, 1280 by 800, under a bar 52 high across its top, so that its desktop is { x = 0, y = 52, width = 1280, height = 748 }. makeKeyAndOrderFront() does nothing to a panel window, the key window left key and told nothing: mod-a, granted deckit.panel-windows, opens main and p, the person presses on main, and mod-a calls p's makeKeyAndOrderFront()."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
bar = 52

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { name = "p", do = "makeKeyAndOrderFront" }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/didAppear", activates = true }, { url = "https://said.test/p/didAppear", activates = true }, { url = "https://said.test/main/didBecomeKey", activates = true }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 141, width = 720, height = 480 }, key = true, minimized = false }, { mod = "mod-a", name = "p", level = "panel", frame = { x = 1152, y = 10, width = 120, height = 32 }, key = false, minimized = false }]
