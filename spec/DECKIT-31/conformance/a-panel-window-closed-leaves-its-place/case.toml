case = 23
name = "a-panel-window-closed-leaves-its-place"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the base shell, 1280 by 800, under a bar 52 high across its top, so that its desktop is { x = 0, y = 52, width = 1280, height = 748 }. A panel window that closes leaves the bar, and those opened after it move up to the right end: mod-a, granted deckit.panel-windows, opens p 120 by 32, then q 60 by 80, at the level panel in attach, and closes p."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
bar = 52

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { name = "p", do = "close" }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "q", level = "panel", frame = { x = 1212, y = 0, width = 60, height = 52 }, key = false, minimized = false }]
