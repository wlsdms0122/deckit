case = 6
name = "resize-of-a-closed-window-is-refused-as-before"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. A member of a closed window's handle is refused as it is while the window is open: mod-a closes main, then resizes it to 0 by 0."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "close", name = "main" }]

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "resize", name = "main", args = [0, 0] }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/didAppear", activates = true }, { url = "https://said.test/main/didDisappear", activates = true }, { url = "https://said.test/main/didClose", activates = true }, { url = "https://said.test/main/threw/INVALID_ARGUMENT", activates = true }]
