case = 17
name = "a-web-page-window-is-in-no-windows-list"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. The person presses on main, so mod-a may activate. mod-a's code shows a blank page of its session main apart with web.window, titled T, as the event tells it; the page's delegate opens https://said.test/web/didClose as it closes. windows.list answers no web page's window: the host's layer lists mod-a's windows once the page is shown apart."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { web = { title = "T" } }]

[[step]]
input = "call"
mod = "mod-a"
member = "windows.list"
handle = "shell"

[step.expect]
answers = [{ name = "main", isKey = false, title = "" }]
