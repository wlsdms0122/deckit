case = 23
name = "windows-open-of-a-view-without-deckit-panel-windows-throws-not-permitted-before-invalid-argument"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as its event go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the base shell, 1280 by 800, under a bar 52 high across its top, so that its desktop is { x = 0, y = 52, width = 1280, height = 748 }. The refusals of windows.open come in their order: NOT_PERMITTED before INVALID_ARGUMENT. mod-a, not granted deckit.panel-windows, opens v at the level panel with the anchor { mod = \"mod-a\" }, which holds no id: it throws NOT_PERMITTED, and opens nothing."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
bar = 52

[[step]]
input = "start"

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/v/threw/NOT_PERMITTED", activates = true }]

[[step]]
look = "windows"

[step.expect]
answers = []
