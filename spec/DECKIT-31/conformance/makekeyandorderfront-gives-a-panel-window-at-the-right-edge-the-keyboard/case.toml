case = 23
name = "makekeyandorderfront-gives-a-panel-window-at-the-right-edge-the-keyboard"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the base shell, 1280 by 800, under a bar 52 high across its top, so that its desktop is { x = 0, y = 52, width = 1280, height = 748 }. makeKeyAndOrderFront() gives a panel window at the edge right the keyboard, where its mod may activate: mod-a, granted deckit.panel-windows, opens main, at the level normal, and r, at the level panel and the edge right, in attach, r without the keyboard; the person presses on main, so mod-a may activate, and mod-a calls r's makeKeyAndOrderFront()."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
bar = 52

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { name = "r", do = "makeKeyAndOrderFront" }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 141, width = 720, height = 480 }, key = false, minimized = false }, { mod = "mod-a", name = "r", level = "panel", frame = { x = 912, y = 60, width = 360, height = 732 }, key = true, minimized = false }]
