case = 17
name = "a-web-page-window-closed-closes-its-page"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. The person presses on main, so mod-a may activate. mod-a's code shows a blank page of its session main apart with web.window, titled T, as the event tells it; the page's delegate opens https://said.test/web/didClose as it closes. The person closes the page's window with its close button, which closes the page."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { web = { title = "T" } }]

[[step]]
input = "window"
mod = "mod-a"
action = "close"

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = true, minimized = false }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/didAppear", activates = true }, { url = "https://said.test/main/didBecomeKey", activates = true }, { url = "https://said.test/main/didResignKey", activates = true }, { url = "https://said.test/main/didBecomeKey", activates = true }, { url = "https://said.test/web/didClose", activates = true }]
