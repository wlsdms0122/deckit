case = 29
name = "a-select-that-shows-several-rows-opens-no-picker"
note = "A select that shows more than one row lists its options in the page and opens no picker. mod-a opens main, the window 1 at 283, 107, 720 by 480, whose content holds the select Days at 20, 200, 200 by 120, of size 4, of Mon, Tue, Wed and Thu. The desktop is the base shell, 1280 by 800, and ada sits at s1. ada presses the select at 403, 367: w1.picker names nothing."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 403, y = 367, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 403, y = 367, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "w1.picker" }

[step.expect]
refuses = "call"
kind = "GONE"

