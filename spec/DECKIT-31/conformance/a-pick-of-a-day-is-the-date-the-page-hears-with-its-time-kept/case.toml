case = 29
name = "a-pick-of-a-day-is-the-date-the-page-hears-with-its-time-kept"
note = "A pick of a day is the control's date, its time kept, which the page hears as input and then change. mod-a opens main, the window 1 at 283, 107, 720 by 480, whose content holds the date and time field Day at 20, 100, 200 by 30, valued 2026-03-14T09:30. The page opens https://said.test/<type>/<value> outside the app for each input and change it hears. The desktop is the base shell, 1280 by 800, and ada sits at s1. ada presses the field at 403, 222, which opens its picker, and presses the day 20, w1.picker.20: the page hears input and then change with the value 2026-03-20T09:30."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 403, y = 222, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 403, y = 222, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "w1.picker.20", button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "w1.picker.20", button = 0, count = 1 }

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/input/2026-03-20T09:30", activates = true }, { url = "https://said.test/change/2026-03-20T09:30", activates = true }]
