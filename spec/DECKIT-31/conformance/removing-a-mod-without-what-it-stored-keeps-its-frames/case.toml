case = 17
name = "removing-a-mod-without-what-it-stored-keeps-its-frames"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-b, marked system and granted deckit.mods, installs mod-a and launches it, which hands it activation; the person presses on main and drags it 10 right and 20 down; mod-b removes mod-a with erase false, which leaves the frames, and main opens where it was left, once mod-b installs and launches it again."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-b"]
system = ["mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-b"
member = "mods.install"
folders = ["mod-a"]
part = "id"

[[step]]
input = "call"
mod = "mod-b"
member = "mods.launch"
args = ["mod-a"]

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "move"
by = { x = 10, y = 20 }

[[step]]
input = "call"
mod = "mod-b"
member = "mods.remove"
args = ["mod-a", false]

[[step]]
input = "call"
mod = "mod-b"
member = "mods.install"
folders = ["mod-a"]
part = "id"

[[step]]
input = "call"
mod = "mod-b"
member = "mods.launch"
args = ["mod-a"]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 293, y = 127, width = 720, height = 480 }, key = true, minimized = false }]
