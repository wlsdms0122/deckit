case = 29
name = "a-pick-of-a-colour-is-the-value-the-page-hears"
note = "A pick of a colour is the control's value, which the page hears as input and then change. mod-a opens main, the window 1 at 283, 107, 720 by 480, whose content holds the colour field Colour at 20, 100, 200 by 30, valued #010203. The page opens https://said.test/<type>/<value> outside the app for each input and change it hears, the value encoded as a URI component. The desktop is the base shell, 1280 by 800, and ada sits at s1. ada presses the field at 403, 222, which opens its picker, and presses its first option, w1.picker.1: the page hears input and then change with a value #rrggbb, whatever colour the shell's palette begins with."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 403, y = 222, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 403, y = 222, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "w1.picker.1", button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "w1.picker.1", button = 0, count = 1 }

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/input/%23\u001A", activates = true }, { url = "https://said.test/change/%23\u001A", activates = true }]
