case = 17
name = "an-overlay-window-floats-over-every-app"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. A window at the level overlay is the host's to float: mod-a, granted system.overlay-windows, opens f 200 by 100 at the level overlay in attach, which the base shell floats centred, a fifth down its screen, not key before any input."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "f", level = "overlay", frame = { x = 540, y = 160, width = 200, height = 100 }, key = false, minimized = false }]
