case = 23
name = "set-title-of-a-number-throws-invalid-argument"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-a reads, of the root element of the document main's content is in, whether it has the attribute data-deckit-title-bar and the properties --deckit-title-bar-area-height, --deckit-title-bar-area-x, --deckit-safe-area-inset-top, --deckit-safe-area-inset-right, --deckit-safe-area-inset-bottom and --deckit-safe-area-inset-left, which it says. setTitle of a number throws INVALID_ARGUMENT, and the title stays the one it opened with."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "setTitle", name = "main", args = [5] }, { do = "title", name = "main" }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/didAppear", activates = true }, { url = "https://said.test/main/threw/INVALID_ARGUMENT", activates = true }, { url = "https://said.test/main/title/", activates = true }]
