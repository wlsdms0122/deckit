case = 17
name = "a-frame-set-ends-a-zoom"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. The person presses on main, so mod-a may activate. A window whose frame is set is zoomed no more, so zoom() zooms it again: the person zooms main, drags its right edge 100 left, and zooms it."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "zoom"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "resize"
edge = "right"
by = { x = -100 }

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 6, y = 0, width = 1174, height = 800 }, key = true, minimized = false }]

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "zoom"

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 6, y = 0, width = 1274, height = 800 }, key = true, minimized = false }]
