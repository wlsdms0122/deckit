case = 17
name = "a-window-moved-near-a-facing-side-meets-it"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. The person presses on main, so mod-a may activate. A side a move brings 8 or less from the facing side of a window beside it lands on it, so the two meet: mod-a opens b 300 by 200, cascaded from main, and the person drags b 701 right, its left side then 5 past main's right."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { open = { name = "b", width = 300, height = 200 } }]

[[step]]
input = "window"
mod = "mod-a"
name = "b"
action = "move"
by = { x = 701, y = 0 }

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = false, minimized = false }, { mod = "mod-a", name = "b", level = "normal", frame = { x = 1003, y = 131, width = 300, height = 200 }, key = true, minimized = false }]
