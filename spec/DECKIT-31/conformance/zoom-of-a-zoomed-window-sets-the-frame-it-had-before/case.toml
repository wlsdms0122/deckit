case = 17
name = "zoom-of-a-zoomed-window-sets-the-frame-it-had-before"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 8, y = 8, width = 1264, height = 784 }. The person presses on main, so mod-a may activate. zoom() of a window it zoomed sets it back to the frame it had before: the person clicks the zoom button twice."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "zoom"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "zoom"

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 280, y = 109, width = 720, height = 480 }, key = true, minimized = false }]
