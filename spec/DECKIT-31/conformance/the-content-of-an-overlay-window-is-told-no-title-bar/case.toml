case = 6
name = "the-content-of-an-overlay-window-is-told-no-title-bar"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-a reads, of the root element of the document f's content is in, whether it has the attribute data-deckit-title-bar and the properties --deckit-title-bar-area-height and --deckit-title-bar-area-x, which it says. A window at the level overlay has no title bar: mod-a, granted system.overlay-windows, opens f."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { guide = "f" }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/f/didAppear", activates = true }, { url = "https://said.test/f/guide/false/0px/0px", activates = true }]
