case = 17
name = "a-key-windows-open-does-not-take-is-not-read"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. A key of options that windows.open does not take is not read: mod-a opens m with the key other."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "m", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = false, minimized = false }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/m/didAppear", activates = true }]
