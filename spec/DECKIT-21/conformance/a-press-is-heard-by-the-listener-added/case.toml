case = 7
name = "a-press-is-heard-by-the-listener-added"
note = "onPress adds a listener, called with no values as the notification is pressed. mod-a shows Standup, adds a listener, and the notification is pressed."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "notifications.show"
args = [{ title = "Standup", body = "in 5 min" }]

[[step]]
input = "call"
mod = "mod-a"
member = "onPress"
of = 2
listener = true

[[step]]
input = "press"
notification = 1

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = [[]]
