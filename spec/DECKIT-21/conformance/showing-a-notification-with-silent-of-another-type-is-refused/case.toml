case = 7
name = "showing-a-notification-with-silent-of-another-type-is-refused"
note = "show is refused at call with kind INVALID_ARGUMENT where silent is not a boolean, never read as one. mod-a shows Standup with silent the string yes."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "notifications.show"
args = [{ title = "Standup", body = "in 5 min", silent = "yes" }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
look = "shown"

[step.expect]
answers = []
