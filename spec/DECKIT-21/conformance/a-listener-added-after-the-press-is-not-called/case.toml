case = 7
name = "a-listener-added-after-the-press-is-not-called"
note = "A listener added after the press was heard is not called. mod-a shows Standup, the notification is pressed, and mod-a adds a listener."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "notifications.show"
args = [{ title = "Standup", body = "in 5 min" }]

[[step]]
input = "press"
notification = 1

[[step]]
input = "call"
mod = "mod-a"
member = "onPress"
of = 2
listener = true

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = []
