case = 7
name = "silent-is-handed-to-the-host-as-given"
note = "silent is handed to the host as the notification gives it, false where it is left out. mod-a shows Standup silent."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "notifications.show"
args = [{ title = "Standup", body = "in 5 min", silent = true }]

[[step]]
look = "shown"

[step.expect]
answers = [{ title = "Standup", body = "in 5 min", silent = true }]
