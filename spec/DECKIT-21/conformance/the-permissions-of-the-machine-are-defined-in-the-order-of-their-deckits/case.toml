case = 1
name = "the-permissions-of-the-machine-are-defined-in-the-order-of-their-deckits"
note = "The system defines each DECKIT's permissions by the DECKITs' numbers: system.file-handlers, then system.clipboard-read and system.clipboard-write, then system.notifications. mod-a asks for them in the other order and is answered them in that one."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"
part = "permissions"

[step.expect]
answers = [
    { id = "system.file-handlers", reason = "f", usable = true, name = "File Handlers", description = "It can open files in the app for them, which can start programs.", privileged = false },
    { id = "system.clipboard-read", reason = "r", usable = true, name = "Clipboard Read", description = "It can read what you copied, from any app.", privileged = false },
    { id = "system.clipboard-write", reason = "w", usable = true, name = "Clipboard Write", description = "It can replace what you copied with text of its own, which you then paste in any app.", privileged = false },
    { id = "system.notifications", reason = "n", usable = true, name = "Notifications", description = "It can show notifications in the corner of the screen, while you are looking at something else.", privileged = false },
]
