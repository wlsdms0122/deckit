case = 7
name = "a-listener-hears-only-the-notification-it-was-added-for"
note = "A listener is called for a press of the notification whose onPress it was handed, and no other. mod-a shows one, then two, and adds a listener to two; one is pressed, then two."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "notifications.show"
args = [{ title = "one" }]

[[step]]
input = "call"
mod = "mod-a"
member = "notifications.show"
args = [{ title = "two" }]

[[step]]
input = "call"
mod = "mod-a"
member = "onPress"
of = 3
listener = true

[[step]]
input = "press"
notification = 1

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = []

[[step]]
input = "press"
notification = 2

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = [[]]
