case = 7
name = "a-notification-of-the-machine-is-handed-to-the-host"
note = "notifications.show hands the host the notification to show on the machine, with its title, body and silent. mod-a, granted system.notifications, shows Standup, in 5 min."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "notifications.show"
args = [{ title = "Standup", body = "in 5 min" }]

[[step]]
look = "shown"

[step.expect]
answers = [{ title = "Standup", body = "in 5 min", silent = false }]
