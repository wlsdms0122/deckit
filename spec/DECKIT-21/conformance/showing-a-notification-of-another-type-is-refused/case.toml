case = 7
name = "showing-a-notification-of-another-type-is-refused"
note = "show is refused at call with kind INVALID_ARGUMENT where notification is not a table. mod-a shows the string Standup."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "notifications.show"
args = ["Standup"]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
look = "shown"

[step.expect]
answers = []
