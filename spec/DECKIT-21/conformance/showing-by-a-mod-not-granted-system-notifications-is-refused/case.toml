case = 7
name = "showing-by-a-mod-not-granted-system-notifications-is-refused"
note = "show is a request system.notifications guards: mod-a, not granted it, shows Standup and is refused at call with kind NOT_PERMITTED, and the host is handed nothing."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "notifications.show"
args = [{ title = "Standup", body = "in 5 min" }]

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"

[[step]]
look = "shown"

[step.expect]
answers = []
