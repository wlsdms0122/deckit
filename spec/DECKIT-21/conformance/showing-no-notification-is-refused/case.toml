case = 7
name = "showing-no-notification-is-refused"
note = "show is refused at call with kind INVALID_ARGUMENT where notification is left out, and the host is handed nothing."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "notifications.show"

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
look = "shown"

[step.expect]
answers = []
