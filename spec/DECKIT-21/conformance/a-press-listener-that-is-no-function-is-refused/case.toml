case = 7
name = "a-press-listener-that-is-no-function-is-refused"
note = "onPress is not a request: it throws its refusal, at call with kind INVALID_ARGUMENT, where listener is not a function. mod-a shows Standup and hands onPress the listener 1."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "notifications.show"
args = [{ title = "Standup", body = "in 5 min" }]

[[step]]
input = "call"
mod = "mod-a"
member = "onPress"
args = [1]
of = 2

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
