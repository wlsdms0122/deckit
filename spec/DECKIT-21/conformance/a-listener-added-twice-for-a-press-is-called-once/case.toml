case = 7
name = "a-listener-added-twice-for-a-press-is-called-once"
note = "A listener is added once for a notification, however often it is handed. mod-a hands the same listener to onPress twice, and the notification is pressed."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "notifications.show"
args = [{ title = "Standup", body = "in 5 min" }]

[[step]]
input = "call"
mod = "mod-a"
member = "onPress"
of = 2
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "onPress"
of = 2
listener = true

[[step]]
input = "press"
notification = 1

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = [[]]
