case = 4
name = "an-owner-that-fails-to-launch-is-refused-at-launch"
note = "A lifecycle whose interface's owner fails to launch hears that refusal at launch. mod-b's entry throws as it evaluates, and mod-a's onRefuse listener is handed a refusal at launch of kind NOT_LAUNCHED."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onRefuse"
args = ["mod-b/pages"]
listener = true

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = [[{ stage = "launch", kind = "NOT_LAUNCHED" }]]
