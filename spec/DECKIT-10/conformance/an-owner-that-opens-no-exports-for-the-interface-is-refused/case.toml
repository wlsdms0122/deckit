case = 4
name = "an-owner-that-opens-no-exports-for-the-interface-is-refused"
note = "A lifecycle whose interface's owner runs with no exports for it that reach the lifecycle hears a refusal at call with kind NOT_EXPORTED. mod-b provides mod-b/pages and opens nothing, and mod-a's onRefuse listener is handed the refusal."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onRefuse"
args = ["mod-b/pages"]
listener = true

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = [[{ stage = "call", kind = "NOT_EXPORTED" }]]
