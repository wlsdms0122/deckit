case = 4
name = "a-mod-that-uses-an-interface-is-handed-its-owners-exports"
note = "A lifecycle of a mod that uses an interface is connected to the exports its owner opened for it, and onConnect hands them to its listener. mod-a uses mod-b/pages, which mod-b provides, and its listener is handed what mod-b's connect answers."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["mod-b/pages"]
listener = true

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = [[{ from = "mod-b" }]]
