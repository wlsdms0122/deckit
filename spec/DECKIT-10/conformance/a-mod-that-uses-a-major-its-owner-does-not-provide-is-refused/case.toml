case = 4
name = "a-mod-that-uses-a-major-its-owner-does-not-provide-is-refused"
note = "A lifecycle whose interface's owner does not provide the major it uses hears a refusal at call with kind UNSUPPORTED_VERSION. mod-a uses major 2 of mod-b/pages, mod-b provides major 1, and mod-a's onRefuse listener is handed the refusal."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onRefuse"
args = ["mod-b/pages"]
listener = true

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = [[{ stage = "call", kind = "UNSUPPORTED_VERSION" }]]
