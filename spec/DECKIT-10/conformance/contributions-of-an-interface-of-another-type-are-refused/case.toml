case = 4
name = "contributions-of-an-interface-of-another-type-are-refused"
note = "exports.contributions(interface) is refused at call with kind INVALID_ARGUMENT where interface is not a string. mod-b asks with an integer."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-b"
member = "exports.contributions"
args = [1]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
