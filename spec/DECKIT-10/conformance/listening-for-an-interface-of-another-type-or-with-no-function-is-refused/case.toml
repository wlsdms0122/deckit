case = 4
name = "listening-for-an-interface-of-another-type-or-with-no-function-is-refused"
note = "onConnect and onRefuse take an interface that is a string and a listener that is a function: one of another type is refused at call with kind INVALID_ARGUMENT, and an interface is not read as a string. mod-a listens for the connections and the refusals of 1, and for those of mod-a/pages with no listener."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = [1]
listener = true

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onRefuse"
args = [1]
listener = true

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["mod-a/pages"]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onRefuse"
args = ["mod-a/pages"]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
