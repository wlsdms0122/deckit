case = 4
name = "a-pin-cleared-hands-the-interface-back-to-the-first-provider"
note = "A pin cleared, mod left out, hands the interface back to the first provider. mod-a pins mod-c for mod-b/pages and clears the pin, and is connected to mod-b."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b", "mod-c"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.pin"
args = ["mod-b/pages", "mod-c"]

[[step]]
input = "call"
mod = "mod-a"
member = "mods.pin"
args = ["mod-b/pages"]

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["mod-b/pages"]
listener = true

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = [[{ from = "mod-b" }]]
