case = 4
name = "a-pinned-provider-owns-the-interface"
note = "A provider pinned owns the interface, whichever provider is first, and a lifecycle that uses it is connected to it from then on. mod-a pins mod-c for mod-b/pages, which mod-b provides first."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b", "mod-c"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.pin"
args = ["mod-b/pages", "mod-c"]

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["mod-b/pages"]
listener = true

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = [[{ from = "mod-c" }]]
