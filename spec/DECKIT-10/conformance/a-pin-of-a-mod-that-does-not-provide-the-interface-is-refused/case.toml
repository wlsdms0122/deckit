case = 4
name = "a-pin-of-a-mod-that-does-not-provide-the-interface-is-refused"
note = "A pin of a mod that does not provide the interface is refused at call with kind NOT_PROVIDER. mod-a pins itself for mod-b/pages, which it only uses."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.pin"
args = ["mod-b/pages", "mod-a"]

[step.expect]
refuses = "call"
kind = "NOT_PROVIDER"
