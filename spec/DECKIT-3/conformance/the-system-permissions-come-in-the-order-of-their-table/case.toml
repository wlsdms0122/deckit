case = 1
name = "the-system-permissions-come-in-the-order-of-their-table"
note = "The system defines its own permissions in its table's order, deckit.mods, deckit.reach-mods, then deckit.system-services, and they are answered in the order they were defined."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-c"]
system = ["mod-c"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-c"
part = "permissions"

[step.expect]
answers = [
    { id = "deckit.mods", reason = "Lists the mods.", usable = true, name = "Mods", description = "It can see every mod, launch and quit them, add one from a folder and delete installed ones, with what they stored.", privileged = true },
    { id = "deckit.reach-mods", reason = "Reaches the mods.", usable = true, name = "Reach Mods", description = "It connects to any mod by its id, which launches the mod if it does not run.", privileged = true },
    { id = "deckit.system-services", reason = "Runs the commands.", usable = true, name = "System Services", description = "It can act on other mods through the system's services: run their commands, change their keys and settings, and choose which mod opens an address.", privileged = true },
]
