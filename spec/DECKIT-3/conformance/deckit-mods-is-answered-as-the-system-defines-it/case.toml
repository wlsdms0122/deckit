case = 1
name = "deckit-mods-is-answered-as-the-system-defines-it"
note = "The system defines deckit.mods, named Mods, with its description, and privileged, so a system mod that asks for it is taken and the permission is usable."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"
part = "permissions"

[step.expect]
answers = [
    { id = "deckit.mods", reason = "Lists the mods.", usable = true, name = "Mods", description = "It can see every mod, launch and quit them, add one from a folder and delete installed ones, with what they stored.", privileged = true },
]
