case = 1
name = "deckit-reach-mods-is-answered-as-the-system-defines-it"
note = "The system defines deckit.reach-mods, named Reach Mods, with its means, and privileged, so a system mod that asks for it is taken and the permission is usable."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-c"]
system = ["mod-c"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-c"
part = "permissions"

[step.expect]
answers = [
    { id = "deckit.reach-mods", reason = "Reaches the mods.", usable = true, name = "Reach Mods", means = "It connects to any mod by its id, which launches the mod if it does not run.", privileged = true },
]
