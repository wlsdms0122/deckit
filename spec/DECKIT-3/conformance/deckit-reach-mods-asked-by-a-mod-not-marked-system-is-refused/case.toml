case = 1
name = "deckit-reach-mods-asked-by-a-mod-not-marked-system-is-refused"
note = "deckit.reach-mods is privileged, so a bundle read in place that asks for it is refused at read."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-c"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-c"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
