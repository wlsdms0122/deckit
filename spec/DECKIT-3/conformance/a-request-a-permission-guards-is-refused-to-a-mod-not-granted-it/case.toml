case = 3
name = "a-request-a-permission-guards-is-refused-to-a-mod-not-granted-it"
note = "A request a permission guards, made by a mod not granted that permission, is refused at call with NOT_PERMITTED. mod-a, granted nothing, lists the mods, which deckit.mods guards."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.list"

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"
