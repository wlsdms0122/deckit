case = 2
name = "a-background-mod-runs-once-the-app-has-started"
note = "As the app starts, every background mod the catalog holds launches, so mod-a shipped with background runs once the start has settled."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "run"
mod = "mod-a"

[step.expect]
answers = "running"

