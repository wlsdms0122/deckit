case = 3
name = "a-mod-asked-to-launch-while-it-runs-is-left-as-it-is"
note = "A mod asked to launch while its run is running is left as it is. mod-a launches mod-b twice, and the start of mod-b, which hands the host an address, is called once."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-b"]

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-b"]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://example.com/started", activates = true }]
