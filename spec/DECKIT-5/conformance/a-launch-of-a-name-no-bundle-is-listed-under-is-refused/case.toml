case = 3
name = "a-launch-of-a-name-no-bundle-is-listed-under-is-refused"
note = "launch is refused at call with NOT_INSTALLED where no bundle is listed under id, as for mod-z."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-z"]

[step.expect]
refuses = "call"
kind = "NOT_INSTALLED"
