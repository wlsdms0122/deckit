case = 2
name = "a-background-mod-whose-entry-throws-comes-to-the-relaunch-limit"
note = "A run whose entry throws as it is evaluated fails to launch and counts, and a background mod whose run failed launches again until it is at the relaunch limit, so mod-a is refused at launch with RELAUNCH_LIMIT."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "run"
mod = "mod-a"

[step.expect]
refuses = "launch"
kind = "RELAUNCH_LIMIT"

