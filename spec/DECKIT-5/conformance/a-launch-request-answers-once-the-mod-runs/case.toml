case = 3
name = "a-launch-request-answers-once-the-mod-runs"
note = "launch launches the mod the catalog holds under id and answers once its run is running. mod-a, granted deckit.mods, launches mod-b."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-b"]

[[step]]
look = "run"
mod = "mod-b"

[step.expect]
answers = "running"
