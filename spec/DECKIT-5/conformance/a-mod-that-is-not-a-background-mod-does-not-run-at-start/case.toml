case = 2
name = "a-mod-that-is-not-a-background-mod-does-not-run-at-start"
note = "A mod launches only as something asks it, and the start asks only the background mods, so mod-a without background does not run."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "run"
mod = "mod-a"

[step.expect]
answers = "notRunning"

