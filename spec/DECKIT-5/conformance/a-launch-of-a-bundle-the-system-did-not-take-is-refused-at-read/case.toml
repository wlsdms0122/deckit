case = 3
name = "a-launch-of-a-bundle-the-system-did-not-take-is-refused-at-read"
note = "launch is refused at read with NOT_LOADABLE where the system did not take the bundle the catalog holds under id. The manifest of mod-b writes no version."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-b"]

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
