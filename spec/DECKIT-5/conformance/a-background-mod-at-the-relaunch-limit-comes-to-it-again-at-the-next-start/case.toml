case = 2
name = "a-background-mod-at-the-relaunch-limit-comes-to-it-again-at-the-next-start"
note = "A run that fails to launch is notRunning at once, so the app quits once every run of mod-a has ended. At the next start mod-a, whose entry throws, fails at each launch until it is at the relaunch limit again."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
look = "run"
mod = "mod-a"

[step.expect]
refuses = "launch"
kind = "RELAUNCH_LIMIT"
