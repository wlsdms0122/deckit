case = 2
name = "a-mod-that-is-not-a-background-mod-whose-entry-throws-is-not-refused"
note = "A mod that is not a background mod does not launch at start, so mod-a, whose entry throws, has no run, and is answered notRunning, not refused at launch."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "run"
mod = "mod-a"

[step.expect]
answers = "notRunning"

