case = 3
name = "a-relaunch-whose-new-run-fails-to-launch-is-refused-at-launch"
note = "relaunch launches the mod as launch does, with its refusals, so it is refused at launch with NOT_LAUNCHED where the new run fails to launch. The entry of mod-b throws as it is evaluated."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.relaunch"
args = ["mod-b"]

[step.expect]
refuses = "launch"
kind = "NOT_LAUNCHED"
