case = 3
name = "a-mod-that-quits-itself-as-it-starts-is-not-launched-again"
note = "quit() asks the end of a run that is launching as well. The start of mod-a, a background mod, quits it before its code has started, and a run whose end quit() asked has not failed, so mod-a is not launched again and is notRunning."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "run"
mod = "mod-a"

[step.expect]
answers = "notRunning"
