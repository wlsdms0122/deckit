case = 22
name = "a-child-is-told-did-disappear-as-its-window-is-minimized"
note = "A child's view is told didDisappear as its region's window goes off screen: the window is minimized, and mod-b says didAppear, then didDisappear."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { region = 1, interface = "case/view", box = { x = 100, y = 100, width = 200, height = 150 } }, { place = 1, id = "mod-b" }]

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "minimize"

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/mod-b/didAppear", activates = true }, { url = "https://said.test/mod-b/didDisappear", activates = true }]
