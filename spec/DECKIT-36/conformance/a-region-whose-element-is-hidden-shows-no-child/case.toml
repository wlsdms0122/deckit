case = 22
name = "a-region-whose-element-is-hidden-shows-no-child"
note = "A region's rect is nothing while its element is hidden: mod-a hides the element, and no child is laid."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { region = 1, interface = "case/view", box = { x = 100, y = 100, width = 200, height = 150 } }, { place = 1, id = "mod-b" }]

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { hide = 1 }]

[[step]]
look = "regions"

[step.expect]
answers = []
