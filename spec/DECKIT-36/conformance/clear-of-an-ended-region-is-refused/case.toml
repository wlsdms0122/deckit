case = 22
name = "clear-of-an-ended-region-is-refused"
note = "clear of a region that has ended is refused at call with ENDED: mod-a removes the region's element, then clears it."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { region = 1, interface = "case/view", box = { x = 100, y = 100, width = 200, height = 150 } }]

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { remove = 1 }]

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { clear = 1 }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/clear/1/threw/ENDED", activates = true }]
