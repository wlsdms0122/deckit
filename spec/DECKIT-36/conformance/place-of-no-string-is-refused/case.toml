case = 22
name = "place-of-no-string-is-refused"
note = "place is refused at call with INVALID_ARGUMENT where id is no string: mod-a places the integer 5."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { region = 1, interface = "case/view", box = { x = 100, y = 100, width = 200, height = 150 } }, { place = 1, id = 5 }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/place/1/threw/INVALID_ARGUMENT", activates = true }]
