case = 22
name = "a-drop-on-a-childs-view-reaches-no-destination-under-it"
note = "A drop on a child's view is not the parent's: notes is dropped on mod-b's view over mod-a's region inside mod-a's destination, and mod-a's destination is not called."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.on"
args = ["mod-a:dropped"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { drop = "outer", box = { x = 50, y = 50, width = 300, height = 300 } }, { region = 1, interface = "case/view", box = { x = 100, y = 100, width = 100, height = 100 } }, { place = 1, id = "mod-b" }]

[[step]]
input = "drop"
mod = "mod-a"
name = "main"
folders = ["notes"]
at = { x = 120, y = 130 }

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = []
