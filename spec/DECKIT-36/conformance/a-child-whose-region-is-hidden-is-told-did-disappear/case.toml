case = 22
name = "a-child-whose-region-is-hidden-is-told-did-disappear"
note = "A child's view is told didDisappear as its region's rect becomes empty, and didAppear as it is seen again: mod-a hides the element, then shows it."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { region = 1, interface = "case/view", box = { x = 100, y = 100, width = 200, height = 150 } }, { place = 1, id = "mod-b" }]

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { hide = 1 }]

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { show = 1 }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/mod-b/didAppear", activates = true }, { url = "https://said.test/mod-b/didDisappear", activates = true }, { url = "https://said.test/mod-b/didAppear", activates = true }]
