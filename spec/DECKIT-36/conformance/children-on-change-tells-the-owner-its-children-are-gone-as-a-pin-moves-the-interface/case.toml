case = 22
name = "children-on-change-tells-the-owner-its-children-are-gone-as-a-pin-moves-the-interface"
note = "A listener of children.onChange is called with the interface and the children as they change: mod-a listens, mod-x pins case/view to mod-c, and mod-a's listener is called with case/view and no children."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b", "mod-c", "mod-x"]
system = ["mod-x"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "children.onChange"
handle = "shell"
listener = true

[[step]]
input = "call"
mod = "mod-x"
member = "mods.pin"
args = ["case/view", "mod-c"]

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = [["case/view", []]]
