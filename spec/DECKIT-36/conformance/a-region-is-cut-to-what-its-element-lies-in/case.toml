case = 22
name = "a-region-is-cut-to-what-its-element-lies-in"
note = "A region's rect is its element's cut to each element it lies in that cuts what overflows it: mod-a's element at 150, 150, 200 by 150, lies in an element at 100, 100, 100 by 100 that cuts what overflows it, and mod-b is laid at 433, 257, 50 by 50."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { region = 1, interface = "case/view", clip = { x = 100, y = 100, width = 100, height = 100 }, box = { x = 50, y = 50, width = 200, height = 150 } }, { place = 1, id = "mod-b" }]

[[step]]
look = "regions"

[step.expect]
answers = [{ mod = "mod-b", parent = "mod-a", window = "main", frame = { x = 433, y = 257, width = 50, height = 50 } }]
