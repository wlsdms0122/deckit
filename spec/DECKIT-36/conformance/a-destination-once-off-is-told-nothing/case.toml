case = 22
name = "a-destination-once-off-is-told-nothing"
note = "A destination is told nothing once its off is called: mod-a calls it, notes is dropped on the element, and onDrop is not called."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.on"
args = ["mod-a:dropped"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { drop = "outer", box = { x = 50, y = 50, width = 300, height = 300 } }, { off = "outer" }]

[[step]]
input = "drop"
mod = "mod-a"
name = "main"
folders = ["notes"]
at = { x = 70, y = 80 }

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = []
