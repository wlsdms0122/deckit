case = 22
name = "a-child-whose-region-shows-another-is-told-did-disappear"
note = "A child's view is told didDisappear as its region shows another: mod-a places mod-b, then mod-c, and mod-b says didAppear, then didDisappear."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b", "mod-c"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { region = 1, interface = "case/view", box = { x = 100, y = 100, width = 200, height = 150 } }, { place = 1, id = "mod-b" }]

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { place = 1, id = "mod-c" }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/mod-b/didAppear", activates = true }, { url = "https://said.test/mod-b/didDisappear", activates = true }]
