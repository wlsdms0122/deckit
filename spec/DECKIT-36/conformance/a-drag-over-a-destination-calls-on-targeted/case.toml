case = 22
name = "a-drag-over-a-destination-calls-on-targeted"
note = "onTargeted is called with true as a drag of files comes over the element, and with false as it is dropped."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.on"
args = ["mod-a:targeted"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { drop = "outer", box = { x = 50, y = 50, width = 300, height = 300 } }]

[[step]]
input = "drop"
mod = "mod-a"
name = "main"
folders = ["notes"]
at = { x = 70, y = 80 }

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = [["outer", true], ["outer", false]]
