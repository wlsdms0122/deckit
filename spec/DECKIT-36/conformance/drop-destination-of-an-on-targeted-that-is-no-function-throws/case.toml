case = 22
name = "drop-destination-of-an-on-targeted-that-is-no-function-throws"
note = "dropDestination throws INVALID_ARGUMENT at call where options.onTargeted is no function: mod-a hands it the integer 5."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { drop = "outer", box = { x = 50, y = 50, width = 300, height = 300 }, options = { onTargeted = 5 } }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/drop/outer/threw/INVALID_ARGUMENT", activates = true }]
