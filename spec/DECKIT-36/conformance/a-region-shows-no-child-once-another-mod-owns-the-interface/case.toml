case = 22
name = "a-region-shows-no-child-once-another-mod-owns-the-interface"
note = "A region shows a child no more once the child is its mod's no more: mod-x pins case/view to mod-c, and mod-a's region shows nothing."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b", "mod-c", "mod-x"]
system = ["mod-x"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { region = 1, interface = "case/view", box = { x = 100, y = 100, width = 200, height = 150 } }, { place = 1, id = "mod-b" }]

[[step]]
input = "call"
mod = "mod-x"
member = "mods.pin"
args = ["case/view", "mod-c"]

[[step]]
look = "regions"

[step.expect]
answers = []
