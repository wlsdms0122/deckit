case = 22
name = "a-drop-destination-with-a-key-the-table-does-not-give-takes-a-drop"
note = "A key of options the table does not give is not read: mod-a's destination holds extra = 5 beside onDrop, and notes dropped on it reaches onDrop."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.on"
args = ["mod-a:dropped"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { drop = "outer", box = { x = 50, y = 50, width = 300, height = 300 }, extra = { extra = 5 } }]

[[step]]
input = "drop"
mod = "mod-a"
name = "main"
folders = ["notes"]
at = { x = 70, y = 80 }

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = [["outer", ["notes"], { x = 20, y = 30 }]]
