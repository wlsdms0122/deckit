case = 22
name = "a-child-is-told-did-disappear-as-its-parent-quits"
note = "A child's view is told didDisappear as the parent's run ends: mod-x quits mod-a, and mod-b says didAppear, then didDisappear."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b", "mod-x"]
system = ["mod-x"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { region = 1, interface = "case/view", box = { x = 100, y = 100, width = 200, height = 150 } }, { place = 1, id = "mod-b" }]

[[step]]
input = "call"
mod = "mod-x"
member = "mods.quit"
args = ["mod-a"]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/mod-b/didAppear", activates = true }, { url = "https://said.test/mod-b/didDisappear", activates = true }]
