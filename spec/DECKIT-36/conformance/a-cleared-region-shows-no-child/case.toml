case = 22
name = "a-cleared-region-shows-no-child"
note = "clear leaves the region showing no child: mod-a places mod-b, then clears the region, and no child is laid."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { region = 1, interface = "case/view", box = { x = 100, y = 100, width = 200, height = 150 } }, { place = 1, id = "mod-b" }]

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { clear = 1 }]

[[step]]
look = "regions"

[step.expect]
answers = []
