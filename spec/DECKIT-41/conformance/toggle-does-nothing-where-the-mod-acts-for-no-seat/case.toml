case = 23
name = "toggle-does-nothing-where-the-mod-acts-for-no-seat"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as its event go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the base shell, 1280 by 800, under a bar 52 high across its top, so that its desktop is { x = 0, y = 52, width = 1280, height = 748 }. toggle() does nothing where the view's mod acts for no seat: mod-a opens main and v at the place top-right in attach, and is told to call toggle() of v, no input of a seat having reached it: v is shown for no seat, open still."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
bar = 52

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "toggle", name = "v" }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 141, width = 720, height = 480 }, key = false, minimized = false }]

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { list = true }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/didAppear", activates = true }, { url = "https://said.test/list/main,v", activates = true }]
