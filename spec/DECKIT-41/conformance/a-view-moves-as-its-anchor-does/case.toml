case = 23
name = "a-view-moves-as-its-anchor-does"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as its event go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the base shell, 1280 by 800, under a bar 52 high across its top, so that its desktop is { x = 0, y = 52, width = 1280, height = 748 }. A view under an anchor moves as the anchor does: mod-a opens p 120 by 32 in the bar, at { x = 1152, y = 10 }, names the anchor spot of it at { x = 20, y = 0, width = 40, height = 32 } and opens v 320 by 240 under it, activates false, at { x = 892, y = 60 }; it then tells spot at { x = 0, y = 0, width = 40, height = 32 }, whose right edge is 1192, and v stands at { x = 872, y = 60 }."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
bar = 52

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "setAnchors", name = "p", args = [[{ id = "spot", rect = { x = 20, y = 0, width = 40, height = 32 }, mod = "mod-a" }]] }]

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { open = { name = "v", level = "panel", activates = false, width = 320, height = 240, anchor = { mod = "mod-a", id = "spot" } } }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "p", level = "panel", frame = { x = 1152, y = 10, width = 120, height = 32 }, key = false, minimized = false }, { mod = "mod-a", name = "v", level = "panel", frame = { x = 892, y = 60, width = 320, height = 240 }, key = false, minimized = false }]

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "setAnchors", name = "p", args = [[{ id = "spot", rect = { x = 0, y = 0, width = 40, height = 32 }, mod = "mod-a" }]] }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "p", level = "panel", frame = { x = 1152, y = 10, width = 120, height = 32 }, key = false, minimized = false }, { mod = "mod-a", name = "v", level = "panel", frame = { x = 872, y = 60, width = 320, height = 240 }, key = false, minimized = false }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/p/didAppear", activates = true }, { url = "https://said.test/v/didAppear", activates = true }]
