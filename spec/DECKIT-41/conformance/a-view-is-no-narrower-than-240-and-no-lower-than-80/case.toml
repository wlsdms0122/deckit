case = 23
name = "a-view-is-no-narrower-than-240-and-no-lower-than-80"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the base shell, 1280 by 800, under a bar 52 high across its top, so that its desktop is { x = 0, y = 52, width = 1280, height = 748 }. A view's width is no less than 240 and its height no less than 80: mod-a, granted deckit.panel-windows, opens v 100 by 20 at the level panel and the place top-left, activates false."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
bar = 52

[[step]]
input = "start"

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "v", level = "panel", frame = { x = 8, y = 60, width = 240, height = 80 }, key = false, minimized = false }]
