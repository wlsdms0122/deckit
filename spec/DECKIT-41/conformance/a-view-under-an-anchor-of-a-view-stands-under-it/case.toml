case = 23
name = "a-view-under-an-anchor-of-a-view-stands-under-it"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as its event go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the base shell, 1280 by 800, under a bar 52 high across its top, so that its desktop is { x = 0, y = 52, width = 1280, height = 748 }. An anchor of a view stands while the view stands: mod-a opens u 320 by 240 at the place top-right, activates false, at { x = 952, y = 60 }, names the anchor spot of it at { x = 100, y = 10, width = 40, height = 20 } and opens v 320 by 240 under it, activates false: the anchor's right edge is 1092 and its bottom 90, so v stands at { x = 772, y = 98 }."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
bar = 52

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "setAnchors", name = "u", args = [[{ id = "spot", rect = { x = 100, y = 10, width = 40, height = 20 }, mod = "mod-a" }]] }]

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { open = { name = "v", level = "panel", activates = false, width = 320, height = 240, anchor = { mod = "mod-a", id = "spot" } } }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "u", level = "panel", frame = { x = 952, y = 60, width = 320, height = 240 }, key = false, minimized = false }, { mod = "mod-a", name = "v", level = "panel", frame = { x = 772, y = 98, width = 320, height = 240 }, key = false, minimized = false }]
