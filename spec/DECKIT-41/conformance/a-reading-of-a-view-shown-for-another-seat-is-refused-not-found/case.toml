case = 26
name = "a-reading-of-a-view-shown-for-another-seat-is-refused-not-found"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as its event go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the base shell, 1280 by 800, under a bar 52 high across its top, so that its desktop is { x = 0, y = 52, width = 1280, height = 748 }. A view shown for one seat by activation is on no other seat's screen, so another seat does not read it. A party attaches as ada, at the seat s1, and presses main, so mod-a acts for s1, and mod-a is told to open v 320 by 240 at the place top-right, at the level panel: v is shown by activation for s1, at { x = 952, y = 60 }, and holds the keyboard of s1. A second party attaches as bob, at the seat s2, before that. s2 reads the window w2, v, and is refused NOT_FOUND, as what a seat reads refuses a window that is not on the seat's screen."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }, { id = "bob", name = "Bob Kahn" }]
keys = [{ principal = "ada", key = "first" }, { principal = "bob", key = "second" }]
bar = 52

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "attach"
party = "q"
principal = "bob"
key = "second"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { open = { name = "v", level = "panel", place = "top-right", width = 320, height = 240 } }]

[[step]]
input = "ask"
party = "q"
method = "seat/read"
params = { of = "window", window = "w2" }

[step.expect]
refuses = "call"
kind = "NOT_FOUND"
