case = 23
name = "a-view-whose-anchor-no-window-tells-opens-and-stands-nowhere"
note = "mod-a's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event mod-a:go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the base shell, 1280 by 800, under a bar 52 high across its top, so that its desktop is { x = 0, y = 52, width = 1280, height = 748 }. A name no window tells refuses nothing, and a view whose anchor does not stand is on no seat's screen, open still: mod-a, granted deckit.panel-windows, opens v at the level panel under the anchor { mod = \"mod-a\", id = \"spot\" }, activates false, and is told to list its windows."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
bar = 52

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { list = true }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/list/v", activates = true }]

[[step]]
look = "windows"

[step.expect]
answers = []
