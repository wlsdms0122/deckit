case = 26
name = "a-key-of-each-of-two-seats-a-view-is-shown-for-goes-to-the-view"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as its event go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the base shell, 1280 by 800, under a bar 52 high across its top, so that its desktop is { x = 0, y = 52, width = 1280, height = 748 }. A view holds the keyboard of every seat it is shown for by activation, of several at once. mod-a has the windows main and second. Two parties attach, as ada at the seat s1 and as bob at s2. s1 presses second, and mod-a is told to open v 320 by 240 at the place top-right, at the level panel: v is shown by activation for s1, and holds the keyboard of s1. s2 presses main, its key window, so mod-a acts for s2, and mod-a is told to call makeKeyAndOrderFront() of v: v is shown for s2 too. v holds the keyboard of s2 as it holds that of s1: main, the key window of s2, is told didResignKey, and v, key already, is told nothing. A down of s2 in v answers key true, and the key KeyA of s2 and then of s1 each answers the window 3, v."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }, { id = "bob", name = "Bob Kahn" }]
keys = [{ principal = "ada", key = "first" }, { principal = "bob", key = "second" }]
bar = 52

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "attach"
party = "q"
principal = "bob"
key = "second"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { open = { name = "v", level = "panel", place = "top-right", width = 320, height = 240 } }]

[[step]]
input = "ask"
party = "q"
method = "seat/input"
params = { event = "pointer", type = "down", x = 290, y = 300, button = 0, count = 1 }

[step.expect]
answers = { over = 1, key = true, at = { x = 290, y = 300 } }

[[step]]
input = "ask"
party = "q"
method = "seat/input"
params = { event = "pointer", type = "up", x = 290, y = 300, button = 0, count = 1 }

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "makeKeyAndOrderFront", name = "v" }]

[[step]]
look = "windows"
seat = "s2"

[step.expect]
answers = [{ mod = "mod-a", name = "second", level = "normal", frame = { x = 307, y = 165, width = 720, height = 480 }, key = false, minimized = false }, { mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 141, width = 720, height = 480 }, key = false, minimized = false }, { mod = "mod-a", name = "v", level = "panel", frame = { x = 952, y = 60, width = 320, height = 240 }, key = false, minimized = false }]

[[step]]
input = "ask"
party = "q"
method = "seat/input"
params = { event = "pointer", type = "down", x = 1000, y = 100, button = 0, count = 1 }

[step.expect]
answers = { over = 3, key = true, at = { x = 1000, y = 100 } }

[[step]]
input = "ask"
party = "q"
method = "seat/input"
params = { event = "pointer", type = "up", x = 1000, y = 100, button = 0, count = 1 }

[[step]]
input = "ask"
party = "q"
method = "seat/input"
params = { event = "key", type = "down", code = "KeyA", key = "a" }

[step.expect]
answers = { to = 3 }

[[step]]
input = "ask"
party = "q"
method = "seat/input"
params = { event = "key", type = "up", code = "KeyA", key = "a" }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "key", type = "down", code = "KeyA", key = "a" }

[step.expect]
answers = { to = 3 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "key", type = "up", code = "KeyA", key = "a" }

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/didAppear", activates = true }, { url = "https://said.test/second/didAppear", activates = true }, { url = "https://said.test/second/didBecomeKey", activates = true }, { url = "https://said.test/second/didResignKey", activates = true }, { url = "https://said.test/v/didAppear", activates = true }, { url = "https://said.test/v/didBecomeKey", activates = true }, { url = "https://said.test/main/didBecomeKey", activates = true }, { url = "https://said.test/main/didResignKey", activates = true }]
