case = 26
name = "an-idle-holder-gives-a-view-s-keyboard-up-as-the-view-is-shown-for-another-seat"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as its event go tells it, a refusal opening https://said.test/<name>/threw/<kind>, on the base shell, 1280 by 800, under a bar 52 high across its top, so that its desktop is { x = 0, y = 52, width = 1280, height = 748 }. A seat takes the keyboard of a view as the view is shown for it where the seat that holds it is idle, and the idle holder gives it up. With the idle time 0 every seat is idle at once. mod-a has the windows main and second. Two parties attach, as ada at the seat s1 and as bob at s2. s1 presses second, and mod-a is told to open v 320 by 240 at the place top-right, at the level panel: v is shown by activation for s1, which holds its keyboard. s2 presses main, its key window, so mod-a acts for s2, and mod-a is told to call makeKeyAndOrderFront() of v: v is shown for s2 too. s2 holds the keyboard of v from then: main, the key window of s2, is told didResignKey, and second, that of s1, didBecomeKey, its keyboard back with it; the key KeyA of s2 answers the window 3, v; and s1 is told the output held of the window 3 and the holder s2; v, whose keyboard a seat held throughout, is told nothing."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }, { id = "bob", name = "Bob Kahn" }]
keys = [{ principal = "ada", key = "first" }, { principal = "bob", key = "second" }]
seats = { idleTime = 0 }
bar = 52

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "attach"
party = "q"
principal = "bob"
key = "second"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", x = 600, y = 300, button = 0, count = 1 }

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { open = { name = "v", level = "panel", place = "top-right", width = 320, height = 240 } }]

[[step]]
input = "ask"
party = "q"
method = "seat/input"
params = { event = "pointer", type = "down", x = 290, y = 300, button = 0, count = 1 }

[step.expect]
answers = { over = 1, key = "key", holder = "s2", at = { x = 290, y = 300 } }

[[step]]
input = "ask"
party = "q"
method = "seat/input"
params = { event = "pointer", type = "up", x = 290, y = 300, button = 0, count = 1 }

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "makeKeyAndOrderFront", name = "v" }]

[[step]]
look = "windows"
seat = "s2"

[step.expect]
answers = [{ mod = "mod-a", name = "second", level = "normal", frame = { x = 307, y = 165, width = 720, height = 480 }, key = false, minimized = false }, { mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 141, width = 720, height = 480 }, key = false, minimized = false }, { mod = "mod-a", name = "v", level = "panel", frame = { x = 952, y = 60, width = 320, height = 240 }, key = false, minimized = false }]

[[step]]
input = "ask"
party = "q"
method = "seat/input"
params = { event = "key", type = "down", code = "KeyA", key = "a" }

[step.expect]
answers = { to = 3 }

[[step]]
input = "ask"
party = "q"
method = "seat/input"
params = { event = "key", type = "up", code = "KeyA", key = "a" }

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/didAppear", activates = true }, { url = "https://said.test/second/didAppear", activates = true }, { url = "https://said.test/second/didBecomeKey", activates = true }, { url = "https://said.test/second/didResignKey", activates = true }, { url = "https://said.test/v/didAppear", activates = true }, { url = "https://said.test/v/didBecomeKey", activates = true }, { url = "https://said.test/main/didBecomeKey", activates = true }, { url = "https://said.test/main/didResignKey", activates = true }, { url = "https://said.test/second/didBecomeKey", activates = true }]

[[step]]
look = "told"
party = "p"
part = "messages"

[step.expect]
answers = [{ method = "seat/output", request = false, params = { of = "held", window = 3, holder = "s2" } }]
