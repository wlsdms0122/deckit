case = 19
name = "remove-from-dock-leaves-a-running-app-after-those-kept"
note = "Each mod is a background mod, so each launches as the host app starts, in the order the host ships it. The person chooses Remove from Dock from mod-a's item's menu: it is kept no more, and runs, so it follows mod-b, which is kept."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "dock"
mod = "mod-a"
action = "remove"

[[step]]
look = "dock"

[step.expect]
answers = [{ mod = "mod-b", pinned = true, running = true, attention = false, active = false }, { mod = "mod-a", pinned = false, running = true, attention = false, active = false }]
