case = 19
name = "the-first-dock-keeps-the-mods-the-host-names"
note = "Each mod is a background mod, so each launches as the host app starts, in the order the host ships it. The host names mod-b and then mod-a as the mods it keeps in the Dock at the first start, so they are kept in that order, and mod-c, which it ships and does not name, runs and follows them."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b", "mod-c"]
dock = ["mod-b", "mod-a"]

[[step]]
input = "start"

[[step]]
look = "dock"

[step.expect]
answers = [{ mod = "mod-b", pinned = true, running = true, attention = false, active = false }, { mod = "mod-a", pinned = true, running = true, attention = false, active = false }, { mod = "mod-c", pinned = false, running = true, attention = false, active = false }]
