case = 15
name = "a-mod-kept-in-the-dock-names-the-shell-under-kept"
note = "mod-c, marked system and granted deckit.mods, keeps the Dock through the handle shell. mod-c installs mod-a once the host app started, so mod-a does not run, and keeps it in the Dock with mods.setPinned. mods.usage of mod-a names the shell under kept."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-c"]
system = ["mod-c"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-c"
member = "mods.install"
folders = ["mod-a"]
part = "id"

[[step]]
input = "call"
mod = "mod-c"
member = "mods.setPinned"
handle = "shell"
args = ["mod-a", true]

[[step]]
input = "call"
mod = "mod-c"
member = "mods.usage"
args = ["mod-a"]
part = "kept"

[step.expect]
answers = ["shell"]
