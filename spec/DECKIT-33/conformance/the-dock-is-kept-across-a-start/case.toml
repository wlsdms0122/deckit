case = 19
name = "the-dock-is-kept-across-a-start"
note = "Each mod is a background mod, so each launches as the host app starts, in the order the host ships it. The host names mod-a and then mod-b as the mods it keeps in the Dock at the first start. The person drags mod-b's item onto mod-a's place and removes mod-a from the Dock; the host app quits and starts again, and the Dock is as the person left it, mod-a running after mod-b, whatever the host names."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
dock = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "dock"
mod = "mod-b"
action = "drag"
to = "mod-a"

[[step]]
input = "dock"
mod = "mod-a"
action = "remove"

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
look = "dock"

[step.expect]
answers = [{ mod = "mod-b", pinned = true, running = true, attention = false, active = false }, { mod = "mod-a", pinned = false, running = true, attention = false, active = false }]
