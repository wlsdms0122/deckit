case = 19
name = "the-active-mark-stays-with-the-desktops-key-window-while-an-overlay-window-has-the-keyboard"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event <mod>:go tells it, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-a opens main in attach, and the person presses on it. mod-a, marked system and granted deckit.reach-mods, reaches mod-b by its id, so mod-b may activate, and mod-b, granted system.overlay-windows, opens the overlay window f, which takes the keyboard: mod-b is the active mod, and the item marked active is mod-a's, whose main is the desktop's key window, as the title names it."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.reach"
args = ["mod-b"]

[[step]]
input = "call"
mod = "mod-b"
member = "events.emit"
args = ["go", { open = { name = "f", level = "overlay", width = 200, height = 100 } }]

[[step]]
look = "desktop"

[step.expect]
answers = { active = "mod-b", attention = [], title = "mod-a" }

[[step]]
look = "dock"

[step.expect]
answers = [{ mod = "mod-a", pinned = true, running = true, attention = false, active = true }, { mod = "mod-b", pinned = true, running = true, attention = false, active = false }]
