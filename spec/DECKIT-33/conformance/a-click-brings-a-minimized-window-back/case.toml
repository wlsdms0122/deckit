case = 19
name = "a-click-brings-a-minimized-window-back"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event <mod>:go tells it, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-b opens main in attach and minimizes it; the person clicks mod-b's item, and main comes back on screen in front, key."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-b"
member = "events.emit"
args = ["go", { do = "minimize", name = "main" }]

[[step]]
input = "dock"
mod = "mod-b"
action = "click"

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-b", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = true, minimized = false }]
