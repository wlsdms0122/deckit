case = 19
name = "a-click-brings-an-overlay-window-in-front-with-the-keyboard"
note = "Each mod's code, in attach, opens the windows the case says, mod-b's each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event <mod>:go tells it, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-a opens main in attach, and the person presses on it. mod-b, granted system.overlay-windows, opens the overlay window f without the keyboard, and has reopen(), which opens https://said.test/reopen/mod-b outside the app. The person clicks mod-b's item: f takes the keyboard, and reopen() is not called, as mod-b has a window open. mod-a's window says no callback: what the pages of two mods say reaches the host in no order between them."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "call"
mod = "mod-b"
member = "events.emit"
args = ["go", { open = { name = "f", level = "overlay", width = 200, height = 100, activates = false } }]

[[step]]
input = "dock"
mod = "mod-b"
action = "click"

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = false, minimized = false }, { mod = "mod-b", name = "f", level = "overlay", frame = { x = 540, y = 160, width = 200, height = 100 }, key = true, minimized = false }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/f/didAppear", activates = true }, { url = "https://said.test/f/didBecomeKey", activates = true }]
