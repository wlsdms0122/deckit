case = 19
name = "a-click-on-an-app-that-does-not-run-launches-it"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event <mod>:go tells it, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-b opens main in attach. The person quits mod-b from its item's menu and clicks its item: it launches, and its main, as the click is input reaching mod-b, comes in front as the key window."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "dock"
mod = "mod-b"
action = "quit"

[[step]]
input = "dock"
mod = "mod-b"
action = "click"

[[step]]
look = "run"
mod = "mod-b"

[step.expect]
answers = "running"

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-b", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = true, minimized = false }]
