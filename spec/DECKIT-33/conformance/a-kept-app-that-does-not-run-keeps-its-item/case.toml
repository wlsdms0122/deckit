case = 19
name = "a-kept-app-that-does-not-run-keeps-its-item"
note = "Each mod is a background mod, so each launches as the host app starts, in the order the host ships it. The person quits mod-b from its item's menu: its run ends, and its item stays where it is kept, not running."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "dock"
mod = "mod-b"
action = "quit"

[[step]]
look = "run"
mod = "mod-b"

[step.expect]
answers = "notRunning"

[[step]]
look = "dock"

[step.expect]
answers = [{ mod = "mod-a", pinned = true, running = true, attention = false, active = false }, { mod = "mod-b", pinned = true, running = false, attention = false, active = false }]
