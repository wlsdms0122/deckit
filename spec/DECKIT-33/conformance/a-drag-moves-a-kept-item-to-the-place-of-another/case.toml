case = 19
name = "a-drag-moves-a-kept-item-to-the-place-of-another"
note = "Each mod is a background mod, so each launches as the host app starts, in the order the host ships it. The person drags mod-c's item onto mod-a's place: mod-c takes it, and mod-a and mod-b move along by one."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b", "mod-c"]

[[step]]
input = "start"

[[step]]
input = "dock"
mod = "mod-c"
action = "drag"
to = "mod-a"

[[step]]
look = "dock"

[step.expect]
answers = [{ mod = "mod-c", pinned = true, running = true, attention = false, active = false }, { mod = "mod-a", pinned = true, running = true, attention = false, active = false }, { mod = "mod-b", pinned = true, running = true, attention = false, active = false }]
