case = 19
name = "reopen-is-called-on-an-instance-with-no-attach"
note = "Each mod is a background mod, so each launches as the host app starts, in the order the host ships it. mod-b's instance has start(), which keeps the handle deckit, and reopen(), which opens https://said.test/reopen outside the app, and no attach. The person clicks mod-b's item: it runs and has no window open, so reopen() is called."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "dock"
mod = "mod-b"
action = "click"

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/reopen", activates = true }]
