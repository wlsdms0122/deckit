case = 19
name = "the-apps-that-run-and-are-not-kept-follow-in-the-order-they-launched"
note = "Each mod is a background mod, so each launches as the host app starts, in the order the host ships it. mod-c, marked system and granted deckit.mods, keeps the Dock through the handle shell. The host keeps mod-c alone in the Dock; mod-a and mod-b run and follow it as they launched; the person quits mod-a from its item's menu, so it leaves the Dock, and mod-c opens it, so it launches after mod-b."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b", "mod-c"]
system = ["mod-c"]
dock = ["mod-c"]

[[step]]
input = "start"

[[step]]
input = "dock"
mod = "mod-a"
action = "quit"

[[step]]
look = "dock"

[step.expect]
answers = [{ mod = "mod-c", pinned = true, running = true, attention = false, active = false }, { mod = "mod-b", pinned = false, running = true, attention = false, active = false }]

[[step]]
input = "call"
mod = "mod-c"
member = "mods.open"
handle = "shell"
args = ["mod-a"]

[[step]]
look = "dock"

[step.expect]
answers = [{ mod = "mod-c", pinned = true, running = true, attention = false, active = false }, { mod = "mod-b", pinned = false, running = true, attention = false, active = false }, { mod = "mod-a", pinned = false, running = true, attention = false, active = false }]
