case = 19
name = "the-item-of-the-mod-of-the-desktops-key-window-is-marked-active"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event <mod>:go tells it, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-a and mod-b each open main; the person presses on mod-b's main, so it is the desktop's key window."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-b"
member = "events.emit"
args = ["go", { open = { name = "main" } }]

[[step]]
input = "window"
mod = "mod-b"
name = "main"
action = "press"

[[step]]
look = "dock"

[step.expect]
answers = [{ mod = "mod-a", pinned = true, running = true, attention = false, active = false }, { mod = "mod-b", pinned = true, running = true, attention = false, active = true }]
