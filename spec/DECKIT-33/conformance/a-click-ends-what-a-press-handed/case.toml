case = 19
name = "a-click-ends-what-a-press-handed"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event <mod>:go tells it, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-a opens main in attach, and mod-b opens main once the host app started. The person presses on mod-a's main, then clicks mod-b's item: mod-b's main comes in front as the key window, and as the click is input reaching mod-b, mod-a may activate no more, so its makeKeyAndOrderFront holds main right behind, asking for attention. The Dock marks mod-a asking for attention and mod-b active."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-b"
member = "events.emit"
args = ["go", { open = { name = "main", activates = false } }]

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "dock"
mod = "mod-b"
action = "click"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "makeKeyAndOrderFront", name = "main" }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = false, minimized = false }, { mod = "mod-b", name = "main", level = "normal", frame = { x = 307, y = 131, width = 720, height = 480 }, key = true, minimized = false }]

[[step]]
look = "dock"

[step.expect]
answers = [{ mod = "mod-a", pinned = true, running = true, attention = true, active = false }, { mod = "mod-b", pinned = true, running = true, attention = false, active = true }]
