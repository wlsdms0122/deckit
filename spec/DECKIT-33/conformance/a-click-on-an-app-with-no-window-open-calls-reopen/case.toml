case = 19
name = "a-click-on-an-app-with-no-window-open-calls-reopen"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event <mod>:go tells it, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-b opens no window and has reopen(), which opens https://said.test/reopen/mod-b outside the app and opens the window again. The person clicks mod-b's item: reopen() is called, and again comes in front, key."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "dock"
mod = "mod-b"
action = "click"

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/reopen/mod-b", activates = true }, { url = "https://said.test/again/didAppear", activates = true }, { url = "https://said.test/again/didBecomeKey", activates = true }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-b", name = "again", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = true, minimized = false }]
