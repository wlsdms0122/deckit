case = 19
name = "mods-pinned-answers-the-apps-kept-in-the-docks-order"
note = "Each mod is a background mod, so each launches as the host app starts, in the order the host ships it. mod-c, marked system and granted deckit.mods, keeps the Dock through the handle shell. The person drags mod-c's item onto mod-a's place, and mods.pinned answers the apps kept in the Dock's new order."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b", "mod-c"]
system = ["mod-c"]

[[step]]
input = "start"

[[step]]
input = "dock"
mod = "mod-c"
action = "drag"
to = "mod-a"

[[step]]
input = "call"
mod = "mod-c"
member = "mods.pinned"
handle = "shell"

[step.expect]
answers = ["mod-c", "mod-a", "mod-b"]
