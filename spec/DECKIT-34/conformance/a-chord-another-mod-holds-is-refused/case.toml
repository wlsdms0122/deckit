case = 18
name = "a-chord-another-mod-holds-is-refused"
note = "Each mod's code opens the windows the case says in attach, and takes a chord, records or opens a window as the event <mod>:go tells it, opening https://said.test/take/<as>/held/<held> outside the app as a take answers, take/<as>/threw/<kind> as it is refused, chord/<as> as its chord is told, and rec/<code>/<modifiers> for each key it records, on the desktop of the base shell. mod-a takes ctrl+alt+k, then mod-b takes it: a chord is one holder's at a time, so mod-b's take is refused at call with kind REFUSED, and the press is told to mod-a alone."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { take = { code = "KeyL", control = true, alt = true }, as = "a" }]

[[step]]
input = "call"
mod = "mod-b"
member = "events.emit"
args = ["go", { take = { code = "KeyL", control = true, alt = true }, as = "b" }]

[[step]]
input = "key"
keystroke = { code = "KeyL", control = true, alt = true }

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/take/a/held/true", activates = true }, { url = "https://said.test/take/b/threw/REFUSED", activates = true }, { url = "https://said.test/chord/a", activates = true }]
