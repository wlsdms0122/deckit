case = 15
name = "keys-set-with-a-modifier-of-another-type-is-refused"
note = "Each mod's code opens the windows the case says in attach, and takes a chord, records or opens a window as the event <mod>:go tells it, opening https://said.test/take/<as>/held/<held> outside the app as a take answers, take/<as>/threw/<kind> as it is refused, chord/<as> as its chord is told, and rec/<code>/<modifiers> for each key it records, on the desktop of the base shell. mod-a sets closeWindow to { code = \"KeyJ\", meta = \"yes\" }: refused with kind INVALID_ARGUMENT."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "keys.set"
handle = "shell"
args = ["closeWindow", { code = "KeyJ", meta = "yes" }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
