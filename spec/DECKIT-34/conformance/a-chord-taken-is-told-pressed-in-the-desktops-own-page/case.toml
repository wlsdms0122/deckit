case = 18
name = "a-chord-taken-is-told-pressed-in-the-desktops-own-page"
note = "Each mod's code opens the windows the case says in attach, and takes a chord, records or opens a window as the event <mod>:go tells it, opening https://said.test/take/<as>/held/<held> outside the app as a take answers, take/<as>/threw/<kind> as it is refused, chord/<as> as its chord is told, and rec/<code>/<modifiers> for each key it records, on the desktop of the base shell. No mod opens a window, so the desktop's own page has the keyboard; mod-a takes ctrl+alt+k and the person presses it there: it is told to mod-a."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { take = { code = "KeyL", control = true, alt = true }, as = "a" }]

[[step]]
input = "key"
keystroke = { code = "KeyL", control = true, alt = true }

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/take/a/held/true", activates = true }, { url = "https://said.test/chord/a", activates = true }]
