case = 6
name = "a-take-of-a-keystroke-with-an-empty-code-is-refused"
note = "Each mod's code opens the windows the case says in attach, and takes a chord, records or opens a window as the event <mod>:go tells it, opening https://said.test/take/<as>/held/<held> outside the app as a take answers, take/<as>/threw/<kind> as it is refused, chord/<as> as its chord is told, and rec/<code>/<modifiers> for each key it records, on the desktop of the base shell. mod-a takes a keystroke whose code is the empty string: refused with kind INVALID_ARGUMENT."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { take = { code = "" }, as = "a" }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/take/a/threw/INVALID_ARGUMENT", activates = true }]
