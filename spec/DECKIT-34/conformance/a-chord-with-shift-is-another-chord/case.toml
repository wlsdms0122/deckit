case = 18
name = "a-chord-with-shift-is-another-chord"
note = "Each mod's code opens the windows the case says in attach, and takes a chord, records or opens a window as the event <mod>:go tells it, opening https://said.test/take/<as>/held/<held> outside the app as a take answers, take/<as>/threw/<kind> as it is refused, chord/<as> as its chord is told, and rec/<code>/<modifiers> for each key it records, on the desktop of the base shell. mod-a takes shift+k and mod-b takes k, each with no other modifier: a chord is a code and the modifiers held, so both are held, and shift+k pressed is told to mod-a alone."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { take = { code = "KeyK", shift = true }, as = "a" }]

[[step]]
input = "call"
mod = "mod-b"
member = "events.emit"
args = ["go", { take = { code = "KeyK" }, as = "b" }]

[[step]]
input = "key"
keystroke = { code = "KeyK", shift = true }

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/take/a/held/true", activates = true }, { url = "https://said.test/take/b/held/true", activates = true }, { url = "https://said.test/chord/a", activates = true }]
