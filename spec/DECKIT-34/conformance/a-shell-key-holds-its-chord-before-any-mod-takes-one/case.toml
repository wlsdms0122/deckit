case = 19
name = "a-shell-key-holds-its-chord-before-any-mod-takes-one"
note = "Each mod's code opens the windows the case says in attach, and takes a chord, records or opens a window as the event <mod>:go tells it, opening https://said.test/take/<as>/held/<held> outside the app as a take answers, take/<as>/threw/<kind> as it is refused, chord/<as> as its chord is told, and rec/<code>/<modifiers> for each key it records, on the desktop of the base shell. mod-b, a background mod, takes ctrl+alt+k in attach as it starts. The person quits mod-b from its item's menu, so the chord is let go; mod-a sets closeWindow to ctrl+alt+k, and the host app quits and starts again: mod-b's take is refused with kind REFUSED, the shell holding its keys before any mod starts."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "dock"
mod = "mod-b"
action = "quit"

[[step]]
input = "call"
mod = "mod-a"
member = "keys.set"
handle = "shell"
args = ["closeWindow", { code = "KeyL", control = true, alt = true }]

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/chord/threw/REFUSED", activates = true }]
