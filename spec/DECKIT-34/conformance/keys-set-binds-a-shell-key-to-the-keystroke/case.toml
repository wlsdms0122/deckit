case = 18
name = "keys-set-binds-a-shell-key-to-the-keystroke"
note = "Each mod's code opens the windows the case says in attach, and takes a chord, records or opens a window as the event <mod>:go tells it, opening https://said.test/take/<as>/held/<held> outside the app as a take answers, take/<as>/threw/<kind> as it is refused, chord/<as> as its chord is told, and rec/<code>/<modifiers> for each key it records, on the desktop of the base shell. mod-a sets closeWindow to cmd+j, answered the key bound to it; the person presses in main and presses cmd+w, which closes nothing, then cmd+j, which closes main."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "keys.set"
handle = "shell"
args = ["closeWindow", { code = "KeyJ", meta = true }]

[step.expect]
answers = { id = "closeWindow", name = "Close Window", defaultKeystroke = { code = "KeyW", meta = true, control = false, alt = false, shift = false }, keystroke = { code = "KeyJ", meta = true, control = false, alt = false, shift = false } }

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "key"
keystroke = { code = "KeyW", meta = true }

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "x", level = "normal", frame = { x = 307, y = 131, width = 720, height = 480 }, key = false, minimized = false }, { mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = true, minimized = false }]

[[step]]
input = "key"
keystroke = { code = "KeyJ", meta = true }

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "x", level = "normal", frame = { x = 307, y = 131, width = 720, height = 480 }, key = true, minimized = false }]
