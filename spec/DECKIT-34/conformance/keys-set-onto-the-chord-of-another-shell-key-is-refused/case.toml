case = 15
name = "keys-set-onto-the-chord-of-another-shell-key-is-refused"
note = "Each mod's code opens the windows the case says in attach, and takes a chord, records or opens a window as the event <mod>:go tells it, opening https://said.test/take/<as>/held/<held> outside the app as a take answers, take/<as>/threw/<kind> as it is refused, chord/<as> as its chord is told, and rec/<code>/<modifiers> for each key it records, on the desktop of the base shell. mod-a sets closeWindow to cmd+m, the chord of minimizeWindow: refused with kind REFUSED, and the keys stay as they were."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "keys.set"
handle = "shell"
args = ["closeWindow", { code = "KeyM", meta = true }]

[step.expect]
refuses = "call"
kind = "REFUSED"

[[step]]
input = "call"
mod = "mod-a"
member = "keys.list"
handle = "shell"
args = []

[step.expect]
answers = [{ id = "closeWindow", name = "Close Window", defaultKeystroke = { code = "KeyW", meta = true, control = false, alt = false, shift = false }, keystroke = { code = "KeyW", meta = true, control = false, alt = false, shift = false } }, { id = "minimizeWindow", name = "Minimize Window", defaultKeystroke = { code = "KeyM", meta = true, control = false, alt = false, shift = false }, keystroke = { code = "KeyM", meta = true, control = false, alt = false, shift = false } }, { id = "cycleWindows", name = "Cycle Through Windows", defaultKeystroke = { code = "Backquote", meta = true, control = false, alt = false, shift = false }, keystroke = { code = "Backquote", meta = true, control = false, alt = false, shift = false } }, { id = "tileLeft", name = "Tile Window to Left Half", defaultKeystroke = { code = "ArrowLeft", meta = false, control = true, alt = true, shift = false }, keystroke = { code = "ArrowLeft", meta = false, control = true, alt = true, shift = false } }, { id = "tileRight", name = "Tile Window to Right Half", defaultKeystroke = { code = "ArrowRight", meta = false, control = true, alt = true, shift = false }, keystroke = { code = "ArrowRight", meta = false, control = true, alt = true, shift = false } }, { id = "tileFill", name = "Tile Window to Fill", defaultKeystroke = { code = "ArrowUp", meta = false, control = true, alt = true, shift = false }, keystroke = { code = "ArrowUp", meta = false, control = true, alt = true, shift = false } }, { id = "tileTopLeft", name = "Tile Window to Top Left Quarter", defaultKeystroke = { code = "KeyU", meta = false, control = true, alt = true, shift = false }, keystroke = { code = "KeyU", meta = false, control = true, alt = true, shift = false } }, { id = "tileTopRight", name = "Tile Window to Top Right Quarter", defaultKeystroke = { code = "KeyI", meta = false, control = true, alt = true, shift = false }, keystroke = { code = "KeyI", meta = false, control = true, alt = true, shift = false } }, { id = "tileBottomLeft", name = "Tile Window to Bottom Left Quarter", defaultKeystroke = { code = "KeyJ", meta = false, control = true, alt = true, shift = false }, keystroke = { code = "KeyJ", meta = false, control = true, alt = true, shift = false } }, { id = "tileBottomRight", name = "Tile Window to Bottom Right Quarter", defaultKeystroke = { code = "KeyK", meta = false, control = true, alt = true, shift = false }, keystroke = { code = "KeyK", meta = false, control = true, alt = true, shift = false } }, { id = "restoreWindow", name = "Restore Window", defaultKeystroke = { code = "ArrowDown", meta = false, control = true, alt = true, shift = false }, keystroke = { code = "ArrowDown", meta = false, control = true, alt = true, shift = false } }]
