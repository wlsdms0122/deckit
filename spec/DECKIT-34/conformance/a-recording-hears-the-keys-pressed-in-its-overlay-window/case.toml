case = 18
name = "a-recording-hears-the-keys-pressed-in-its-overlay-window"
note = "Each mod's code opens the windows the case says in attach, and takes a chord, records or opens a window as the event <mod>:go tells it, opening https://said.test/take/<as>/held/<held> outside the app as a take answers, take/<as>/threw/<kind> as it is refused, chord/<as> as its chord is told, and rec/<code>/<modifiers> for each key it records, on the desktop of the base shell. mod-a, granted system.overlay-windows, opens the overlay window f and records; the person presses in f, which takes the keyboard, and presses cmd+j there: the recording is handed it."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "f"
action = "press"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { record = true }]

[[step]]
input = "key"
keystroke = { code = "KeyJ", meta = true }

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/rec/KeyJ/meta", activates = true }]
