case = 15
name = "keys-reset-binds-a-shell-key-to-its-default"
note = "Each mod's code opens the windows the case says in attach, and takes a chord, records or opens a window as the event <mod>:go tells it, opening https://said.test/take/<as>/held/<held> outside the app as a take answers, take/<as>/threw/<kind> as it is refused, chord/<as> as its chord is told, and rec/<code>/<modifiers> for each key it records, on the desktop of the base shell. mod-a sets closeWindow to cmd+j and resets it: answered the key bound to cmd+w, and listed so."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "keys.set"
handle = "shell"
args = ["closeWindow", { code = "KeyJ", meta = true }]

[[step]]
input = "call"
mod = "mod-a"
member = "keys.reset"
handle = "shell"
args = ["closeWindow"]

[step.expect]
answers = { id = "closeWindow", name = "Close Window", defaultKeystroke = { code = "KeyW", meta = true, control = false, alt = false, shift = false }, keystroke = { code = "KeyW", meta = true, control = false, alt = false, shift = false } }

[[step]]
input = "call"
mod = "mod-a"
member = "keys.list"
handle = "shell"
args = []

[step.expect]
answers = [{ id = "closeWindow", name = "Close Window", defaultKeystroke = { code = "KeyW", meta = true, control = false, alt = false, shift = false }, keystroke = { code = "KeyW", meta = true, control = false, alt = false, shift = false } }, { id = "minimizeWindow", name = "Minimize Window", defaultKeystroke = { code = "KeyM", meta = true, control = false, alt = false, shift = false }, keystroke = { code = "KeyM", meta = true, control = false, alt = false, shift = false } }, { id = "cycleWindows", name = "Cycle Through Windows", defaultKeystroke = { code = "Backquote", meta = true, control = false, alt = false, shift = false }, keystroke = { code = "Backquote", meta = true, control = false, alt = false, shift = false } }]
