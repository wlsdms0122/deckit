case = 20
name = "a-chord-in-global-is-told-pressed-in-another-app"
note = "Each mod's code opens the windows the case says in attach, and takes a chord, records or opens a window as the event <mod>:go tells it, opening https://said.test/take/<as>/held/<held> outside the app as a take answers, take/<as>/threw/<kind> as it is refused, chord/<as> as its chord is told, and rec/<code>/<modifiers> for each key it records, on the desktop of the base shell. mod-a, granted system.global-keys, takes ctrl+alt+k in the scope global, which the machine gives, so it is held; the person presses it in another app, then in the host app: each press is told."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { take = { code = "KeyK", control = true, alt = true }, as = "a", scope = "global" }]

[[step]]
input = "key"
keystroke = { code = "KeyK", control = true, alt = true }
outside = true

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/take/a/held/true", activates = true }, { url = "https://said.test/chord/a", activates = true }]

[[step]]
input = "key"
keystroke = { code = "KeyK", control = true, alt = true }

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/take/a/held/true", activates = true }, { url = "https://said.test/chord/a", activates = true }, { url = "https://said.test/chord/a", activates = true }]
