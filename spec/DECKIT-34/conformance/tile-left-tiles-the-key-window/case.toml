case = 18
name = "tile-left-tiles-the-key-window"
note = "Each mod's code opens the windows the case says in attach, and takes a chord, records or opens a window as the event <mod>:go tells it, opening https://said.test/take/<as>/held/<held> outside the app as a take answers, take/<as>/threw/<kind> as it is refused, chord/<as> as its chord is told, and rec/<code>/<modifiers> for each key it records, on the desktop of the base shell. mod-a opens main and x; the person presses in main and presses ctrl+alt+ArrowLeft: main takes the tile left, the zoom area's left half, and x stays where it is."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "key"
keystroke = { code = "ArrowLeft", control = true, alt = true }

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "x", level = "normal", frame = { x = 304, y = 133, width = 720, height = 480 }, key = false, minimized = false }, { mod = "mod-a", name = "main", level = "normal", frame = { x = 8, y = 8, width = 632, height = 784 }, key = true, minimized = false }]
