case = 7
name = "shown-answers-the-notifications-handed-since-the-app-last-started"
note = "The look shown answers each notification of the machine the system handed the host to show since the host app last started, in the order handed, each with its title, body and silent. mod-a shows Standup, then Lunch, and after the app starts again shown answers none."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "notifications.show"
args = [{ title = "Standup", body = "in 5 min" }]

[[step]]
input = "call"
mod = "mod-a"
member = "notifications.show"
args = [{ title = "Lunch", body = "at noon", silent = true }]

[[step]]
look = "shown"

[step.expect]
answers = [{ title = "Standup", body = "in 5 min", silent = false }, { title = "Lunch", body = "at noon", silent = true }]

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
look = "shown"

[step.expect]
answers = []
