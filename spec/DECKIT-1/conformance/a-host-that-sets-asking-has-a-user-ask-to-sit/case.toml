case = 26
name = "a-host-that-sets-asking-has-a-user-ask-to-sit"
note = "The host sets the setting asking before the first start. The base system takes no ask, so ada is told attach/asking and its authenticate is refused, and the host closes its transport connection."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { asking = true }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[step.expect]
refuses = "call"
kind = "REFUSED"

[[step]]
look = "told"
party = "p"

[step.expect]
answers = { messages = [{ method = "attach/asking", request = false }], closed = true }
