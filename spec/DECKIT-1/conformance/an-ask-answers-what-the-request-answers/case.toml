case = 25
name = "an-ask-answers-what-the-request-answers"
note = "An ask answers what the request the party asks is answered. A party writes a record of ada under the key note, then asks record/read of that key, and the step answers the value."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "record/write"
params = { key = "note", value = { text = "kept" } }

[[step]]
input = "ask"
party = "p"
method = "record/read"
params = { key = "note" }

[step.expect]
answers = { text = "kept" }
