case = 25
name = "told-answers-of-a-party-after-the-app-started-again"
note = "A look told answers of a party of the case while the host app is started, one that attached before a quit among them. A party attaches, the host app quits and starts again, and told answers that its transport connection has closed."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
look = "told"
party = "p"

[step.expect]
answers = { messages = [], closed = true }
