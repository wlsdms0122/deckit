case = 25
name = "an-ask-that-is-refused-comes-to-its-refusal"
note = "The refusal of the request a party asks is what the ask comes to, at its stage with its kind. On the base system nothing answers what a seat reads, so seat/read is refused at call."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "desktop" }

[step.expect]
refuses = "call"
kind = "REFUSED"
