case = 25
name = "an-ask-reads-a-part-of-what-the-request-answers"
note = "An ask that writes part answers the value under that key of what the request answers. A party writes a record under the key note, and the step reads text of what record/read answers."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "record/write"
params = { key = "note", value = { text = "kept" } }

[[step]]
input = "ask"
party = "p"
method = "record/read"
params = { key = "note" }
part = "text"

[step.expect]
answers = "kept"
