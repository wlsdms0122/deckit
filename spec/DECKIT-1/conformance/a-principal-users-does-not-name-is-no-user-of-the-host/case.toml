case = 25
name = "a-principal-users-does-not-name-is-no-user-of-the-host"
note = "The host makes the users that users names and no other. It registers the pair first for ada and makes no user; a party that attaches as ada with that pair is refused at call, as a key the host did not register is."

[host]
base = "system"
api = "1.0.0"
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[step.expect]
refuses = "call"
kind = "NOT_AUTHENTICATED"
