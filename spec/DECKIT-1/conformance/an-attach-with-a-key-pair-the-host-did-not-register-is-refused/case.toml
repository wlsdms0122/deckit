case = 25
name = "an-attach-with-a-key-pair-the-host-did-not-register-is-refused"
note = "A key pair no key of host names is one the host has not registered, and the refusal of authenticate is what the attach comes to. The host registers the pair first for ada; a party attaches as ada with the pair second, and is refused at call."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "second"

[step.expect]
refuses = "call"
kind = "NOT_AUTHENTICATED"
