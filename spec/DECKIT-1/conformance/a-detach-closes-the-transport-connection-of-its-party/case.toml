case = 25
name = "a-detach-closes-the-transport-connection-of-its-party"
note = "A detach closes the transport connection of the party it names. A party attaches and detaches, and told answers that its transport connection has closed."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "detach"
party = "p"

[[step]]
look = "told"
party = "p"

[step.expect]
answers = { messages = [], closed = true }
