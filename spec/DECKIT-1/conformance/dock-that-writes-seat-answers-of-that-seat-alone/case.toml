case = 26
name = "dock-that-writes-seat-answers-of-that-seat-alone"
note = "mod-a, in attach, opens the window main on the desktop of the base shell. The host keeps mod-a in the Dock. The person presses main, so its item is marked active for the local seat. ada attaches and sits at s1: the look dock with seat s1 answers the item not active, and with no seat it answers it active."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
dock = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
look = "dock"
seat = "s1"

[step.expect]
answers = [{ mod = "mod-a", pinned = true, running = true, attention = false, active = false }]

[[step]]
look = "dock"

[step.expect]
answers = [{ mod = "mod-a", pinned = true, running = true, attention = false, active = true }]
