case = 26
name = "a-setting-the-host-does-not-write-stands-as-none-kept"
note = "The host sets the idle time alone, so asking stands as where none is kept, false: ada sits at once and is told nothing."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { idleTime = 0 }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
part = "seat"

[step.expect]
answers = { id = "s1", local = false, user = { id = "ada", name = "Ada Lovelace" } }

[[step]]
look = "told"
party = "p"

[step.expect]
answers = { messages = [], closed = false }
