case = 25
name = "an-attach-answers-what-authenticate-answers"
note = "An attach answers what authenticate answers the party. The host makes the user ada and registers the key pair first for it; a party attaches as ada with that pair, and the step answers the whole result: the principal, its first run, what its job holds, the time an end is given, and the seat with the name users gives ada."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[step.expect]
answers = { principal = "ada", run = 1, permissions = ["deckit.seat"], end = 5, seat = { id = "s1", local = false, user = { id = "ada", name = "Ada Lovelace" } } }
