case = 25
name = "the-users-and-the-keys-of-the-host-stand-as-the-app-starts-again"
note = "The host makes its users and registers its keys once, before the host app first starts, and the system keeps them. The host app starts, quits and starts again, and a party then attaches as ada with the pair first."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
part = "principal"

[step.expect]
answers = "ada"
