case = 25
name = "an-attach-reads-a-part-of-what-authenticate-answers"
note = "An attach that writes part answers the value under that key of what authenticate answers. A party attaches as ada, and the step reads permissions."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
part = "permissions"

[step.expect]
answers = ["deckit.seat"]
