case = 26
name = "an-attach-that-waits-ends-as-authenticate-is-answered-where-nothing-is-asked"
note = "The host sets no asking, so the party is told nothing and authenticate is answered at once. An attach that writes waits ends then and answers nothing; the look admitted comes to what authenticate answered, read whole or by a part, each time it is looked at."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
waits = true

[[step]]
look = "admitted"
party = "p"
part = "seat"

[step.expect]
answers = { id = "s1", local = false, user = { id = "ada", name = "Ada Lovelace" } }

[[step]]
look = "admitted"
party = "p"
part = "principal"

[step.expect]
answers = "ada"

[[step]]
look = "told"
party = "p"
part = "messages"

[step.expect]
answers = []
