case = 26
name = "the-settings-of-the-host-stand-as-the-app-starts-again"
note = "The host sets asking before the first start and at no later one. The host app quits and starts again, and ada, attaching then, is still told attach/asking before it is refused."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { asking = true }

[[step]]
input = "start"

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[step.expect]
refuses = "call"
kind = "REFUSED"

[[step]]
look = "told"
party = "p"
part = "messages"

[step.expect]
answers = [{ method = "attach/asking", request = false }]
