case = 3
name = "a-bundle-a-step-hands-as-a-folder-is-not-found-by-the-system"
note = "A bundle that a step's folders names and no key of host names is laid out on its own, and the host hands the system nothing of it. mod-a plans the install of mod-b by its path, and the system lists mod-a alone."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.plan"
folders = ["mod-b"]
part = "id"

[step.expect]
answers = "mod-b"

[[step]]
look = "mods"

[step.expect]
answers = ["mod-a"]
