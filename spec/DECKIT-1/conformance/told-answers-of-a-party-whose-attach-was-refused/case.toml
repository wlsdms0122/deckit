case = 25
name = "told-answers-of-a-party-whose-attach-was-refused"
note = "An attach makes its party whatever it is answered. A party attaches with a key pair the host did not register and is refused, and told answers of it: no message, and its transport connection closed, by the host."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "second"

[step.expect]
refuses = "call"
kind = "NOT_AUTHENTICATED"

[[step]]
look = "told"
party = "p"

[step.expect]
answers = { messages = [], closed = true }
