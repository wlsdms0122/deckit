case = 3
name = "a-shipped-owner-refused-at-read-leaves-the-interface-to-another-provider"
note = "Nothing holds the place of a standard interface's owner for the bundle a host ships: mod-o, shipped marked system, provides deckit/urls and is refused at read, its main missing, and mod-p, read in place, which provides it too, owns it. mod-a reads the owner of each interface."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-o"]
system = ["mod-a", "mod-o"]
sources = ["mod-p"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-o"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.interfaces"
part = "owner"

[step.expect]
answers = ["mod-p"]
