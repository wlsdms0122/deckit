case = 15
name = "fonts-set-of-a-size-above-the-bounds-is-refused"
note = "fonts.set is refused INVALID_ARGUMENT where size is no size of the fonts, from 11 to 22: mod-a sets { size = 23 }, past 22."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "fonts.set"
handle = "shell"
args = [{ size = 23 }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
