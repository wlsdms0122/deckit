case = 15
name = "fonts-set-of-an-empty-text-is-refused"
note = "The text of the fonts holds 1 to 256 scalar values: mod-a sets { text = \"\" }, refused INVALID_ARGUMENT."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "fonts.set"
handle = "shell"
args = [{ text = "" }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
