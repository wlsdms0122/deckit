case = 21
name = "a-style-declared-for-a-mod-is-worn-by-that-mods-page"
note = "A style of a mod's id is worn by the pages the shell draws in for that mod's run: mod-a, granted deckit.styles, declares in its manifest's field styles the file a.css, which sets --case-a and --case-order to a, for mod-b, and mod-b's page holds both."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
look = "worn"
mod = "mod-b"
properties = ["--case-a", "--case-b", "--case-order"]

[step.expect]
answers = { dark = true, properties = { --case-a = "a", --case-order = "a" } }
