case = 21
name = "a-mods-style-for-a-page-is-worn-over-its-style-for-every-page"
note = "Of one mod's declared styles, the one of \"*\" goes before the one of the page's mod: mod-a declares b.css for mod-b and a.css for \"*\", and mod-b's page holds --case-order b."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
look = "worn"
mod = "mod-b"
properties = ["--case-a", "--case-b", "--case-order"]

[step.expect]
answers = { dark = true, properties = { --case-a = "a", --case-b = "b", --case-order = "b" } }
