case = 15
name = "theme-text-size-is-the-size-set"
note = "theme.textSize is the size of the person's fonts, where they chose one, on every mod's handle: mod-a sets { size = 16 }, and mod-b's theme.textSize answers 16."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "fonts.set"
handle = "shell"
args = [{ size = 16 }]

[[step]]
input = "call"
mod = "mod-b"
member = "theme.textSize"
handle = "shell"

[step.expect]
answers = 16
