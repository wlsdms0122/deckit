case = 21
name = "a-mods-registered-style-is-worn-over-its-declared-one"
note = "Of one mod, its declared styles go before its registered ones: mod-a declares a.css for \"*\", setting --case-order to a, and registers one setting it to b, and mod-b's page holds b."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
look = "worn"
mod = "mod-b"
properties = ["--case-a", "--case-b", "--case-order"]

[step.expect]
answers = { dark = true, properties = { --case-a = "a", --case-b = "b", --case-order = "b" } }
