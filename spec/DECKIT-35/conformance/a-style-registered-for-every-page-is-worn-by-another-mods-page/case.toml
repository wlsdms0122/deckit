case = 21
name = "a-style-registered-for-every-page-is-worn-by-another-mods-page"
note = "A registered style is worn while the mod's run runs: mod-a, granted deckit.styles, registers in attach a style for \"*\" that sets --case-b and --case-order to b, and mod-b's page holds both."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
look = "worn"
mod = "mod-b"
properties = ["--case-a", "--case-b", "--case-order"]

[step.expect]
answers = { dark = true, properties = { --case-b = "b", --case-order = "b" } }
