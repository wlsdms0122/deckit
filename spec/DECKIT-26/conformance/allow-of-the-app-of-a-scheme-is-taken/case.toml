case = 8
name = "allow-of-the-app-of-a-scheme-is-taken"
note = "open:<scheme> of a scheme off the never list is a site-permission. mod-a lets https://example.com have the app for mailto."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "call"
mod = "mod-a"
member = "allow"
of = 2
args = [[{ origin = "https://example.com", permission = "open:mailto" }]]
