case = 11
name = "a-frame-of-a-site-of-a-mod-not-granted-system-clipboard-write-copies-nothing-by-execcommand"
note = "execCommand(copy) answers false and changes nothing in a frame of a site that does not have clipboard-write. site-a, shown by mod-a granted system.clipboard-read and not system.clipboard-write, selects from site-a in a frame it made and copies it there as it is pressed, and mod-a reads the clipboard."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]

[[step]]
input = "start"

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 2

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 2
part = "title"

[step.expect]
answers = "false"

[[step]]
input = "call"
mod = "mod-a"
member = "clipboard.readText"

[step.expect]
answers = ""
