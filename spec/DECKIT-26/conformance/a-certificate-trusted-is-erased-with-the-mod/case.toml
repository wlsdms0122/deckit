case = 8
name = "a-certificate-trusted-is-erased-with-the-mod"
note = "No certificate a mod trusted is trusted once remove with erase true erases it. mod-a installs mod-b, which trusts a certificate for 127.0.0.1 in its session main; mod-a removes it with erase true and installs it again, and reads that the web engine keeps nothing of mod-b."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.install"
folders = ["mod-b"]
part = "id"

[step.expect]
answers = "mod-b"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-b"]

[[step]]
input = "call"
mod = "mod-b"
member = "session"
args = ["main"]
handle = "web"

[[step]]
input = "call"
mod = "mod-b"
member = "trust"
of = 4
args = [[{ host = "127.0.0.1", fingerprint = "sha256/47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=" }]]

[[step]]
input = "call"
mod = "mod-a"
member = "mods.remove"
args = ["mod-b", true]

[step.expect]
answers = { erased = true }

[[step]]
input = "call"
mod = "mod-a"
member = "mods.install"
folders = ["mod-b"]
part = "id"

[step.expect]
answers = "mod-b"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.usage"
args = ["mod-b"]
part = "kept"

[step.expect]
answers = []
