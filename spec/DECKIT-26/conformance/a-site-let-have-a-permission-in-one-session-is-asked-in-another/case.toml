case = 12
name = "a-site-let-have-a-permission-in-one-session-is-asked-in-another"
note = "What allow lets a site have is the session's: in another session of the mod the site is asked. mod-a lets site-a have notifications in its session main, and shows site-a in its session other."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { decidePermission = false }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "call"
mod = "mod-a"
member = "allow"
of = 2
origins = ["site-a"]
args = [[{ origin = "site-a", permission = "notifications" }]]

[[step]]
input = "show"
mod = "mod-a"
session = "other"
site = "site-a/index.html"

[[step]]
look = "delegated"
mod = "mod-a"

[step.expect]
answers = [{ method = "decidePermission", args = [{ origin = "site-a", permissions = ["notifications"], app = "", url = "" }] }]
