case = 8
name = "trust-without-system-certificates-is-refused"
note = "trust is a request system.certificates guards, refused before its entries are read. mod-a, granted nothing, trusts what is no array."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "call"
mod = "mod-a"
member = "trust"
of = 2
args = [5]

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"
