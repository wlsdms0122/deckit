case = 10
name = "a-yes-the-mod-answers-is-not-kept"
note = "A yes the mod answers lets the site have what it asked for that once: the site is asked again as it asks again. site-a asks for notifications as its page loads, which the host's delegate allows, and the page is loaded again."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { decidePermission = true }

[[step]]
input = "start"

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 2
part = "title"

[step.expect]
answers = "default granted"

[[step]]
input = "call"
mod = "mod-a"
member = "reload"
of = 2

[[step]]
look = "delegated"
mod = "mod-a"

[step.expect]
answers = [{ method = "decidePermission", args = [{ origin = "site-a", permissions = ["notifications"], app = "", url = "" }] }, { method = "decidePermission", args = [{ origin = "site-a", permissions = ["notifications"], app = "", url = "" }] }]
