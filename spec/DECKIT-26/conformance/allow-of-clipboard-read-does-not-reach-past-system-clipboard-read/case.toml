case = 12
name = "allow-of-clipboard-read-does-not-reach-past-system-clipboard-read"
note = "What allow lets a site have of what the system guards it has only while the mod is granted that permission. mod-a, granted system.site-permissions alone, lets site-a have clipboard-read in its session main, and site-a reads the clipboard."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { decidePermission = true }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "call"
mod = "mod-a"
member = "allow"
of = 2
origins = ["site-a"]
args = [[{ origin = "site-a", permission = "clipboard-read" }]]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "title"

[step.expect]
answers = "NotAllowedError"
