case = 12
name = "a-popup-at-an-app-of-a-frame-of-an-opaque-origin-is-refused-unasked"
note = "A document whose origin is opaque is no site, and the app it opens is refused unasked. site-a shows a frame sandboxed without allow-same-origin, whose window.open of mailto:a@example.com follows a press."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { decidePermission = true, openWindow = true }
apps = { mailto = "Mail" }

[[step]]
input = "start"

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 2

[[step]]
look = "delegated"
mod = "mod-a"

[step.expect]
answers = []

[[step]]
look = "opened"

[step.expect]
answers = []
