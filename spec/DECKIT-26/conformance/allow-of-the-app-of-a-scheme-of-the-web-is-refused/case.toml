case = 8
name = "allow-of-the-app-of-a-scheme-of-the-web-is-refused"
note = "Each entry is { origin, permission }: origin an origin of the web as the URL Standard serializes it, permission a site-permission. mod-a hands allow open:https, of a scheme on the never list."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "call"
mod = "mod-a"
member = "allow"
of = 2
args = [[{ origin = "https://example.com", permission = "open:https" }]]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
