case = 12
name = "a-link-to-an-app-of-a-mod-not-granted-system-site-permissions-opens-nothing"
note = "The app for a link is asked only of a mod granted system.site-permissions. mod-a, granted nothing, shows site-a, whose link to mailto:a@example.com is pressed."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { decidePermission = true }
apps = { mailto = "Mail" }

[[step]]
input = "start"

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 2

[[step]]
look = "delegated"
mod = "mod-a"

[step.expect]
answers = []

[[step]]
look = "opened"

[step.expect]
answers = []
