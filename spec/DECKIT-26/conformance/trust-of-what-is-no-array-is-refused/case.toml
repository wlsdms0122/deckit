case = 8
name = "trust-of-what-is-no-array-is-refused"
note = "entries is an array. mod-a hands trust a table."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "call"
mod = "mod-a"
member = "trust"
of = 2
args = [{ host = "127.0.0.1", fingerprint = "sha256/47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=" }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
