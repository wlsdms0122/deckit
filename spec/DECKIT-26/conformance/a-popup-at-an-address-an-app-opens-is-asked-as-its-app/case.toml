case = 12
name = "a-popup-at-an-address-an-app-opens-is-asked-as-its-app"
note = "A popup at an address of a scheme an app opens is asked as that app, and opens no page. site-a's window.open of mailto:a@example.com follows a press."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { decidePermission = true, openWindow = true }
apps = { mailto = "Mail" }

[[step]]
input = "start"

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 2

[[step]]
look = "delegated"
mod = "mod-a"

[step.expect]
answers = [{ method = "decidePermission", args = [{ origin = "site-a", permissions = ["open:mailto"], app = "Mail", url = "mailto:a@example.com" }] }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "mailto:a@example.com", activates = true }]
