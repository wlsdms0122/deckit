case = 11
name = "a-site-of-a-mod-not-granted-system-clipboard-write-cuts-nothing-by-execcommand"
note = "execCommand(cut) answers false and changes neither the clipboard nor the page where the site does not have clipboard-write. site-a, shown by mod-a granted system.clipboard-read and not system.clipboard-write, cuts the text of its field as it is pressed, and mod-a reads the clipboard."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]

[[step]]
input = "start"

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 2

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 2
part = "title"

[step.expect]
answers = "false from site-a"

[[step]]
input = "call"
mod = "mod-a"
member = "clipboard.readText"

[step.expect]
answers = ""
