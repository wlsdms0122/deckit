case = 8
name = "allow-of-an-origin-not-in-lower-case-is-refused"
note = "Each entry is { origin, permission }: origin an origin of the web as the URL Standard serializes it, permission a site-permission. mod-a hands allow the origin HTTPS://EXAMPLE.COM, which the URL Standard serializes in lower case."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "call"
mod = "mod-a"
member = "allow"
of = 2
args = [[{ origin = "HTTPS://EXAMPLE.COM", permission = "notifications" }]]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
