case = 10
name = "a-frame-of-a-site-of-a-mod-not-granted-system-clipboard-write-does-not-write-the-clipboard"
note = "What a site is let have, and refused, holds alike in every frame of the page. site-a, shown by mod-a granted system.clipboard-read and not system.clipboard-write, makes a frame and writes from site-a through the frame's clipboard, and mod-a reads the clipboard."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]

[[step]]
input = "start"

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 2
part = "title"

[step.expect]
answers = "NotAllowedError"

[[step]]
input = "call"
mod = "mod-a"
member = "clipboard.readText"

[step.expect]
answers = ""
