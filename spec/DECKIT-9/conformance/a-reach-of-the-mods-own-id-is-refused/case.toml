case = 3
name = "a-reach-of-the-mods-own-id-is-refused"
note = "A mod reaches no one by its own id. mod-a reaches mod-a, which is refused at call with REFUSED."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.reach"
args = ["mod-a"]

[step.expect]
refuses = "call"
kind = "REFUSED"
