case = 3
name = "a-mod-reached-twice-and-let-go-once-is-still-reached"
note = "Each reach is let go by a release of its own. mod-a reaches mod-b twice and lets it go once, so mod-b, quit, launches again."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.reach"
args = ["mod-b"]

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.reach"
args = ["mod-b"]

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.release"
args = ["mod-b"]

[[step]]
input = "call"
mod = "mod-a"
member = "mods.quit"
args = ["mod-b"]

[[step]]
look = "run"
mod = "mod-b"

[step.expect]
answers = "running"
