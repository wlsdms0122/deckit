case = 3
name = "a-reach-of-a-bundle-the-system-did-not-take-is-refused-at-read"
note = "A reach of a mod whose bundle the system did not take is refused at read with NOT_LOADABLE. The manifest of mod-b writes no version."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.reach"
args = ["mod-b"]

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
