case = 3
name = "a-reach-the-service-refuses-is-refused-with-its-kind"
note = "A connection the service's connect refuses by throwing is refused at call with the kind its error carries. mod-b throws an error of kind BUSY."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.reach"
args = ["mod-b"]

[step.expect]
refuses = "call"
kind = "BUSY"
