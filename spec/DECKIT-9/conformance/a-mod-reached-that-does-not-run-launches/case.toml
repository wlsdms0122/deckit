case = 3
name = "a-mod-reached-that-does-not-run-launches"
note = "A reach of a mod that does not run launches it. mod-b is not a background mod, so it runs only once mod-a reaches it."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "run"
mod = "mod-b"

[step.expect]
answers = "notRunning"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.reach"
args = ["mod-b"]

[[step]]
look = "run"
mod = "mod-b"

[step.expect]
answers = "running"
