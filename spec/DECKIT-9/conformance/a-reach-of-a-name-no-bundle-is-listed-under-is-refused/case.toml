case = 3
name = "a-reach-of-a-name-no-bundle-is-listed-under-is-refused"
note = "A reach of an id no bundle is listed under is refused at call with NOT_INSTALLED, as launch is."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.reach"
args = ["mod-c"]

[step.expect]
refuses = "call"
kind = "NOT_INSTALLED"
