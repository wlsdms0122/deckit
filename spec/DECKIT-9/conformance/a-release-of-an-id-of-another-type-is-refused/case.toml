case = 3
name = "a-release-of-an-id-of-another-type-is-refused"
note = "release takes the id as a string. mod-a hands the number 1, which is refused at call with INVALID_ARGUMENT."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.release"
args = [1]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
