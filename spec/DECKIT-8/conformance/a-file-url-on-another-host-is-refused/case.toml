case = 3
name = "a-file-url-on-another-host-is-refused"
note = "openExternal is refused at call with UNSUPPORTED_URL where the URL is a file URL whose host is not empty, and the host is handed nothing. mod-a, granted system.file-handlers, opens file://elsewhere/data/report.pdf."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "openExternal"
args = ["file://elsewhere/data/report.pdf"]

[step.expect]
refuses = "call"
kind = "UNSUPPORTED_URL"

[[step]]
look = "opened"

[step.expect]
answers = []
