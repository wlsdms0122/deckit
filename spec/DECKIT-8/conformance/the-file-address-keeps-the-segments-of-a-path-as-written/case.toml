case = 3
name = "the-file-address-keeps-the-segments-of-a-path-as-written"
note = "fileURL encodes each segment of the path as written, a . or .. segment among them, and resolves none. mod-a asks for /a/../b."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "fileURL"
args = ["/a/../b"]

[step.expect]
answers = "file:///a/../b"
