case = 3
name = "a-file-address-of-a-path-of-another-type-is-refused"
note = "fileURL is not a request: it throws its refusal, at call with kind INVALID_ARGUMENT, where path is not a string. mod-a asks for the path 5."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "fileURL"
args = [5]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
