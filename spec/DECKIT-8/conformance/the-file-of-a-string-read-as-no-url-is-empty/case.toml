case = 3
name = "the-file-of-a-string-read-as-no-url-is-empty"
note = "filePath answers the empty string where url is not read as a URL, with no base URL: a path is no URL. mod-a asks for /data/report.pdf."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "filePath"
args = ["/data/report.pdf"]

[step.expect]
answers = ""
