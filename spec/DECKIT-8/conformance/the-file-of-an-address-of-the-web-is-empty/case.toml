case = 3
name = "the-file-of-an-address-of-the-web-is-empty"
note = "filePath answers the empty string for a URL whose scheme is not file. mod-a asks for https://example.com/report.pdf."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "filePath"
args = ["https://example.com/report.pdf"]

[step.expect]
answers = ""
