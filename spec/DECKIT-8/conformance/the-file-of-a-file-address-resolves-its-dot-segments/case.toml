case = 3
name = "the-file-of-a-file-address-resolves-its-dot-segments"
note = "filePath reads the URL by the URL Standard, which resolves its . and .. segments, so the file of the address fileURL answers for /a/../b is /b. mod-a asks for file:///a/../b."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "filePath"
args = ["file:///a/../b"]

[step.expect]
answers = "/b"
