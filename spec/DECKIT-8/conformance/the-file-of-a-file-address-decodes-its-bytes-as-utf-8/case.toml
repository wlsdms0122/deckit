case = 3
name = "the-file-of-a-file-address-decodes-its-bytes-as-utf-8"
note = "filePath decodes the bytes a file URL's path percent-encodes as UTF-8. mod-a asks for file:///data/%E6%97%A5%E8%A8%98.txt."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "filePath"
args = ["file:///data/%E6%97%A5%E8%A8%98.txt"]

[step.expect]
answers = "/data/日記.txt"
