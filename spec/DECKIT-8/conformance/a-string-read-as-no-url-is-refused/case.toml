case = 3
name = "a-string-read-as-no-url-is-refused"
note = "openExternal is refused at call with UNSUPPORTED_URL where the URL Standard reads url as no URL. mod-a opens example.com/a, which has no scheme and is read with no base URL."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "openExternal"
args = ["example.com/a"]

[step.expect]
refuses = "call"
kind = "UNSUPPORTED_URL"
