case = 3
name = "the-file-of-a-file-address-whose-path-does-not-decode-is-empty"
note = "filePath answers the empty string where the path does not decode: a % that two hexadecimal digits do not follow. mod-a asks for file:///data/report%zz.pdf."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "filePath"
args = ["file:///data/report%zz.pdf"]

[step.expect]
answers = ""
