case = 3
name = "the-file-of-a-file-address-on-another-host-is-empty"
note = "filePath answers the empty string for a file URL whose host is not empty. mod-a asks for file://elsewhere/data/report.pdf."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "filePath"
args = ["file://elsewhere/data/report.pdf"]

[step.expect]
answers = ""
