case = 3
name = "an-unsupported-url-is-refused-after-its-arguments"
note = "A request is refused for its arguments before it is refused with UNSUPPORTED_URL. mod-a opens a mailto URL with activates a string, and is refused at call with INVALID_ARGUMENT, not UNSUPPORTED_URL."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "openExternal"
args = ["mailto:a@example.com", { activates = "no" }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
