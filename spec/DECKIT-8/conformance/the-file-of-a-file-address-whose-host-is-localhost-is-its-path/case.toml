case = 3
name = "the-file-of-a-file-address-whose-host-is-localhost-is-its-path"
note = "A file URL whose host is localhost has an empty host, as the URL Standard reads it, so filePath answers its path. mod-a asks for file://localhost/data/report.pdf."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "filePath"
args = ["file://localhost/data/report.pdf"]

[step.expect]
answers = "/data/report.pdf"
