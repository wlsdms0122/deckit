case = 3
name = "a-file-address-of-no-path-is-refused"
note = "fileURL throws its refusal, at call with kind INVALID_ARGUMENT, where path is left out."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "fileURL"

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
