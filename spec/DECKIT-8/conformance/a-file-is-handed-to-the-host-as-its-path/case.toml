case = 3
name = "a-file-is-handed-to-the-host-as-its-path"
note = "A file is handed to the host as the path its URL's path percent-decodes to, with nothing of its query or fragment, and opened answers it as the file URL of that path. mod-a opens file:///data/a%7Eb%20c.pdf?page=2#top: the path is /data/a~b c.pdf, whose file URL keeps the ~ and encodes the space."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "openExternal"
args = ["file:///data/a%7Eb%20c.pdf?page=2#top"]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "file:///data/a~b%20c.pdf", activates = true }]
