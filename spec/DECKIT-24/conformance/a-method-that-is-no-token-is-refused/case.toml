case = 9
name = "a-method-that-is-no-token-is-refused"
note = "fetch is refused at call with kind INVALID_ARGUMENT where init does not fit what it takes. mod-a fetches hello.txt of site-a with the method \"GET X\", which holds a space."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
args = ["main"]
handle = "web"

[[step]]
input = "call"
mod = "mod-a"
member = "fetch"
of = 2
sites = ["site-a/hello.txt"]
args = [{ method = "GET X" }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
