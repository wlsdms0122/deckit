case = 9
name = "a-redirect-is-the-answer-where-redirect-is-manual"
note = "With redirect manual, a redirect is not followed and is the answer, with redirected false. site-a answers moved 302 to hello.txt."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
args = ["main"]
handle = "web"

[[step]]
input = "call"
mod = "mod-a"
member = "fetch"
of = 2
sites = ["site-a/moved"]
args = [{ redirect = "manual" }]

[step.expect]
answers = { url = "site-a/moved", status = 302, headers = [["connection", "close"], ["content-length", "0"], ["location", "/hello.txt"]], body = "", redirected = false }
