case = 9
name = "a-get-is-sent-where-the-method-is-left-out"
note = "method is GET where it is left out. mod-a fetches hello.txt of site-a with no init."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
args = ["main"]
handle = "web"

[[step]]
input = "call"
mod = "mod-a"
member = "fetch"
of = 2
sites = ["site-a/hello.txt"]

[[step]]
look = "requested"

[step.expect]
answers = [{ site = "site-a", method = "GET", path = "/hello.txt", headers = [] }]
