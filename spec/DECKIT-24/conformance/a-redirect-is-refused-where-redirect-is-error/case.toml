case = 9
name = "a-redirect-is-refused-where-redirect-is-error"
note = "With redirect error, a request that is redirected is refused at call with kind REFUSED. site-a answers moved 302."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
args = ["main"]
handle = "web"

[[step]]
input = "call"
mod = "mod-a"
member = "fetch"
of = 2
sites = ["site-a/moved"]
args = [{ redirect = "error" }]

[step.expect]
refuses = "call"
kind = "REFUSED"
