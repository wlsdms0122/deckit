case = 9
name = "fetching-a-relative-address-is-refused"
note = "fetch is refused at call with kind INVALID_ARGUMENT where url is no URL whose scheme is http or https. mod-a fetches a relative address, which is no URL."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
args = ["main"]
handle = "web"

[[step]]
input = "call"
mod = "mod-a"
member = "fetch"
of = 2
args = ["/hello.txt"]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
