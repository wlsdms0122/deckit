case = 9
name = "a-header-handed-twice-is-sent-once-with-its-values-joined"
note = "A header name handed more than once, in any case, is sent once, its values joined by \",\" in the order handed. mod-a fetches site-a with X-A: 1 and x-a: 2."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
args = ["main"]
handle = "web"

[[step]]
input = "call"
mod = "mod-a"
member = "fetch"
of = 2
sites = ["site-a/hello.txt"]
args = [{ headers = [["X-A", "1"], ["x-a", "2"]] }]

[[step]]
look = "requested"
headers = ["x-a"]

[step.expect]
answers = [{ site = "site-a", method = "GET", path = "/hello.txt", headers = [["x-a", "1,2"]] }]
