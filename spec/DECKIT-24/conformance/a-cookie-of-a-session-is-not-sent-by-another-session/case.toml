case = 9
name = "a-cookie-of-a-session-is-not-sent-by-another-session"
note = "A fetch sends its own session's cookies and no other's. site-a sets signed=in as mod-a fetches sign-in through its session main, and mod-a then fetches hello.txt through its session other."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
args = ["main"]
handle = "web"

[[step]]
input = "call"
mod = "mod-a"
member = "fetch"
of = 2
sites = ["site-a/sign-in"]

[[step]]
input = "call"
mod = "mod-a"
member = "session"
args = ["other"]
handle = "web"

[[step]]
input = "call"
mod = "mod-a"
member = "fetch"
of = 4
sites = ["site-a/hello.txt"]

[[step]]
look = "requested"
headers = ["cookie"]

[step.expect]
answers = [{ site = "site-a", method = "GET", path = "/sign-in", headers = [] }, { site = "site-a", method = "GET", path = "/hello.txt", headers = [] }]
