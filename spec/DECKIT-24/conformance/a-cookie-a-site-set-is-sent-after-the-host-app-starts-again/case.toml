case = 9
name = "a-cookie-a-site-set-is-sent-after-the-host-app-starts-again"
note = "The cookies a session keeps stay as the host app quits and starts again. site-a sets signed=in as mod-a fetches sign-in, the host app starts again, and mod-a fetches hello.txt through its session main."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
args = ["main"]
handle = "web"

[[step]]
input = "call"
mod = "mod-a"
member = "fetch"
of = 2
sites = ["site-a/sign-in"]

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
args = ["main"]
handle = "web"

[[step]]
input = "call"
mod = "mod-a"
member = "fetch"
of = 6
sites = ["site-a/hello.txt"]

[[step]]
look = "requested"
headers = ["cookie"]

[step.expect]
answers = [{ site = "site-a", method = "GET", path = "/hello.txt", headers = [["cookie", "signed=in"]] }]
