case = 9
name = "an-answer-of-a-status-with-no-body-holds-no-body"
note = "body is left out of the answer of a status that has none. site-a answers empty 204."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
args = ["main"]
handle = "web"

[[step]]
input = "call"
mod = "mod-a"
member = "fetch"
of = 2
sites = ["site-a/empty"]

[step.expect]
answers = { url = "site-a/empty", status = 204, headers = [["connection", "close"]], redirected = false }
