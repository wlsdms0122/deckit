case = 4
name = "a-call-whose-function-throws-a-kind-is-refused-with-it"
note = "A call whose function throws an error with a kind is refused at call with that kind. mod-b's ping throws an error of kind BUSY."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.reach"
args = ["mod-b"]

[[step]]
input = "call"
mod = "mod-a"
member = "ping"
of = 2

[step.expect]
refuses = "call"
kind = "BUSY"
