case = 4
name = "a-method-crosses-held-by-its-table"
note = "A method of the class a table is made from crosses as a function called with that table on the service's end, beside the table's own keys. mod-b's exports are a table made from a class whose count answers its own n, 3."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.reach"
args = ["mod-b"]

[[step]]
input = "call"
mod = "mod-a"
member = "count"
of = 2

[step.expect]
answers = 3
