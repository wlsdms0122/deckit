case = 18
name = "a-mod-asks-for-attention-until-it-is-the-active-mod"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event <mod>:go tells it, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-a opens main in attach. The person presses on mod-a's main, so mod-a may activate. mod-b, which no input reached, opens x, which is held right behind main; the person presses on x, and mod-b, the active mod, asks for attention no more."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "call"
mod = "mod-b"
member = "events.emit"
args = ["go", { open = { name = "x" } }]

[[step]]
input = "window"
mod = "mod-b"
name = "x"
action = "press"

[[step]]
look = "desktop"

[step.expect]
answers = { active = "mod-b", attention = [], title = "mod-b" }
