case = 17
name = "the-normal-window-is-key-again-as-the-keyboard-comes-back"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event <mod>:go tells it, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-a opens main in attach. The person presses on mod-a's main, so mod-a may activate. mod-a, granted system.overlay-windows, opens f at the level overlay, which takes the keyboard; the person presses on main, the keyboard comes back to the desktop, and main is key again."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { open = { name = "f", level = "overlay", width = 200, height = 100 } }]

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-a", name = "main", level = "normal", frame = { x = 283, y = 107, width = 720, height = 480 }, key = true, minimized = false }, { mod = "mod-a", name = "f", level = "overlay", frame = { x = 540, y = 160, width = 200, height = 100 }, key = false, minimized = false }]

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/main/didAppear", activates = true }, { url = "https://said.test/main/didBecomeKey", activates = true }, { url = "https://said.test/main/didResignKey", activates = true }, { url = "https://said.test/f/didAppear", activates = true }, { url = "https://said.test/f/didBecomeKey", activates = true }, { url = "https://said.test/f/didResignKey", activates = true }, { url = "https://said.test/main/didBecomeKey", activates = true }]
