case = 17
name = "the-active-mod-may-activate"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event <mod>:go tells it, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-a opens main in attach. mod-b opens main once the host app started, cascaded from mod-a's main, the front window on screen. The person presses on mod-a's main, which mod-a closes: mod-b's main, the front window on screen, is key, and mod-b, which no input reached, is the active mod; x, which it opens, is key."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-b"
member = "events.emit"
args = ["go", { open = { name = "main" } }]

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "call"
mod = "mod-a"
member = "events.emit"
args = ["go", { do = "close", name = "main" }]

[[step]]
input = "call"
mod = "mod-b"
member = "events.emit"
args = ["go", { open = { name = "x" } }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "mod-b", name = "main", level = "normal", frame = { x = 307, y = 131, width = 720, height = 480 }, key = false, minimized = false }, { mod = "mod-b", name = "x", level = "normal", frame = { x = 331, y = 155, width = 720, height = 480 }, key = true, minimized = false }]
