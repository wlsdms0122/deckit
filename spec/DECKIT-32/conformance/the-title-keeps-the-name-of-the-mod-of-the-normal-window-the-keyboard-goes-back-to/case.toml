case = 18
name = "the-title-keeps-the-name-of-the-mod-of-the-normal-window-the-keyboard-goes-back-to"
note = "Each mod's code, in attach, opens the windows the case says, each with a callback for each of didAppear, didDisappear, didBecomeKey, didResignKey, didResize and didClose that opens https://said.test/<name>/<callback> outside the app, and opens a window or calls a member of one's handle as the event <mod>:go tells it, on the desktop of the base shell, 1280 by 800, whose zoom area is { x = 6, y = 0, width = 1274, height = 800 }. mod-a opens main in attach. The person presses on mod-a's main, so mod-a may activate. mod-a, marked system and granted deckit.reach-mods, reaches mod-b by its id, a request that hands mod-b activation, mod-b opening exports in start. mod-b, granted system.overlay-windows, opens f at the level overlay, which takes the keyboard: the title is mod-a's name, whose main is key again as the keyboard comes back to the desktop."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "window"
mod = "mod-a"
name = "main"
action = "press"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.reach"
args = ["mod-b"]

[[step]]
input = "call"
mod = "mod-b"
member = "events.emit"
args = ["go", { open = { name = "f", level = "overlay", width = 200, height = 100 } }]

[[step]]
look = "desktop"

[step.expect]
answers = { active = "mod-b", attention = [], title = "mod-a" }
