case = 5
name = "a-tilde-requirement-takes-those-up-to-the-next-minor-written"
note = "A comparator of ~ takes it and those above it up to the next minor where the minor is written, the next major where not. mod-c depends on mod-b ~1.3 and mod-d ~0 and mod-e ~0.0.1."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/packages"]
ship = ["mod-a", "mod-b", "mod-d", "mod-e"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/packages"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "install"
handed = true
folders = ["mod-c"]
args = [{ dryRun = true }]
part = "dependencies"

[step.expect]
answers = [{ id = "mod-b", requirement = "~1.3", installed = "1.4.2", satisfied = false }, { id = "mod-d", requirement = "~0", installed = "0.2.5", satisfied = true }, { id = "mod-e", requirement = "~0.0.1", installed = "0.0.3", satisfied = true }]
