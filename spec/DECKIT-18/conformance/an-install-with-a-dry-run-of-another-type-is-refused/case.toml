case = 5
name = "an-install-with-a-dry-run-of-another-type-is-refused"
note = "install is refused at call with kind INVALID_ARGUMENT where dryRun is not a boolean, and installs nothing: a dry run of mod-c after it replaces nothing. mod-a installs mod-c with a dryRun of the string yes."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/packages"]
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/packages"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "install"
handed = true
folders = ["mod-c"]
args = [{ dryRun = "yes" }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
input = "call"
mod = "mod-a"
member = "install"
handed = true
folders = ["mod-c"]
args = [{ dryRun = true }]
part = "replaces"

[step.expect]
answers = false
