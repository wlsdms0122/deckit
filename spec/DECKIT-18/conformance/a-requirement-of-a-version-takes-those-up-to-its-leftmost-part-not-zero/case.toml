case = 5
name = "a-requirement-of-a-version-takes-those-up-to-its-leftmost-part-not-zero"
note = "A comparator of a version alone, or with ^, takes it and those above it up to the next change of its leftmost part that is not 0, or of its last part written. mod-c depends on mod-b 1.2 and mod-d ^0.1 and mod-e 0.0.3."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/packages"]
ship = ["mod-a", "mod-b", "mod-d", "mod-e"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/packages"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "install"
handed = true
folders = ["mod-c"]
args = [{ dryRun = true }]
part = "dependencies"

[step.expect]
answers = [{ id = "mod-b", requirement = "1.2", installed = "1.4.2", satisfied = true }, { id = "mod-d", requirement = "^0.1", installed = "0.2.5", satisfied = false }, { id = "mod-e", requirement = "0.0.3", installed = "0.0.3", satisfied = true }]
