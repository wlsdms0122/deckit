case = 5
name = "an-install-of-a-folder-of-another-type-is-refused"
note = "install is refused at call with kind INVALID_ARGUMENT where folder is not a string. mod-a installs 1."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/packages"]
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/packages"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "install"
handed = true
args = [1]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
