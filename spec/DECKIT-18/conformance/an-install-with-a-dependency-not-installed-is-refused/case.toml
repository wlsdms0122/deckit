case = 5
name = "an-install-with-a-dependency-not-installed-is-refused"
note = "An install that is not a dry run is refused at call with kind UNMET_DEPENDENCY where a dependency is not installed, and installs nothing. mod-c depends on mod-f 1, which is not installed."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/packages"]
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/packages"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "install"
handed = true
folders = ["mod-c"]

[step.expect]
refuses = "call"
kind = "UNMET_DEPENDENCY"

[[step]]
input = "call"
mod = "mod-a"
member = "install"
handed = true
folders = ["mod-c"]
args = [{ dryRun = true }]
part = "replaces"

[step.expect]
answers = false
