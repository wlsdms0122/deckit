case = 5
name = "a-bound-requirement-takes-those-from-or-below-it"
note = "A comparator of >= takes it and every version above it, and one of < every version below it. mod-c depends on mod-b >=1.4.2 and mod-d <0.2.5 and mod-e <1."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/packages"]
ship = ["mod-a", "mod-b", "mod-d", "mod-e"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/packages"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "install"
handed = true
folders = ["mod-c"]
args = [{ dryRun = true }]
part = "dependencies"

[step.expect]
answers = [{ id = "mod-b", requirement = ">=1.4.2", installed = "1.4.2", satisfied = true }, { id = "mod-d", requirement = "<0.2.5", installed = "0.2.5", satisfied = false }, { id = "mod-e", requirement = "<1", installed = "0.0.3", satisfied = true }]
