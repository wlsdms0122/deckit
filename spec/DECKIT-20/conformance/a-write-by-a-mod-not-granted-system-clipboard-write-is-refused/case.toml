case = 7
name = "a-write-by-a-mod-not-granted-system-clipboard-write-is-refused"
note = "writeText is a request system.clipboard-write guards, and nothing of a request refused is done: mod-a, granted system.clipboard-read alone, writes Standup, is refused at call with kind NOT_PERMITTED, and reads the empty string."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "clipboard.writeText"
args = ["Standup"]

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"

[[step]]
input = "call"
mod = "mod-a"
member = "clipboard.readText"

[step.expect]
answers = ""
