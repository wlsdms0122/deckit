case = 7
name = "writing-no-text-to-the-clipboard-is-refused"
note = "writeText is refused at call with kind INVALID_ARGUMENT where text is left out, and the clipboard is not replaced. mod-a writes one, then nothing, and reads one."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "clipboard.writeText"
args = ["one"]

[[step]]
input = "call"
mod = "mod-a"
member = "clipboard.writeText"

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
input = "call"
mod = "mod-a"
member = "clipboard.readText"

[step.expect]
answers = "one"
