case = 7
name = "the-empty-text-written-to-the-clipboard-is-read"
note = "writeText of the empty string replaces the clipboard's text with it. mod-a writes one, then the empty string, and reads the empty string."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "clipboard.writeText"
args = ["one"]

[[step]]
input = "call"
mod = "mod-a"
member = "clipboard.writeText"
args = [""]

[[step]]
input = "call"
mod = "mod-a"
member = "clipboard.readText"

[step.expect]
answers = ""
