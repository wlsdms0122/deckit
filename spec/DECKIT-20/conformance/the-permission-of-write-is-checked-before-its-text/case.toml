case = 7
name = "the-permission-of-write-is-checked-before-its-text"
note = "A request is refused first as the permissions refuse one, then for its arguments. mod-a, granted system.clipboard-read alone, writes the number 5, and is refused with NOT_PERMITTED, not INVALID_ARGUMENT."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "clipboard.writeText"
args = [5]

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"
