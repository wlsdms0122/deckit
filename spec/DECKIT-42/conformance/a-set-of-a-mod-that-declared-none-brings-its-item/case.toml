case = 27
name = "a-set-of-a-mod-that-declared-none-brings-its-item"
note = "The host ships the status bar by its id, on the base shell, 1280 by 800, under a bar 32 high. ada sits at s1. Each mod-* is granted deckit.panel-windows and uses status-bar/items; one with a command runs it by opening https://said.test/<id>/ran/<command> outside the app, and opens the view view, 320 by 200, activates false, under the anchor { mod = \"status-bar\", id = <its id> } as the event <id>:go tells it, its didAppear, didDisappear and didClose opening https://said.test/<id>/view/<callback>. mod-a declares Alpha with the glyph bell. mod-b declares no item, and sets { name = \"Beta\", icon = \"users\", command = \"ping\" }: the item Beta stands from that set, left of Alpha, a button that is not disabled, for it has a command."

[host]
base = "shell"
api = "1.0.0"
mods = ["status-bar"]
ship = ["mod-a", "mod-b"]
bar = 32
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "call"
mod = "mod-b"
member = "dependencies.onConnect"
args = ["status-bar/items"]
listener = true

[[step]]
input = "call"
mod = "mod-b"
member = "set"
handed = true
args = [{ name = "Beta", icon = "users", command = "ping" }]

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "1.1" }
part = "text"

[step.expect]
answers = "toolbar \"Status Bar\" 1.1 at 1200,2 72x28\n  button \"Beta\" 1.2\n  button \"Alpha\" [disabled] 1.3"
