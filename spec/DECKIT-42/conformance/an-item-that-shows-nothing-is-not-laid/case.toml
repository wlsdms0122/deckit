case = 27
name = "an-item-that-shows-nothing-is-not-laid"
note = "The host ships the status bar by its id, on the base shell, 1280 by 800, under a bar 32 high. Each mod-* is granted deckit.panel-windows and uses status-bar/items; one with a command runs it by opening https://said.test/<id>/ran/<command> outside the app, and opens the view view, 320 by 200, activates false, under the anchor { mod = \"status-bar\", id = <its id> } as the event <id>:go tells it, its didAppear, didDisappear and didClose opening https://said.test/<id>/view/<callback>. mod-a declares Alpha with no glyph: it shows nothing, and no capsule stands. As it sets { count = 1 } it is laid, 23 wide, its count and 8 on each side, and the capsule 27."

[host]
base = "shell"
api = "1.0.0"
mods = ["status-bar"]
ship = ["mod-a"]
bar = 32

[[step]]
input = "start"

[[step]]
look = "windows"

[step.expect]
answers = []

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["status-bar/items"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "set"
handed = true
args = [{ count = 1 }]

[[step]]
look = "windows"

[step.expect]
answers = [{ mod = "status-bar", name = "bar", level = "panel", frame = { x = 1245, y = 2, width = 27, height = 28 }, key = false, minimized = false }]
