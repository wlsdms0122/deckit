case = 27
name = "an-entry-that-does-not-fit-the-table-is-left-out"
note = "The host ships the status bar by its id, on the base shell, 1280 by 800, under a bar 32 high. ada sits at s1. Each mod-* is granted deckit.panel-windows and uses status-bar/items; one with a command runs it by opening https://said.test/<id>/ran/<command> outside the app, and opens the view view, 320 by 200, activates false, under the anchor { mod = \"status-bar\", id = <its id> } as the event <id>:go tells it, its didAppear, didDisappear and didClose opening https://said.test/<id>/view/<callback>. mod-a declares an item with the key size the table does not give, mod-b one with a name of 65 characters, mod-c one with the icon \"a bell\", and mod-d the item Delta with the glyph users. Only Delta stands."

[host]
base = "shell"
api = "1.0.0"
mods = ["status-bar"]
ship = ["mod-a", "mod-b", "mod-c", "mod-d"]
bar = 32
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "1.1" }
part = "text"

[step.expect]
answers = "toolbar \"Status Bar\" 1.1 at 1236,2 36x28\n  button \"Delta\" [disabled] 1.2"
