case = 27
name = "a-declared-item-stands-while-its-mod-does-not-run"
note = "The host ships the status bar by its id, on the base shell, 1280 by 800, under a bar 32 high. ada sits at s1. Each mod-* is granted deckit.panel-windows and uses status-bar/items; one with a command runs it by opening https://said.test/<id>/ran/<command> outside the app, and opens the view view, 320 by 200, activates false, under the anchor { mod = \"status-bar\", id = <its id> } as the event <id>:go tells it, its didAppear, didDisappear and didClose opening https://said.test/<id>/view/<callback>. mod-a, which does not run in the background, declares the item Alpha with the glyph bell and no command. The capsule stands 36 wide, at the bar's right end, and a seat reads it as a toolbar Status Bar holding the button Alpha, disabled for it has no command, while mod-a does not run."

[host]
base = "shell"
api = "1.0.0"
mods = ["status-bar"]
ship = ["mod-a"]
bar = 32
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "1.1" }
part = "text"

[step.expect]
answers = "toolbar \"Status Bar\" 1.1 at 1236,2 36x28\n  button \"Alpha\" [disabled] 1.2"

[[step]]
look = "run"
mod = "mod-a"

[step.expect]
answers = "notRunning"
