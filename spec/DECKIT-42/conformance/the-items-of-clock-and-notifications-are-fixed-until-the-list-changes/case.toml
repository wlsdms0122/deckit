case = 27
name = "the-items-of-clock-and-notifications-are-fixed-until-the-list-changes"
note = "The host ships the status bar by its id, on the base shell, 1280 by 800, under a bar 32 high. ada sits at s1. Each mod-* is granted deckit.panel-windows and uses status-bar/items; one with a command runs it by opening https://said.test/<id>/ran/<command> outside the app, and opens the view view, 320 by 200, activates false, under the anchor { mod = \"status-bar\", id = <its id> } as the event <id>:go tells it, its didAppear, didDisappear and didClose opening https://said.test/<id>/view/<callback>. The case ships, in this order, notifications, which declares Bell, mod-a, which declares Alpha, and clock, which declares Clock, each with a glyph. The fixed list is clock then notifications: Clock rightmost and Bell left of it in the fixed region, Alpha in the region that scrolls. A seat reads Alpha, and then the fixed region left to right, Bell, Clock."

[host]
base = "shell"
api = "1.0.0"
mods = ["status-bar"]
ship = ["notifications", "mod-a", "clock"]
bar = 32
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "13.1" }
part = "text"

[step.expect]
answers = "toolbar \"Status Bar\" 13.1 at 1164,2 108x28\n  button \"Alpha\" [disabled] 13.2\n  button \"Bell\" [disabled] 13.3\n  button \"Clock\" [disabled] 13.4"
