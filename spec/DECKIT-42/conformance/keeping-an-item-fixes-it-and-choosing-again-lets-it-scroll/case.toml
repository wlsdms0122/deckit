case = 27
name = "keeping-an-item-fixes-it-and-choosing-again-lets-it-scroll"
note = "The host ships the status bar by its id, on the base shell, 1280 by 800, under a bar 32 high. ada sits at s1. Each mod-* is granted deckit.panel-windows and uses status-bar/items; one with a command runs it by opening https://said.test/<id>/ran/<command> outside the app, and opens the view view, 320 by 200, activates false, under the anchor { mod = \"status-bar\", id = <its id> } as the event <id>:go tells it, its didAppear, didDisappear and didClose opening https://said.test/<id>/view/<callback>. mod-a declares Alpha with the glyph bell, mod-b Beta and mod-c Gamma with the glyph users: they came in that order, Alpha at the right, and a seat reads Gamma, Beta, Alpha. ada presses Gamma with the second button and chooses the one entry of the menu that opens: Gamma is fixed, at the capsule's right end, and a seat reads Beta, Alpha, which scroll, then Gamma. ada does so again: Gamma scrolls again where it came, at the left of the others."

[host]
base = "shell"
api = "1.0.0"
mods = ["status-bar"]
ship = ["mod-a", "mod-b", "mod-c"]
bar = 32
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "1.2", button = 2 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "1.2", button = 2 }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "2.2", button = 0 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "2.2", button = 0 }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "1.1" }
part = "text"

[step.expect]
answers = "toolbar \"Status Bar\" 1.1 at 1164,2 108x28\n  button \"Beta\" [disabled] 1.3\n  button \"Alpha\" [disabled] 1.4\n  button \"Gamma\" [disabled] 1.2"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "1.2", button = 2 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "1.2", button = 2 }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "2.4", button = 0 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "2.4", button = 0 }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "1.1" }
part = "text"

[step.expect]
answers = "toolbar \"Status Bar\" 1.1 at 1164,2 108x28\n  button \"Gamma\" [disabled] 1.2\n  button \"Beta\" [disabled] 1.3\n  button \"Alpha\" [disabled] 1.4"
