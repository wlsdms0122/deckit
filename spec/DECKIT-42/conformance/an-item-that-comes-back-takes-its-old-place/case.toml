case = 27
name = "an-item-that-comes-back-takes-its-old-place"
note = "The host ships the status bar by its id, on the base shell, 1280 by 800, under a bar 32 high. ada sits at s1. Each mod-* is granted deckit.panel-windows and uses status-bar/items; one with a command runs it by opening https://said.test/<id>/ran/<command> outside the app, and opens the view view, 320 by 200, activates false, under the anchor { mod = \"status-bar\", id = <its id> } as the event <id>:go tells it, its didAppear, didDisappear and didClose opening https://said.test/<id>/view/<callback>. mod-b and mod-c declare none. mod-b sets Beta, mod-c sets Gamma, each with the glyph users, and mod-b removes its item and sets it again: Beta stands where it came first, at the right of Gamma."

[host]
base = "shell"
api = "1.0.0"
mods = ["status-bar"]
ship = ["mod-b", "mod-c"]
bar = 32
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "call"
mod = "mod-b"
member = "dependencies.onConnect"
args = ["status-bar/items"]
listener = true

[[step]]
input = "call"
mod = "mod-c"
member = "dependencies.onConnect"
args = ["status-bar/items"]
listener = true

[[step]]
input = "call"
mod = "mod-b"
member = "set"
handed = true
args = [{ name = "Beta", icon = "users" }]

[[step]]
input = "call"
mod = "mod-c"
member = "set"
handed = true
args = [{ name = "Gamma", icon = "users" }]

[[step]]
input = "call"
mod = "mod-b"
member = "remove"
handed = true

[[step]]
input = "call"
mod = "mod-b"
member = "set"
handed = true
args = [{ name = "Beta", icon = "users" }]

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "node", ref = "1.1" }
part = "text"

[step.expect]
answers = "toolbar \"Status Bar\" 1.1 at 1200,2 72x28\n  button \"Gamma\" [disabled] 1.2\n  button \"Beta\" [disabled] 1.3"
