case = 5
name = "a-command-a-mod-does-not-declare-is-refused"
note = "run is refused at call with kind COMMAND where the mod declares no command of the id. mod-b declares today and echo, and mod-a runs its note."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/commands"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "run"
handed = true
args = ["mod-b", "note"]

[step.expect]
refuses = "call"
kind = "COMMAND"
