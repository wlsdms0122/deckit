case = 5
name = "a-command-run-with-args-of-another-type-is-refused"
note = "run is refused at call with kind INVALID_ARGUMENT where args are not a table, before the command is looked for. mod-a runs note, which mod-b does not declare, with the args \"x\"."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/commands"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "run"
of = 2
handed = true
args = ["mod-b", "note", "x"]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
