case = 5
name = "a-command-whose-id-is-no-id-is-left-out"
note = "An entry whose id is not a command id is left out of the commands. mod-b declares a command of the id \"show today\"."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/commands"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "list"
of = 2
handed = true
part = "commands"

[step.expect]
answers = []
