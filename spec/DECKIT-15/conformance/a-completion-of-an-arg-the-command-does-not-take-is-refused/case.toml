case = 5
name = "a-completion-of-an-arg-the-command-does-not-take-is-refused"
note = "complete is refused at call with kind ARGUMENTS where param is no property of the command's params. mod-a completes the arg size of echo, which takes text."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/commands"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "complete"
handed = true
args = ["mod-b", "echo", "size", ""]

[step.expect]
refuses = "call"
kind = "ARGUMENTS"
