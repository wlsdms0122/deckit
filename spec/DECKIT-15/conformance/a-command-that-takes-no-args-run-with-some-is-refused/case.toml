case = 5
name = "a-command-that-takes-no-args-run-with-some-is-refused"
note = "run is refused at call with kind ARGUMENTS where the command declares no params and args hold a key. today takes none, and mod-a runs it with { day = 1 }."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/commands"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "run"
handed = true
args = ["mod-b", "today", { day = 1 }]

[step.expect]
refuses = "call"
kind = "ARGUMENTS"
