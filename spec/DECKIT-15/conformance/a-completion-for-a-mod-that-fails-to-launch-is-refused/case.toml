case = 5
name = "a-completion-for-a-mod-that-fails-to-launch-is-refused"
note = "complete is refused at call with the kind of the refusal of the reach, as run is, NOT_LAUNCHED where the mod's start throws. mod-b declares echo, which takes text, and throws in its start."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/commands"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "complete"
handed = true
args = ["mod-b", "echo", "text", ""]

[step.expect]
refuses = "call"
kind = "NOT_LAUNCHED"
