case = 5
name = "a-command-run-with-args-that-do-not-fit-its-params-is-refused"
note = "run is refused at call with kind INVALID_ARGUMENT where args do not fit the command's params. echo requires text, and mod-a runs it with {}."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/commands"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "run"
handed = true
args = ["mod-b", "echo", {}]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
