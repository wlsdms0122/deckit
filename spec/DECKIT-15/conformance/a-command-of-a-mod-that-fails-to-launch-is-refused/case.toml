case = 5
name = "a-command-of-a-mod-that-fails-to-launch-is-refused"
note = "run is refused at call with the kind of the refusal of the reach, NOT_LAUNCHED where the mod's start throws. mod-b declares today and throws in its start."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/commands"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "run"
of = 2
handed = true
args = ["mod-b", "today"]

[step.expect]
refuses = "call"
kind = "NOT_LAUNCHED"
