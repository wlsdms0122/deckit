case = 5
name = "an-arg-of-a-mod-that-opens-no-complete-command-is-offered-nothing"
note = "complete answers an empty array where the exports the mod opens for its id have no completeCommand. mod-b opens runCommand alone."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/commands"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "complete"
of = 2
handed = true
args = ["mod-b", "echo", "text", ""]

[step.expect]
answers = []
