case = 5
name = "a-command-list-by-a-client-not-granted-system-services-is-refused"
note = "list is refused at call with kind NOT_PERMITTED for a client not granted deckit.system-services."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/commands"]
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/commands"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"
