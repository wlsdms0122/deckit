case = 5
name = "a-command-whose-params-take-no-table-is-left-out"
note = "An entry whose params are not of type object is left out of the commands. mod-b declares a command whose params are of type string."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/commands"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true
part = "commands"

[step.expect]
answers = []
