case = 5
name = "an-arg-is-completed-by-the-mod-that-declares-its-command"
note = "complete(mod, id, param, partial, args) calls completeCommand(id, param, partial, args) on the exports the mod opens for its id, and answers what it answers. mod-b offers the words that start with what is typed, and mod-a types a for the text of echo."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/commands"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "complete"
handed = true
args = ["mod-b", "echo", "text", "a", {}]

[step.expect]
answers = [{ value = "alpha", title = "ALPHA" }]
