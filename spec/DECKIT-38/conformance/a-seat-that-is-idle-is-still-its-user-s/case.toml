case = 26
name = "a-seat-that-is-idle-is-still-its-user-s"
note = "Whether a seat is idle decides nothing of admission. With an idle time of 0, the seat ada sits at is idle from the moment it opens, and a second party that proves ada is still refused with ALREADY_RUNNING."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { idleTime = 0 }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "attach"
party = "q"
principal = "ada"
key = "first"

[step.expect]
refuses = "call"
kind = "ALREADY_RUNNING"
