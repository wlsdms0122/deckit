case = 26
name = "seat-input-of-an-event-none-names-is-refused-where-no-layer-serves-input"
note = "seat/input is refused at call with REFUSED where no layer serves input, before its event is held to the kinds a layer names: the base stacks none, and a party sends an event no layer names, wheel."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "wheel", type = "down" }

[step.expect]
refuses = "call"
kind = "REFUSED"
