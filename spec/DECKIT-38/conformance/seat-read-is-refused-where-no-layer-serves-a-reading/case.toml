case = 25
name = "seat-read-is-refused-where-no-layer-serves-a-reading"
note = "seat/read of an output it reads is refused at call with REFUSED where no layer serves a reading. The base stacks none, and a party reads the desktop."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "desktop" }

[step.expect]
refuses = "call"
kind = "REFUSED"
