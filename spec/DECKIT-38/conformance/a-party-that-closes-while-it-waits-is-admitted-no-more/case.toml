case = 31
name = "a-party-that-closes-while-it-waits-is-admitted-no-more"
note = "With asking true on the base shell, ada attaches as p and waits, and p closes its transport connection. Whoever is at the machine answers p's ask yes then, which seats nobody: ada attaches again as q, is answered yes, and sits at s1, the first seat a transport connection opened."

[host]
base = "shell"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { asking = true }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
waits = true

[[step]]
input = "detach"
party = "p"

[[step]]
input = "answer"
party = "p"
allow = true

[[step]]
input = "attach"
party = "q"
principal = "ada"
key = "first"
waits = true

[[step]]
input = "answer"
party = "q"
allow = true

[[step]]
look = "admitted"
party = "q"
part = "seat"

[step.expect]
answers = { id = "s1", local = false, user = { id = "ada", name = "Ada Lovelace" } }
