case = 25
name = "seat-watch-answers-true-with-no-layer-and-tells-nothing-by-itself"
note = "seat/watch answers true whether a layer serves anything or not, and a seat is told an output only as a layer tells it. On a base that stacks no layer a party watches changes, is answered true, and was told nothing."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/watch"
params = { of = "changes", on = true }

[step.expect]
answers = true

[[step]]
look = "told"
party = "p"

[step.expect]
answers = { messages = [], closed = false }
