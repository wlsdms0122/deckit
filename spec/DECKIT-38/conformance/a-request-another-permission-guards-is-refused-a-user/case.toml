case = 25
name = "a-request-another-permission-guards-is-refused-a-user"
note = "A user's job reaches no principal by id and holds deckit.seat alone, so a request another permission guards is refused it. A party of ada asks to reach bob, which deckit.reach-mods guards, and is refused at call."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }, { id = "bob", name = "Bob Kahn" }]
keys = [{ principal = "ada", key = "first" }, { principal = "bob", key = "second" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "connection/reach"
params = { lifecycle = 0, target = "bob" }

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"
