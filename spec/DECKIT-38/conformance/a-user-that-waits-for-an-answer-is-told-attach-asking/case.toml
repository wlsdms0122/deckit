case = 26
name = "a-user-that-waits-for-an-answer-is-told-attach-asking"
note = "With asking true, the host sends a party whose proof verifies the notification attach/asking, which holds no params, before authenticate is answered. The host set asking before the first start, and ada attaches on a base that takes no ask, so it is refused after it is told."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { asking = true }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[step.expect]
refuses = "call"
kind = "REFUSED"

[[step]]
look = "told"
party = "p"
part = "messages"

[step.expect]
answers = [{ method = "attach/asking", request = false }]
