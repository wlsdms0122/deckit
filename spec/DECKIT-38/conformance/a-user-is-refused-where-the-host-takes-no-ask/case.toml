case = 31
name = "a-user-is-refused-where-the-host-takes-no-ask"
note = "With asking true, a user is refused where the host takes no ask: authenticate is refused at call with REFUSED, and the host closes the transport connection. The base system takes no ask to sit."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { asking = true }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[step.expect]
refuses = "call"
kind = "REFUSED"

[[step]]
look = "told"
party = "p"
part = "closed"

[step.expect]
answers = true
