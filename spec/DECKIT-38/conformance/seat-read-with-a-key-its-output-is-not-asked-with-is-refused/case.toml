case = 25
name = "seat-read-with-a-key-its-output-is-not-asked-with-is-refused"
note = "seat/read is refused at call with INVALID_ARGUMENT where params hold a key the output is not asked with: since is asked of changes, and here it is beside desktop."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "desktop", since = 1 }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
