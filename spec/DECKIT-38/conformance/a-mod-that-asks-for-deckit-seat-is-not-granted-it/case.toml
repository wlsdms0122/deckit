case = 25
name = "a-mod-that-asks-for-deckit-seat-is-not-granted-it"
note = "No manifest is read against deckit.seat: a mod that asks for it, marked system, is answered usable false for it, with no name and no description, as for a permission nothing defines."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"
part = "permissions"

[step.expect]
answers = [{ id = "deckit.seat", reason = "Sits at a seat.", usable = false }]
