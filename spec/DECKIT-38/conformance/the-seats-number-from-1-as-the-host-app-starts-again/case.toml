case = 25
name = "the-seats-number-from-1-as-the-host-app-starts-again"
note = "The number of a seat counts the seats opened since the host app started. ada sits at s1; the host app quits and starts again, and ada attaches and sits at s1."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
input = "attach"
party = "q"
principal = "ada"
key = "first"
part = "seat"

[step.expect]
answers = { id = "s1", local = false, user = { id = "ada", name = "Ada Lovelace" } }
