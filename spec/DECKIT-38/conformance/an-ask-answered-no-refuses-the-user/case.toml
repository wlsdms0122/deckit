case = 26
name = "an-ask-answered-no-refuses-the-user"
note = "With asking true on the base shell, ada attaches and waits. mod-a, a system mod granted deckit.seats, reads the ask and answers it no: authenticate is refused at call with kind REFUSED, the host closes the transport connection, and the local seat is the only one."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { asking = true }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
waits = true

[[step]]
input = "call"
mod = "mod-a"
member = "seats.asks"
handle = "shell"

[step.expect]
answers = [{ id = "2", name = "Ada Lovelace" }]

[[step]]
input = "call"
mod = "mod-a"
member = "seats.answer"
handle = "shell"
args = ["2", false]

[step.expect]
answers = true

[[step]]
look = "admitted"
party = "p"

[step.expect]
refuses = "call"
kind = "REFUSED"

[[step]]
look = "told"
party = "p"
part = "closed"

[step.expect]
answers = true

[[step]]
input = "call"
mod = "mod-a"
member = "seats.list"
handle = "shell"

[step.expect]
answers = [{ id = "1", name = "Deckit conformance", colour = "blue", idle = false, following = false }]
