case = 31
name = "an-ask-answered-no-refuses-the-user"
note = "With asking true on the base shell, ada attaches and waits, and the system asks the host whether she may sit. Whoever is at the machine answers no: authenticate is refused at call with kind REFUSED, and the host closes the transport connection."

[host]
base = "shell"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { asking = true }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
waits = true

[[step]]
input = "answer"
party = "p"
allow = false

[[step]]
look = "admitted"
party = "p"

[step.expect]
refuses = "call"
kind = "REFUSED"

[[step]]
look = "told"
party = "p"
part = "closed"

[step.expect]
answers = true
