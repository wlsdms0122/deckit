case = 25
name = "a-user-that-attaches-sits-at-a-seat"
note = "A seat opens as a transport connection comes to host a run of its user, and authenticate answers it under seat: its id, that it is not the local seat, and the user as the host made it. The first seat of a start is s1."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
part = "seat"

[step.expect]
answers = { id = "s1", local = false, user = { id = "ada", name = "Ada Lovelace" } }
