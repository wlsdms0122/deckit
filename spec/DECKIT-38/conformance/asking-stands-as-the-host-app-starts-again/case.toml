case = 26
name = "asking-stands-as-the-host-app-starts-again"
note = "The system keeps the settings as the host app quits and starts again. The host set asking true before the first start; after a quit and a start, ada is still refused where the host takes no ask."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { asking = true }

[[step]]
input = "start"

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[step.expect]
refuses = "call"
kind = "REFUSED"
