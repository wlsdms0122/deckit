case = 31
name = "two-parties-of-one-user-that-wait-are-two-asks"
note = "Each party that waits is an ask of its own, though both attach as one user. With asking true on the base shell, two parties attach as ada and wait. p's ask answered yes, ada sits at s1 and q's ask waits still. Answered yes in its turn, it is held to the first item again: ada sits, so q's authenticate is refused ALREADY_RUNNING."

[host]
base = "shell"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { asking = true }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
waits = true

[[step]]
input = "attach"
party = "q"
principal = "ada"
key = "first"
waits = true

[[step]]
input = "answer"
party = "p"
allow = true

[[step]]
look = "admitted"
party = "p"
part = "seat"

[step.expect]
answers = { id = "s1", local = false, user = { id = "ada", name = "Ada Lovelace" } }

[[step]]
look = "told"
party = "q"
part = "closed"

[step.expect]
answers = false

[[step]]
input = "answer"
party = "q"
allow = true

[[step]]
look = "admitted"
party = "q"

[step.expect]
refuses = "call"
kind = "ALREADY_RUNNING"
