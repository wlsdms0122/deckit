case = 25
name = "seat-input-with-a-key-its-event-is-not-asked-with-is-refused"
note = "seat/input is refused at call with INVALID_ARGUMENT where params hold a key the event is not asked with: x is a pointer's, and here it is beside a text event."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "text", type = "insert", text = "a", x = 1 }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
