case = 25
name = "seat-watch-that-does-not-say-on-is-refused"
note = "seat/watch is refused at call with INVALID_ARGUMENT where on is left out."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/watch"
params = { of = "changes" }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
