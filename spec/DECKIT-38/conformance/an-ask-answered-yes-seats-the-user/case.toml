case = 31
name = "an-ask-answered-yes-seats-the-user"
note = "With asking true on the base shell, ada attaches and is told attach/asking while authenticate waits, and the system asks the host whether she may sit. Whoever is at the machine answers yes: authenticate answers its result, ada sits at s1 and its transport connection stays open."

[host]
base = "shell"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { asking = true }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
waits = true

[[step]]
look = "told"
party = "p"
part = "messages"

[step.expect]
answers = [{ method = "attach/asking", request = false }]

[[step]]
input = "answer"
party = "p"
allow = true

[[step]]
look = "admitted"
party = "p"
part = "seat"

[step.expect]
answers = { id = "s1", local = false, user = { id = "ada", name = "Ada Lovelace" } }

[[step]]
look = "told"
party = "p"
part = "closed"

[step.expect]
answers = false
