case = 26
name = "an-ask-answered-yes-seats-the-user"
note = "With asking true on the base shell, whose shell serves the ask, ada attaches and is told attach/asking while authenticate waits. mod-a, a system mod granted deckit.seats, reads the ask and answers it yes: authenticate answers its result, ada sits at s1 and its transport connection stays open."

[host]
base = "shell"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]
seats = { asking = true }

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
waits = true

[[step]]
look = "told"
party = "p"
part = "messages"

[step.expect]
answers = [{ method = "attach/asking", request = false }]

[[step]]
input = "call"
mod = "mod-a"
member = "seats.asks"
handle = "shell"

[step.expect]
answers = [{ id = "2", name = "Ada Lovelace" }]

[[step]]
input = "call"
mod = "mod-a"
member = "seats.answer"
handle = "shell"
args = ["2", true]

[step.expect]
answers = true

[[step]]
look = "admitted"
party = "p"
part = "seat"

[step.expect]
answers = { id = "s1", local = false, user = { id = "ada", name = "Ada Lovelace" } }

[[step]]
look = "told"
party = "p"
part = "closed"

[step.expect]
answers = false

[[step]]
input = "call"
mod = "mod-a"
member = "seats.asks"
handle = "shell"

[step.expect]
answers = []
