case = 25
name = "seat-read-that-names-no-output-is-refused"
note = "seat/read is refused at call with INVALID_ARGUMENT where of is left out. A party asks it with no params."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "seat/read"

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
