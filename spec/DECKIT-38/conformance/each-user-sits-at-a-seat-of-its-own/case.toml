case = 25
name = "each-user-sits-at-a-seat-of-its-own"
note = "A seat is one user's, and its number counts the seats opened since the host app started. ada sits at s1; bob attaches next and sits at s2, under its own name."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }, { id = "bob", name = "Bob Kahn" }]
keys = [{ principal = "ada", key = "first" }, { principal = "bob", key = "second" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "attach"
party = "q"
principal = "bob"
key = "second"
part = "seat"

[step.expect]
answers = { id = "s2", local = false, user = { id = "bob", name = "Bob Kahn" } }
