case = 25
name = "a-seat-s-number-is-not-given-again-in-a-start"
note = "A seat closes as its user's run ends, and no number is given twice in a start. ada sits at s1 and its party closes its transport connection; ada attaches again and sits at s2."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "detach"
party = "p"

[[step]]
input = "attach"
party = "q"
principal = "ada"
key = "first"
part = "seat"

[step.expect]
answers = { id = "s2", local = false, user = { id = "ada", name = "Ada Lovelace" } }
