case = 25
name = "a-user-made-again-under-its-id-takes-the-new-name"
note = "Making a user under an id one is kept under already gives it the new name. The host makes ada twice, and the seat ada sits at holds the second name."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }, { id = "ada", name = "Countess of Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
part = "seat"

[step.expect]
answers = { id = "s1", local = false, user = { id = "ada", name = "Countess of Lovelace" } }
