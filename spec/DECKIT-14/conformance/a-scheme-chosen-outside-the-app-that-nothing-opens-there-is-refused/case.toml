case = 5
name = "a-scheme-chosen-outside-the-app-that-nothing-opens-there-is-refused"
note = "choose(scheme, { system = true }) is refused at call with kind SYSTEM where nothing opens the scheme outside the app. mod-b declares board, and mod-a chooses outside the app for it."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/urls"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/urls"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "choose"
handed = true
args = ["board", { system = true }]

[step.expect]
refuses = "call"
kind = "SYSTEM"
