case = 5
name = "a-choice-of-no-shape-is-refused"
note = "choose is refused at call with kind INVALID_ARGUMENT where the choice is neither { mod } nor { system = true }. mod-a chooses { system = false } for https."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/urls"]
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/urls"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "choose"
handed = true
args = ["https", { system = false }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
