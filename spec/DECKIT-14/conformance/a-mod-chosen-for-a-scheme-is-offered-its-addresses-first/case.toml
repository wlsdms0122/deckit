case = 5
name = "a-mod-chosen-for-a-scheme-is-offered-its-addresses-first"
note = "choose(scheme, { mod }) puts that mod first in the scheme's list, and answers the scheme as list does. mod-b and mod-c declare https, mod-c is chosen, and mod-c takes https://example.com/."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/urls"]
ship = ["mod-a", "mod-b", "mod-c"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/urls"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "choose"
handed = true
args = ["https", { mod = "mod-c" }]

[step.expect]
answers = { scheme = "https", system = "browser", chosen = { mod = "mod-c" }, mods = [{ mod = { id = "mod-c", name = "mod-c" }, patterns = ["https:*"] }, { mod = { id = "mod-b", name = "mod-b" }, patterns = ["https:*"] }] }

[[step]]
input = "call"
mod = "mod-a"
member = "open"
handed = true
args = ["https://example.com/"]

[step.expect]
answers = true

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://mod-c.test/", activates = true }]
