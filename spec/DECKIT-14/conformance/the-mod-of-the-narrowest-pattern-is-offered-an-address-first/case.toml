case = 5
name = "the-mod-of-the-narrowest-pattern-is-offered-an-address-first"
note = "Of the mods whose patterns take an address, the one of the narrowest pattern is offered it first. mod-b declares https:*, mod-c https://example.com/docs*, and mod-c takes https://example.com/docs/1."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/urls"]
ship = ["mod-a", "mod-b", "mod-c"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/urls"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "open"
of = 2
handed = true
args = ["https://example.com/docs/1"]

[step.expect]
answers = true

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://mod-c.test/", activates = true }]
