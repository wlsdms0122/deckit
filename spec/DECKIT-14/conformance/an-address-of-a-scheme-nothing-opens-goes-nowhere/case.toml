case = 5
name = "an-address-of-a-scheme-nothing-opens-goes-nowhere"
note = "An address of a scheme no mod declares and nothing opens outside the app opens nowhere, and open answers false. mod-a opens gopher://example.com/."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/urls"]
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/urls"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "open"
handed = true
args = ["gopher://example.com/"]

[step.expect]
answers = false

[[step]]
look = "opened"

[step.expect]
answers = []
