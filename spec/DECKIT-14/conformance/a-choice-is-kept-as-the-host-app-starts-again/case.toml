case = 5
name = "a-choice-is-kept-as-the-host-app-starts-again"
note = "What is chosen for a scheme is kept as the host app starts again. mod-c is chosen for https, the app quits and starts, and list answers it chosen."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/urls"]
ship = ["mod-a", "mod-b", "mod-c"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/urls"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "choose"
of = 2
handed = true
args = ["https", { mod = "mod-c" }]

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/urls"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "list"
of = 6
handed = true
part = "schemes"

[step.expect]
answers = [{ scheme = "http", system = "browser", mods = [] }, { scheme = "https", system = "browser", chosen = { mod = "mod-c" }, mods = [{ mod = { id = "mod-c", name = "mod-c" }, patterns = ["https:*"] }, { mod = { id = "mod-b", name = "mod-b" }, patterns = ["https:*"] }] }, { scheme = "file", system = "file", mods = [] }]
