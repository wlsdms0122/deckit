case = 5
name = "an-address-no-mod-opens-opens-outside-the-app"
note = "open(url) of an https address that no mod declares opens it outside the app, and answers true. mod-a opens https://example.com/ and the host is handed it, coming to the front."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/urls"]
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/urls"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "open"
handed = true
args = ["https://example.com/"]

[step.expect]
answers = true

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://example.com/", activates = true }]
