case = 5
name = "an-entry-of-a-scheme-that-is-no-place-is-left-out"
note = "An entry that cannot be used is left out of the schemes, and its mod opens nothing by it. mod-b declares javascript, and list answers no javascript scheme."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/urls"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/urls"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true
part = "schemes"

[step.expect]
answers = [{ scheme = "http", system = "browser", mods = [] }, { scheme = "https", system = "browser", mods = [] }, { scheme = "file", system = "file", mods = [] }]
