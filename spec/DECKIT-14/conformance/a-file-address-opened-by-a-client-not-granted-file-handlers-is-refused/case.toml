case = 5
name = "a-file-address-opened-by-a-client-not-granted-file-handlers-is-refused"
note = "open of a file address is refused at call with kind NOT_PERMITTED for a client not granted system.file-handlers, before its options are read: mod-a, granted nothing, opens file:///tmp/a.txt with activates 1."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/urls"]
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/urls"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "open"
of = 2
handed = true
args = ["file:///tmp/a.txt", { activates = 1 }]

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"

[[step]]
look = "opened"

[step.expect]
answers = []
