case = 5
name = "a-choice-by-a-client-not-granted-system-services-is-refused"
note = "choose is refused at call with kind NOT_PERMITTED for a client not granted deckit.system-services, before its arguments are read: mod-a hands a scheme of another type."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/urls"]
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/urls"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "choose"
handed = true
args = [1]

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"
