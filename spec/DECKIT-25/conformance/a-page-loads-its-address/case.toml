case = 10
name = "a-page-loads-its-address"
note = "page({ session, url }) answers the handle of a page laid in the mod's page, which loads url. The host's layer shows index.html of site-a, titled Hello, in mod-a's session main, and reads its state."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]

[[step]]
input = "start"

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 2
part = "url"

[step.expect]
answers = "site-a/index.html"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 2
part = "title"

[step.expect]
answers = "Hello"
