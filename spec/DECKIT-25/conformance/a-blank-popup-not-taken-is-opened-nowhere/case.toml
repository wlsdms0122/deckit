case = 11
name = "a-blank-popup-not-taken-is-opened-nowhere"
note = "A popup at a blank page that the delegate does not take is closed, and a blank page is never opened outside the app. A press on opener.html of site-a calls window.open(\"\"), in a page whose delegate answers false."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { openWindow = false }

[[step]]
input = "start"

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/opener.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 2

[[step]]
look = "delegated"
mod = "mod-a"
part = "method"

[step.expect]
answers = ["openWindow"]

[[step]]
look = "opened"

[step.expect]
answers = []
