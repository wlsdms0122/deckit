case = 10
name = "a-page-shown-apart-that-closes-tells-the-delegate"
note = "didClose() is told as a page shown apart has closed. The host's layer shows child.html of site-a apart and closes it."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { didClose = true }

[[step]]
input = "start"

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/child.html"
apart = true

[[step]]
input = "call"
mod = "mod-a"
member = "close"
of = 2

[[step]]
look = "delegated"
mod = "mod-a"

[step.expect]
answers = [{ method = "didClose", args = [] }]
