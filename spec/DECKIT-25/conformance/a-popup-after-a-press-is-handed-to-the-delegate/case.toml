case = 11
name = "a-popup-after-a-press-is-handed-to-the-delegate"
note = "A page's window.open after a press in it opens a popup, a page handed to the delegate's openWindow, which takes it by answering true. A press on opener.html of site-a calls window.open(\"/child.html\"), in a page whose delegate takes every popup."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { openWindow = true }

[[step]]
input = "start"

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/opener.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 2

[[step]]
look = "delegated"
mod = "mod-a"
part = "method"

[step.expect]
answers = ["openWindow"]

[[step]]
look = "requested"

[step.expect]
answers = [{ site = "site-a", method = "GET", path = "/opener.html", headers = [] }, { site = "site-a", method = "GET", path = "/child.html", headers = [] }]

[[step]]
look = "opened"

[step.expect]
answers = []
