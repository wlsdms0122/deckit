case = 24
name = "a-page-whose-load-is-refused-tells-its-failure"
note = "A load of the main frame that fails is told in state as its failure, with the address and its kind. The host's layer shows a page at site-a, whose connection is refused, and reads its failure."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
refusing = ["site-a"]

[[step]]
input = "start"

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 2
part = "failure"

[step.expect]
answers = { url = "site-a/index.html", kind = "refused" }
