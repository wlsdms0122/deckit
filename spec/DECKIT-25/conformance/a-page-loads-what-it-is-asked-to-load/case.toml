case = 10
name = "a-page-loads-what-it-is-asked-to-load"
note = "load(url) loads url in the page. The host's layer shows index.html of site-a, asks the page to load next.html, titled Next, and reads its title."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]

[[step]]
input = "start"

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "call"
mod = "mod-a"
member = "load"
of = 2
sites = ["site-a/next.html"]

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 2
part = "title"

[step.expect]
answers = "Next"
