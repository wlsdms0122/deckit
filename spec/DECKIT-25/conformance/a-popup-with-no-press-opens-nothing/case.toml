case = 10
name = "a-popup-with-no-press-opens-nothing"
note = "window.open opens a popup only where a key or the mouse was pressed in the page just before. opener.html of site-a calls window.open(\"/child.html\") as it loads, with no press, in a page whose delegate takes every popup."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { openWindow = true }

[[step]]
input = "start"

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/opener.html"

[[step]]
look = "requested"

[step.expect]
answers = [{ site = "site-a", method = "GET", path = "/opener.html", headers = [] }]

[[step]]
look = "delegated"
mod = "mod-a"

[step.expect]
answers = []

[[step]]
look = "opened"

[step.expect]
answers = []
