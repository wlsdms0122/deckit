case = 25
name = "a-party-is-told-no-event-it-does-not-listen-to"
note = "event/deliver tells an event the run listens to. A party of ada that asked no event/listen emits ping and is told nothing."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "event/emit"
params = { name = "ping", args = [] }

[[step]]
look = "told"
party = "p"

[step.expect]
answers = { messages = [], closed = false }
