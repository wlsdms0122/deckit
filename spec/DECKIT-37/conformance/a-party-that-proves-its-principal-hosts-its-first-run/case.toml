case = 25
name = "a-party-that-proves-its-principal-hosts-its-first-run"
note = "A transport connection whose authenticate answered a result hosts a run of the principal proved, and run is 1 for a principal's first. A party proves ada with a key authorized for it, and the run answered is read."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"
part = "run"

[step.expect]
answers = 1
