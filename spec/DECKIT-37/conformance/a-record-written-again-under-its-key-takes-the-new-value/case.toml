case = 25
name = "a-record-written-again-under-its-key-takes-the-new-value"
note = "record/write keeps the record under key as value, in place of one kept there. A party of ada writes 1 and then a string under note, and reads the string."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "record/write"
params = { key = "note", value = 1 }

[[step]]
input = "ask"
party = "p"
method = "record/write"
params = { key = "note", value = "two" }

[step.expect]
answers = true

[[step]]
input = "ask"
party = "p"
method = "record/read"
params = { key = "note" }

[step.expect]
answers = "two"
