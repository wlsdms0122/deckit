case = 25
name = "record-remove-of-a-key-that-keeps-no-record-answers-true"
note = "record/remove answers true once no record is kept under key, which is so at once where none was. A party of ada removes note, having written nothing."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "record/remove"
params = { key = "note" }

[step.expect]
answers = true
