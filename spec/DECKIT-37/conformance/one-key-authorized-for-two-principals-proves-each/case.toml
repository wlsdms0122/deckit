case = 25
name = "one-key-authorized-for-two-principals-proves-each"
note = "A key is authorized for a principal and not for the system, and one public key registered for two principals proves each. The host registers the pair first for ada and for bob; a party proves ada with it, and a second proves bob with it and hosts bob's first run."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }, { id = "bob", name = "Bob Kahn" }]
keys = [{ principal = "ada", key = "first" }, { principal = "bob", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "attach"
party = "q"
principal = "bob"
key = "first"
part = "principal"

[step.expect]
answers = "bob"
