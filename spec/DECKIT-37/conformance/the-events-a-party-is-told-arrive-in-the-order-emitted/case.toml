case = 25
name = "the-events-a-party-is-told-arrive-in-the-order-emitted"
note = "The events one run sends are heard in the order it sends them. A party of ada listens to ada:a and ada:b and emits b, a, and b with a value; it is told the three in that order."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "event/listen"
params = { names = ["ada:a", "ada:b"] }

[[step]]
input = "ask"
party = "p"
method = "event/emit"
params = { name = "b", args = [] }

[[step]]
input = "ask"
party = "p"
method = "event/emit"
params = { name = "a", args = [] }

[[step]]
input = "ask"
party = "p"
method = "event/emit"
params = { name = "b", args = [2] }

[[step]]
look = "told"
party = "p"

[step.expect]
answers = { messages = [{ method = "event/deliver", params = { name = "ada:b", args = [] }, request = false }, { method = "event/deliver", params = { name = "ada:a", args = [] }, request = false }, { method = "event/deliver", params = { name = "ada:b", args = [2] }, request = false }], closed = false }
