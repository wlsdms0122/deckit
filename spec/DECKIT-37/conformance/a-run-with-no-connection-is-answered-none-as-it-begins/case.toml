case = 25
name = "a-run-with-no-connection-is-answered-none-as-it-begins"
note = "A run whose job uses and provides no interface and reaches no principal has no connection: connection/begin answers it an empty array. A party of ada asks it for its lifecycle 0."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "connection/begin"
params = { lifecycle = 0 }

[step.expect]
answers = []
