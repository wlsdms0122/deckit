case = 25
name = "a-principal-s-runs-count-from-1-as-the-host-app-starts-again"
note = "run is 1 for a principal's first run since the host app started. A party of ada hosts run 1; the host app quits and starts again, and a second party that proves ada is answered run 1."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
input = "attach"
party = "q"
principal = "ada"
key = "first"
part = "run"

[step.expect]
answers = 1
