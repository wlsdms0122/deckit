case = 25
name = "connection-begin-with-a-key-it-does-not-take-is-refused"
note = "One rule refuses the params of every request a party asks, at call with INVALID_ARGUMENT: params that hold a key the row does not give. A party of ada asks connection/begin with other beside lifecycle."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "connection/begin"
params = { lifecycle = 0, other = 1 }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
