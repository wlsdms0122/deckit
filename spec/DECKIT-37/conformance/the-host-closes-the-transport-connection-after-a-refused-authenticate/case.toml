case = 25
name = "the-host-closes-the-transport-connection-after-a-refused-authenticate"
note = "After a refusal of authenticate the host closes the transport connection, having told the party nothing. A party proves ada with a pair not authorized for it and is refused; what it was told holds no message, and its transport connection has closed."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "second"

[step.expect]
refuses = "call"
kind = "NOT_AUTHENTICATED"

[[step]]
look = "told"
party = "p"

[step.expect]
answers = { messages = [], closed = true }
