case = 25
name = "event-emit-that-leaves-out-its-args-is-refused"
note = "One rule refuses the params of every request a party asks, at call with INVALID_ARGUMENT: params that leave out a key of the row. A party of ada asks event/emit with no args."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "event/emit"
params = { name = "ping" }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
