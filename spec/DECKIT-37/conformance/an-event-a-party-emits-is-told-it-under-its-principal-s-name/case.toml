case = 25
name = "an-event-a-party-emits-is-told-it-under-its-principal-s-name"
note = "What a run emits is named after its principal, and a run is told its own event where it listens to it. A party of ada listens to ada:ping, answered true, and emits ping with two values, answered true; it is told event/deliver, a notification, with the whole name and the values."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "event/listen"
params = { names = ["ada:ping"] }

[step.expect]
answers = true

[[step]]
input = "ask"
party = "p"
method = "event/emit"
params = { name = "ping", args = [1, "two"] }

[step.expect]
answers = true

[[step]]
look = "told"
party = "p"

[step.expect]
answers = { messages = [{ method = "event/deliver", params = { name = "ada:ping", args = [1, "two"] }, request = false }], closed = false }
