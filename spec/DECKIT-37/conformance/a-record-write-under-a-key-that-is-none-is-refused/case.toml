case = 25
name = "a-record-write-under-a-key-that-is-none-is-refused"
note = "A request is refused as the rule it reads from refuses a mod's run: storage refuses a key that is no key at call with INVALID_ARGUMENT. A party of ada writes under the empty key and is refused, and no record is kept."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "record/write"
params = { key = "", value = 1 }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"

[[step]]
input = "ask"
party = "p"
method = "record/keys"

[step.expect]
answers = []
