case = 25
name = "connection-end-with-a-key-it-does-not-take-is-refused"
note = "One rule refuses the params of every request a party asks, at call with INVALID_ARGUMENT, those answered true among them: params that hold a key the row does not give. No request names the run, so a party of ada that asks connection/end with run beside lifecycle is refused."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "connection/end"
params = { lifecycle = 0, run = 1 }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
