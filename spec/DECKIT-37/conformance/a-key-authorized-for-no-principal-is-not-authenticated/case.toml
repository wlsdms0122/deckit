case = 25
name = "a-key-authorized-for-no-principal-is-not-authenticated"
note = "A proof does not verify where key is not one authorized for principal. The host registers the pair first for ada; a party proves ada with the pair second, which the host registered for nobody, and is refused at call."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "second"

[step.expect]
refuses = "call"
kind = "NOT_AUTHENTICATED"
