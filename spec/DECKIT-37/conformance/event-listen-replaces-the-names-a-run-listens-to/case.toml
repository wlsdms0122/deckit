case = 25
name = "event-listen-replaces-the-names-a-run-listens-to"
note = "From an event/listen on the run listens to the names given and to no other. A party of ada listens to ada:ping, then to ada:pong, and emits ping and pong; it is told pong alone."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "event/listen"
params = { names = ["ada:ping"] }

[[step]]
input = "ask"
party = "p"
method = "event/listen"
params = { names = ["ada:pong"] }

[[step]]
input = "ask"
party = "p"
method = "event/emit"
params = { name = "ping", args = [] }

[[step]]
input = "ask"
party = "p"
method = "event/emit"
params = { name = "pong", args = [] }

[[step]]
look = "told"
party = "p"

[step.expect]
answers = { messages = [{ method = "event/deliver", params = { name = "ada:pong", args = [] }, request = false }], closed = false }
