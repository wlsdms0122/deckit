case = 25
name = "a-record-read-with-no-key-is-refused"
note = "A request is refused as the rule it reads from refuses a mod's run: storage refuses a key that is not a string at call with INVALID_ARGUMENT. A party of ada asks record/read with no params."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "record/read"

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
