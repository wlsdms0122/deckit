case = 25
name = "a-record-read-with-no-key-is-refused"
note = "One rule refuses the params of every request a party asks, at call with INVALID_ARGUMENT: params left out are an empty table, which leaves out a key of the row. A party of ada asks record/read with no params."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "record/read"

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
