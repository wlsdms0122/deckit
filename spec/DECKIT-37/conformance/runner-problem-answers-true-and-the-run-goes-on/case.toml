case = 25
name = "runner-problem-answers-true-and-the-run-goes-on"
note = "runner/problem answers true, and a problem ends no run. A party asks it, is answered true, and its next request is answered as before."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "runner/problem"
params = { problem = "a part of it broke" }

[step.expect]
answers = true

[[step]]
input = "ask"
party = "p"
method = "record/keys"

[step.expect]
answers = []
