case = 25
name = "connection-end-answers-true"
note = "connection/end answers true. A party of ada, whose run has no connection, asks it for its lifecycle 0."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "connection/end"
params = { lifecycle = 0 }

[step.expect]
answers = true
