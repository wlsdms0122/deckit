case = 25
name = "the-first-party-goes-on-as-a-second-of-its-principal-is-refused"
note = "A second party of a principal that runs is refused and the first goes on. After the second party of ada was refused, the first asks the keys of its records and is answered."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "attach"
party = "q"
principal = "ada"
key = "first"

[step.expect]
refuses = "call"
kind = "ALREADY_RUNNING"

[[step]]
input = "ask"
party = "p"
method = "record/keys"

[step.expect]
answers = []
