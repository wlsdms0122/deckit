case = 25
name = "record-remove-answers-true-and-keeps-no-record-under-the-key"
note = "record/remove answers true once no record is kept under key. A party of ada writes a record under note and removes it, answered true; the keys of its records are none."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "record/write"
params = { key = "note", value = 1 }

[[step]]
input = "ask"
party = "p"
method = "record/remove"
params = { key = "note" }

[step.expect]
answers = true

[[step]]
input = "ask"
party = "p"
method = "record/keys"

[step.expect]
answers = []
