case = 25
name = "event-emit-with-a-name-that-is-no-string-is-refused"
note = "One rule refuses the params of every request a party asks, at call with INVALID_ARGUMENT: a key bound to a value of another kind. A party of ada asks event/emit with name a number."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "event/emit"
params = { name = 5, args = [] }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
