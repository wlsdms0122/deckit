case = 25
name = "the-host-closes-each-transport-connection-as-it-quits"
note = "A transport connection lasts no longer than the host app. A party of ada hosts a run; the host app quits and starts again, and the party's transport connection has closed."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
look = "told"
party = "p"
part = "closed"

[step.expect]
answers = true
