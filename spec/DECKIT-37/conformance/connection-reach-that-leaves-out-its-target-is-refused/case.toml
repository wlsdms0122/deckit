case = 25
name = "connection-reach-that-leaves-out-its-target-is-refused"
note = "One rule refuses the params of every request a party asks, at call with INVALID_ARGUMENT, before the rule it reads from judges anything of it: params that leave out a key of the row. A party of ada, whose job reaches no principal, asks connection/reach with no target, and is refused for its params and not for what its job holds."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "connection/reach"
params = { lifecycle = 0 }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
