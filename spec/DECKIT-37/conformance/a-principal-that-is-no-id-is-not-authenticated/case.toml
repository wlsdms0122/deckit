case = 25
name = "a-principal-that-is-no-id-is-not-authenticated"
note = "A proof does not verify where principal is no id, and it is answered as every other cause is. A party claims a principal with capitals and spaces, signs with a pair the host registered for ada, and is refused at call."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "Not An Id"
key = "first"

[step.expect]
refuses = "call"
kind = "NOT_AUTHENTICATED"
