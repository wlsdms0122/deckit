case = 25
name = "a-second-party-of-a-principal-that-runs-is-already-running"
note = "A principal has one run at a time, whatever hosts it. A party proves ada and hosts its run; a second party that proves ada with the same key is refused at call with ALREADY_RUNNING."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "attach"
party = "q"
principal = "ada"
key = "first"

[step.expect]
refuses = "call"
kind = "ALREADY_RUNNING"
