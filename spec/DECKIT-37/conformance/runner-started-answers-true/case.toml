case = 25
name = "runner-started-answers-true"
note = "runner/started answers true. A party that hosts a run of ada asks it with contributions that hold nothing."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "runner/started"
params = { contributions = { exportedIn = {}, awaits = {} } }

[step.expect]
answers = true
