case = 25
name = "an-event-of-one-principal-is-not-told-the-party-of-another"
note = "A run hears the events its principal may hear, and event/listen refuses no name: a user reaches no principal, so a name after another is listened to and told it never. A party of bob listens to ada:ping, answered true; a party of ada emits ping, and the party of bob was told nothing."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }, { id = "bob", name = "Bob Kahn" }]
keys = [{ principal = "ada", key = "first" }, { principal = "bob", key = "second" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "attach"
party = "q"
principal = "bob"
key = "second"

[[step]]
input = "ask"
party = "q"
method = "event/listen"
params = { names = ["ada:ping"] }

[step.expect]
answers = true

[[step]]
input = "ask"
party = "p"
method = "event/emit"
params = { name = "ping", args = [] }

[[step]]
look = "told"
party = "q"

[step.expect]
answers = { messages = [], closed = false }
