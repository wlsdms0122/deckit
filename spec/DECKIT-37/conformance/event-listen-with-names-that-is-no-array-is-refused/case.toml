case = 25
name = "event-listen-with-names-that-is-no-array-is-refused"
note = "One rule refuses the params of every request a party asks, at call with INVALID_ARGUMENT, those answered true among them: a key bound to a value of another kind. A party of ada asks event/listen with names a string."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "event/listen"
params = { names = "ada:ping" }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
