case = 25
name = "connection-let-go-answers-true"
note = "connection/let-go answers true. A party of ada, whose run has no connection, asks it of a function it holds none of."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "connection/let-go"
params = { connection = 1, number = 0, count = 1 }

[step.expect]
answers = true
