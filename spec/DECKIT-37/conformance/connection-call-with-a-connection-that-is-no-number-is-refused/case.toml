case = 25
name = "connection-call-with-a-connection-that-is-no-number-is-refused"
note = "One rule refuses the params of every request a party asks, at call with INVALID_ARGUMENT: a key bound to a value of another kind. A party of ada asks connection/call with connection a string."

[host]
base = "system"
api = "1.0.0"
users = [{ id = "ada", name = "Ada Lovelace" }]
keys = [{ principal = "ada", key = "first" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "ask"
party = "p"
method = "connection/call"
params = { connection = "1", number = 0, args = { value = [], references = [] } }

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
