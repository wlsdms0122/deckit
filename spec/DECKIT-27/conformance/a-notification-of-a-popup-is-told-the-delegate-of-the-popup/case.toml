case = 12
name = "a-notification-of-a-popup-is-told-the-delegate-of-the-popup"
note = "A notification of a popup's page is told the delegate of the popup, a page of its own. site-a, let have notifications, opens a popup on a press, which the host's delegate takes and gives the host's delegate, and the popup makes a notification."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { didReceiveNotification = true, openWindow = true }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "call"
mod = "mod-a"
member = "allow"
of = 2
origins = ["site-a"]
args = [[{ origin = "site-a", permission = "notifications" }]]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 4

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "title"

[step.expect]
answers = "Start"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
look = "delegated"
mod = "mod-a"
part = "method"

[step.expect]
answers = ["openWindow", "didReceiveNotification"]
