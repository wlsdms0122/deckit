<!doctype html><title>Start</title><script>const on = (n) => { n.onshow = () => document.title += ' show'; n.onerror = () => document.title += ' error'; n.onclose = () => document.title += ' close'; n.onclick = () => document.title += ' click'; return n; };navigator.permissions.query({ name: 'notifications' }).then((s) => document.title = Notification.permission + ' ' + s.state);</script>
