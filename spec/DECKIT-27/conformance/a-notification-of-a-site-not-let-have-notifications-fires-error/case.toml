case = 10
name = "a-notification-of-a-site-not-let-have-notifications-fires-error"
note = "Where the site does not have notifications, the notification's error fires and the mod is told nothing. mod-a shows site-a in its session main, which it let have nothing, and site-a makes a notification as it loads."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { didReceiveNotification = true }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "title"

[step.expect]
answers = "default error"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
look = "delegated"
mod = "mod-a"

[step.expect]
answers = []
