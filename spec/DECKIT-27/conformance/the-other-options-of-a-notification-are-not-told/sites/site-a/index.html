<!doctype html><title>Start</title><script>const on = (n) => { n.onshow = () => document.title += ' show'; n.onerror = () => document.title += ' error'; n.onclose = () => document.title += ' close'; n.onclick = () => document.title += ' click'; return n; };const o = { tag: 'a', icon: 'icon.png', data: { n: 1 }, requireInteraction: true }; on(new Notification('One', o)); const two = on(new Notification('Two', o)); two.addEventListener('show', () => setTimeout(() => document.title += ' ' + two.tag));</script>
