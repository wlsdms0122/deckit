<!doctype html><title>Start</title><iframe id="f" srcdoc="<p>frame</p>"></iframe><script>const on = (n) => { n.onshow = () => document.title += ' show'; n.onerror = () => document.title += ' error'; n.onclose = () => document.title += ' close'; n.onclick = () => document.title += ' click'; return n; };const f = document.getElementById('f'); f.onload = () => { const w = f.contentWindow; document.title = 'frame ' + w.Notification.permission; const n = new w.Notification('From the frame'); n.onshow = () => document.title += ' show'; n.onclick = () => document.title += ' click'; };</script>
