case = 28
name = "a-click-handed-back-fires-the-click-of-the-notification"
note = "click() hands a click back: the notification's click event fires in the document that made it. site-a, let have notifications, makes a notification as it loads, and the host's layer calls click of what didReceiveNotification was told."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { didReceiveNotification = true }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "call"
mod = "mod-a"
member = "allow"
of = 2
origins = ["site-a"]
args = [[{ origin = "site-a", permission = "notifications" }]]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "title"

[step.expect]
answers = "granted show"

[[step]]
input = "call"
mod = "mod-a"
member = "click"
delegated = 1

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "title"

[step.expect]
answers = "granted show click"
