<!doctype html><title>Start</title><script>const on = (n) => { n.onshow = () => document.title += ' show'; n.onerror = () => document.title += ' error'; n.onclose = () => document.title += ' close'; n.onclick = () => document.title += ' click'; return n; };document.title = Notification.permission; Notification.requestPermission((p) => document.title += ' callback ' + p).then((p) => document.title += ' ' + p);</script>
