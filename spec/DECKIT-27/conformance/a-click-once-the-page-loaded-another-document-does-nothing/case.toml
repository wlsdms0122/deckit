case = 28
name = "a-click-once-the-page-loaded-another-document-does-nothing"
note = "click() once the document that made the notification is gone does nothing, in the document the page shows now among it. site-a, let have notifications, makes a notification at each load, the page is loaded again, and the host's layer calls click of the first notification told."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { didReceiveNotification = true }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "call"
mod = "mod-a"
member = "allow"
of = 2
origins = ["site-a"]
args = [[{ origin = "site-a", permission = "notifications" }]]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "reload"
of = 4

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "title"

[step.expect]
answers = "load 2 show"

[[step]]
input = "call"
mod = "mod-a"
member = "click"
delegated = 1

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "title"

[step.expect]
answers = "load 2 show"

[[step]]
look = "delegated"
mod = "mod-a"

[step.expect]
answers = [{ method = "didReceiveNotification", args = [{ title = "Hi", body = "", silent = false }] }, { method = "didReceiveNotification", args = [{ title = "Hi", body = "", silent = false }] }]
