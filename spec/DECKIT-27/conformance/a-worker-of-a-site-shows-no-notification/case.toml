case = 12
name = "a-worker-of-a-site-shows-no-notification"
note = "A worker a site runs shows no notification: its permission is default and each notification made there fires its error. site-a, let have notifications, runs a worker that makes a notification."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { didReceiveNotification = true }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "call"
mod = "mod-a"
member = "allow"
of = 2
origins = ["site-a"]
args = [[{ origin = "site-a", permission = "notifications" }]]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "title"

[step.expect]
answers = "worker default error"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
input = "call"
mod = "mod-a"
member = "state"
of = 4
part = "loading"

[[step]]
look = "delegated"
mod = "mod-a"

[step.expect]
answers = []
