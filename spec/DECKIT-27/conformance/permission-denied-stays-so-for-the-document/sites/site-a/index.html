<!doctype html><title>Start</title><button id="b" style="position:fixed;inset:0">press</button><script>const on = (n) => { n.onshow = () => document.title += ' show'; n.onerror = () => document.title += ' error'; n.onclose = () => document.title += ' close'; n.onclick = () => document.title += ' click'; return n; };Notification.requestPermission().then((p) => document.title = p); document.getElementById('b').onclick = () => { document.title += ' ' + Notification.permission; on(new Notification('Hi')); };</script>
