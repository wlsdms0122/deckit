case = 5
name = "a-key-for-a-command-its-mod-does-not-declare-is-left-out"
note = "An entry whose command its mod does not declare to deckit/commands is left out. mod-b declares a key for month, and no command month."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/keys", "deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/keys"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true
part = "keys"

[step.expect]
answers = []
