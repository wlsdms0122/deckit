case = 5
name = "a-second-key-for-one-command-is-left-out"
note = "A mod's second entry for a command it declared a key for already is left out. mod-b declares a key for today on ctrl+alt+t, then another on ctrl+alt+y."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/keys", "deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/keys"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true
part = "keys"

[step.expect]
answers = [{ mod = { id = "mod-b", name = "MOD B" }, command = "today", title = "Show Today", scope = "app", defaultKeystroke = { code = "KeyT", meta = false, control = true, alt = true, shift = false }, keystroke = { code = "KeyT", meta = false, control = true, alt = true, shift = false }, chord = "⌃⌥T", changed = false, active = true, issues = [] }]
