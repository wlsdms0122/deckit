case = 6
name = "a-key-whose-keystroke-is-no-chord-is-left-out"
note = "An entry whose keystroke is not a spec is left out: a spec names one key. mod-b declares a key for today on ctrl+a+b."

[host]
base = "shell"
api = "1.0.0"
owners = ["deckit/keys", "deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/keys"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true
part = "keys"

[step.expect]
answers = []
