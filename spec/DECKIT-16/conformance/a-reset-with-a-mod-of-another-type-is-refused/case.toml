case = 6
name = "a-reset-with-a-mod-of-another-type-is-refused"
note = "reset is refused at call with kind INVALID_ARGUMENT where mod is not a string. mod-a resets the key of today with the mod 1."

[host]
base = "shell"
api = "1.0.0"
owners = ["deckit/keys", "deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/keys"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "reset"
handed = true
args = [1, "today"]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
