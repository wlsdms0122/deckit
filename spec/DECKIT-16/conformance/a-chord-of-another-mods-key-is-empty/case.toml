case = 5
name = "a-chord-of-another-mods-key-is-empty"
note = "chordOf answers an empty string for a command of which the client's own mod declares no key. mod-b declares a key for today, and mod-a asks for the chord of today."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/keys", "deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/keys"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "chordOf"
handed = true
args = ["today"]

[step.expect]
answers = ""
