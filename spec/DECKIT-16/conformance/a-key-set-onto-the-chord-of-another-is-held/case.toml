case = 5
name = "a-key-set-onto-the-chord-of-another-is-held"
note = "A key set onto a chord a key of its scope has is held, and does not run. mod-b declares keys for today on ctrl+alt+t and week on ctrl+alt+w, and mod-a sets week to ctrl+alt+t."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/keys", "deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/keys"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "set"
handed = true
args = ["mod-b", "week", { code = "KeyT", meta = false, control = true, alt = true, shift = false }]
part = "active"

[step.expect]
answers = false
