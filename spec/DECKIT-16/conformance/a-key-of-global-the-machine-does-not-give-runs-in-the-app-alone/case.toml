case = 20
name = "a-key-of-global-the-machine-does-not-give-runs-in-the-app-alone"
note = "mod-a, marked system, lists the keys, which answers once the owner has taken their chords. mod-b declares the command today and a key for it on ctrl+alt+t; its code opens https://said.test/ran/<id> outside the app as a command of its is run. The key is of the scope global, and the machine does not give the host app ctrl+alt+t outside it, so the key is unavailable. The person presses it in another app, and nothing runs; in the host app, and today runs."

[host]
base = "shell"
api = "1.0.0"
owners = ["deckit/keys", "deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]
unavailable = [{ code = "KeyT", control = true, alt = true }]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/keys"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true

[[step]]
input = "key"
keystroke = { code = "KeyT", control = true, alt = true }
outside = true

[[step]]
look = "opened"

[step.expect]
answers = []

[[step]]
input = "key"
keystroke = { code = "KeyT", control = true, alt = true }

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/ran/today", activates = true }]
