case = 5
name = "a-set-with-a-modifier-of-another-type-is-refused"
note = "set is refused at call with kind INVALID_ARGUMENT where a modifier of keystroke is not a boolean, never read as one. mod-a sets the key of today to ctrl+alt+k with alt the string \"yes\"."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/keys", "deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/keys"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "set"
handed = true
args = ["mod-b", "today", { code = "KeyK", control = true, alt = "yes" }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
