case = 5
name = "a-key-set-to-its-default-is-not-changed"
note = "A key set to its default keystroke is not changed. mod-a sets the key of today to ctrl+alt+t, its default."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/keys", "deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/keys"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "set"
handed = true
args = ["mod-b", "today", { code = "KeyT", meta = false, control = true, alt = true, shift = false }]
part = "changed"

[step.expect]
answers = false
