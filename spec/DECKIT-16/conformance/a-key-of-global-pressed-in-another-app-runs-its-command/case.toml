case = 20
name = "a-key-of-global-pressed-in-another-app-runs-its-command"
note = "mod-a, marked system, lists the keys, which answers once the owner has taken their chords. mod-b declares the command today and a key for it on ctrl+alt+t; its code opens https://said.test/ran/<id> outside the app as a command of its is run. The key is of the scope global, and mod-b is granted system.global-keys. The person presses ctrl+alt+t in another app in front: today runs."

[host]
base = "shell"
api = "1.0.0"
owners = ["deckit/keys", "deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/keys"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true

[[step]]
input = "key"
keystroke = { code = "KeyT", control = true, alt = true }
outside = true

[[step]]
look = "opened"

[step.expect]
answers = [{ url = "https://said.test/ran/today", activates = true }]
