case = 5
name = "a-key-of-a-mod-not-granted-its-scope-is-left-out"
note = "An entry is left out where its mod is not granted the permission of its scope, deckit.app-keys for app. mod-b asks for no permission and declares a key for today."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/keys", "deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/keys"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true
part = "keys"

[step.expect]
answers = []
