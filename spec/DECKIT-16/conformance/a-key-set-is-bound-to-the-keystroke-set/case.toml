case = 6
name = "a-key-set-is-bound-to-the-keystroke-set"
note = "set(mod, command, keystroke) binds the key to keystroke and answers it as list answers a key, changed. mod-a sets the key of today, ctrl+alt+t by default, to ctrl+alt+k."

[host]
base = "shell"
api = "1.0.0"
owners = ["deckit/keys", "deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/keys"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "set"
handed = true
args = ["mod-b", "today", { code = "KeyK", meta = false, control = true, alt = true, shift = false }]

[step.expect]
answers = { mod = { id = "mod-b", name = "MOD B" }, command = "today", title = "Show Today", scope = "app", defaultKeystroke = { code = "KeyT", meta = false, control = true, alt = true, shift = false }, keystroke = { code = "KeyK", meta = false, control = true, alt = true, shift = false }, chord = "⌃⌥K", changed = true, active = true, issues = [] }
