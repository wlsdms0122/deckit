case = 6
name = "a-set-of-a-key-the-mod-does-not-declare-is-refused"
note = "set is refused at call with kind NOT_DECLARED where the mod declares no key for the command. mod-b declares a key for today, and mod-a sets one for week."

[host]
base = "shell"
api = "1.0.0"
owners = ["deckit/keys", "deckit/commands"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/keys"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "set"
handed = true
args = ["mod-b", "week", { code = "KeyK", meta = false, control = true, alt = true, shift = false }]

[step.expect]
refuses = "call"
kind = "NOT_DECLARED"
