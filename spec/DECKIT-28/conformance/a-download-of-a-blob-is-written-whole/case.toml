case = 14
name = "a-download-of-a-blob-is-written-whole"
note = "A download of an address the page made, a blob, is written whole. mod-a shows site-a, whose page on a press downloads a blob of the text hello as b.txt, and it is pressed."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { shouldDownload = true }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 3

[[step]]
look = "downloaded"

[step.expect]
answers = [{ name = "b.txt", body = "aGVsbG8=" }]
