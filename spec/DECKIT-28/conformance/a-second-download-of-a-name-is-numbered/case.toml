case = 14
name = "a-second-download-of-a-name-is-numbered"
note = "A name a file of the folder already has is numbered before its extension, from 2, and the downloads are listed newest first. mod-a shows site-a, whose page is a link to download /file.txt, and it is pressed twice."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { shouldDownload = true }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 3

[[step]]
input = "activate"
mod = "mod-a"
of = 3

[[step]]
input = "call"
mod = "mod-a"
member = "downloads.list"
handle = "web"
part = "name"

[step.expect]
answers = ["file (2).txt", "file.txt"]

[[step]]
look = "downloaded"

[step.expect]
answers = [{ name = "file (2).txt", body = "aGVsbG8=" }, { name = "file.txt", body = "aGVsbG8=" }]
