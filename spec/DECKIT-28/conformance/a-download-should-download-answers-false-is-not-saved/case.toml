case = 14
name = "a-download-should-download-answers-false-is-not-saved"
note = "Only false from shouldDownload refuses a download: nothing of it is written or listed. mod-a shows site-a, whose page is a link to download /file.txt, the host's delegate answers shouldDownload false, and it is pressed."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { shouldDownload = false }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 3

[[step]]
input = "call"
mod = "mod-a"
member = "downloads.list"
handle = "web"

[step.expect]
answers = []

[[step]]
look = "downloaded"

[step.expect]
answers = []
