case = 11
name = "a-mod-lists-no-download-of-another"
note = "One mod never reads another's downloads. mod-a shows site-a, whose page is a link to download /file.txt, and it is pressed; mod-b lists its downloads."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
sites = ["site-a"]
delegate = { shouldDownload = true }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 3

[[step]]
input = "call"
mod = "mod-b"
member = "downloads.list"
handle = "web"

[step.expect]
answers = []
