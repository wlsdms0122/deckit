case = 11
name = "a-download-refused-is-not-told"
note = "A download refused is not told to the mod. mod-a listens with downloads.onChange, shows site-a, whose page is a link to download /file.txt, the host's delegate answers shouldDownload false, and it is pressed."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { shouldDownload = false }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "call"
mod = "mod-a"
member = "downloads.onChange"
handle = "web"
listener = true

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 4

[[step]]
look = "heard"
mod = "mod-a"

[step.expect]
answers = []
