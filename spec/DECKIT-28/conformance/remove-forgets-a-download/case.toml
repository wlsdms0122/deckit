case = 14
name = "remove-forgets-a-download"
note = "remove answers true and the download is no longer listed. mod-a shows site-a, whose page is a link to download /file.txt, and it is pressed; mod-a removes it."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { shouldDownload = true }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 3

[[step]]
input = "call"
mod = "mod-a"
member = "downloads.list"
handle = "web"
part = "id"

[[step]]
input = "call"
mod = "mod-a"
member = "downloads.remove"
handle = "web"
answered = 5

[step.expect]
answers = true

[[step]]
input = "call"
mod = "mod-a"
member = "downloads.list"
handle = "web"

[step.expect]
answers = []
