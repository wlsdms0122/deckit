case = 11
name = "downloads-are-kept-across-starts"
note = "The downloads are kept as the host app quits and starts again. mod-a shows site-a, whose page is a link to download /file.txt, and it is pressed; the host app quits and starts again."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { shouldDownload = true }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 3

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "downloads.list"
handle = "web"
part = "name"

[step.expect]
answers = ["file.txt"]

[[step]]
input = "call"
mod = "mod-a"
member = "downloads.list"
handle = "web"
part = "state"

[step.expect]
answers = ["finished"]
