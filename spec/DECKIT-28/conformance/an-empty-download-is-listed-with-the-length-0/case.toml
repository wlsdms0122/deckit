case = 11
name = "an-empty-download-is-listed-with-the-length-0"
note = "expected is the length the answer says it holds, 0 for an empty one. mod-a shows site-a, whose page is a link to /f, an empty attachment, and it is pressed."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { shouldDownload = true }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 3

[[step]]
input = "call"
mod = "mod-a"
member = "downloads.list"
handle = "web"
part = "expected"

[step.expect]
answers = [0]

[[step]]
input = "call"
mod = "mod-a"
member = "downloads.list"
handle = "web"
part = "received"

[step.expect]
answers = [0]
