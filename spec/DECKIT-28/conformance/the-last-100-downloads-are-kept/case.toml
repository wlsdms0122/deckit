case = 10
name = "the-last-100-downloads-are-kept"
note = "The web engine keeps the last 100 downloads of a mod to have started, and no older one that ended. mod-a shows site-a, whose script lays 101 frames at /f, an attachment c.txt, each a download, numbered as it is saved."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { shouldDownload = true }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "call"
mod = "mod-a"
member = "downloads.list"
handle = "web"
part = "name"

