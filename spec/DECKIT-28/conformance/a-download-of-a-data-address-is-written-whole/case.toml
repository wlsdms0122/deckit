case = 14
name = "a-download-of-a-data-address-is-written-whole"
note = "A link with download to a data address downloads what the address holds. mod-a shows site-a, whose page is a link with download d.txt to data:text/plain,hello, and it is pressed."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { shouldDownload = true }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 3

[[step]]
look = "downloaded"

[step.expect]
answers = [{ name = "d.txt", body = "aGVsbG8=" }]
