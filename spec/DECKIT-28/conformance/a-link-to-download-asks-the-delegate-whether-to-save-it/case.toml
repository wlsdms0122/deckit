case = 11
name = "a-link-to-download-asks-the-delegate-whether-to-save-it"
note = "A download a page starts is asked of the delegate of the page, shouldDownload({ url, name, mimeType, expected }). mod-a shows site-a, whose page is a link with download b.txt to a text of 5 bytes, and it is pressed."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { shouldDownload = true }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 3

[[step]]
look = "delegated"
mod = "mod-a"

[step.expect]
answers = [{ method = "shouldDownload", args = [{ url = "site-a/file.txt", name = "b.txt", mimeType = "text/plain", expected = 5 }] }]
