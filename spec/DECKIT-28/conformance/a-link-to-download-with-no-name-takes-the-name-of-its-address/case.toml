case = 11
name = "a-link-to-download-with-no-name-takes-the-name-of-its-address"
note = "A link with download and no name downloads under the last segment of its address. mod-a shows site-a, whose page is a link with an empty download to /file.txt, and it is pressed."

[host]
base = "web"
api = "1.0.0"
ship = ["mod-a"]
sites = ["site-a"]
delegate = { shouldDownload = true }

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "session"
handle = "web"
args = ["main"]

[[step]]
input = "show"
mod = "mod-a"
session = "main"
site = "site-a/index.html"

[[step]]
input = "activate"
mod = "mod-a"
of = 3

[[step]]
input = "call"
mod = "mod-a"
member = "downloads.list"
handle = "web"
part = "name"

[step.expect]
answers = ["file.txt"]
