case = 4
name = "a-record-under-a-key-of-another-type-is-refused"
note = "A record's key is a string: one of another type is refused at call with kind INVALID_ARGUMENT, and never read as a string. mod-a sets the record under the key 1."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "storage.records.set"
args = [1, 1]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
