case = 4
name = "a-record-under-what-is-no-key-is-refused"
note = "A record's key is a key as the storage grammar gives it: one that is not is refused at call with kind KEY. mod-a sets the record Note."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "storage.records.set"
args = ["Note", 1]

[step.expect]
refuses = "call"
kind = "KEY"
