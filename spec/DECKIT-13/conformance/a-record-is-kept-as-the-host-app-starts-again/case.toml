case = 4
name = "a-record-is-kept-as-the-host-app-starts-again"
note = "Records are kept across starts of the host app. mod-a sets note, the app quits and starts again, and get of note answers what was set."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "storage.records.set"
args = ["note", { text = "a", n = [1, 2] }]

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "storage.records.get"
args = ["note"]

[step.expect]
answers = { text = "a", n = [1, 2] }
