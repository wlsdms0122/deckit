case = 4
name = "the-usage-of-an-id-no-mod-is-listed-under-is-refused"
note = "mods.usage reads what a mod with a bundle has stored: an id no bundle is listed under is refused at call with kind NOT_INSTALLED. mod-a asks the usage of mod-b, which is not installed."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.usage"
args = ["mod-b"]

[step.expect]
refuses = "call"
kind = "NOT_INSTALLED"
