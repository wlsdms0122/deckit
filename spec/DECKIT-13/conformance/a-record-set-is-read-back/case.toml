case = 4
name = "a-record-set-is-read-back"
note = "A record is kept under its key and read back as the value it was set to. mod-a sets the record note to a table, and get of note answers it."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "storage.records.set"
args = ["note", { text = "a", n = [1, 2] }]

[[step]]
input = "call"
mod = "mod-a"
member = "storage.records.get"
args = ["note"]

[step.expect]
answers = { text = "a", n = [1, 2] }
