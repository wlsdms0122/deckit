case = 4
name = "the-keys-of-the-records-are-answered-in-order"
note = "keys answers the key of each record the mod keeps, in the order of their code points. mod-a sets b and then a, and keys answers a and b."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "storage.records.set"
args = ["b", 1]

[[step]]
input = "call"
mod = "mod-a"
member = "storage.records.set"
args = ["a", 2]

[[step]]
input = "call"
mod = "mod-a"
member = "storage.records.keys"

[step.expect]
answers = ["a", "b"]
