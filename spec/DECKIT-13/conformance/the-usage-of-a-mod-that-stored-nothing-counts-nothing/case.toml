case = 4
name = "the-usage-of-a-mod-that-stored-nothing-counts-nothing"
note = "mods.usage of a mod that stored nothing answers nothing in each place. mod-a's usage of mod-b, which stored nothing, answers no files, no records, no values and no names."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.usage"
args = ["mod-b"]

[step.expect]
answers = { data = { count = 0, capped = false, hidden = false }, records = { count = 0, hidden = false }, values = { count = 0 }, kept = [] }
