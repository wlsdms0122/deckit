case = 4
name = "what-a-mod-stored-is-erased-as-it-is-removed-with-erase"
note = "remove with erase true erases what the mod stored, its records and its values among it. mod-a installs mod-b, which sets a record and a value; mod-a removes it with erase true and installs it again, and both read as their fallbacks."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.install"
folders = ["mod-b"]
part = "id"

[step.expect]
answers = "mod-b"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-b"]

[[step]]
input = "call"
mod = "mod-b"
member = "storage.records.set"
args = ["note", 1]

[[step]]
input = "call"
mod = "mod-b"
member = "storage.values.set"
args = ["theme", "dark"]

[[step]]
input = "call"
mod = "mod-a"
member = "mods.remove"
args = ["mod-b", true]

[step.expect]
answers = { erased = true }

[[step]]
input = "call"
mod = "mod-a"
member = "mods.install"
folders = ["mod-b"]
part = "id"

[step.expect]
answers = "mod-b"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.launch"
args = ["mod-b"]

[[step]]
input = "call"
mod = "mod-b"
member = "storage.records.get"
args = ["note", "none"]

[step.expect]
answers = "none"

[[step]]
input = "call"
mod = "mod-b"
member = "storage.values.get"
args = ["theme", "none"]

[step.expect]
answers = "none"
