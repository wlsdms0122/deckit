case = 4
name = "a-record-removed-reads-as-its-fallback"
note = "remove takes the record under its key away. mod-a sets note, removes it, and get of note with the fallback none answers none."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "storage.records.set"
args = ["note", 1]

[[step]]
input = "call"
mod = "mod-a"
member = "storage.records.remove"
args = ["note"]

[[step]]
input = "call"
mod = "mod-a"
member = "storage.records.get"
args = ["note", "none"]

[step.expect]
answers = "none"
