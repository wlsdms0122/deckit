case = 1
name = "a-second-folder-shipped-under-a-name-is-passed-over"
note = "A folder shipped under a name that a folder shipped before it is listed under is passed over, so of mod-c shipped from mod-a and then from mod-b, the first is installed."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
look = "mods"

[step.expect]
answers = ["mod-c"]

[[step]]
look = "mod"
mod = "mod-c"
part = "version"

[step.expect]
answers = "1.0.0"

