case = 3
name = "remove-takes-the-installed-bundle-away"
note = "remove takes the installed bundle listed under id away and answers whether what the mod stored was erased, false where erase is false. mod-a removes mod-b, which the host ships."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.remove"
args = ["mod-b", false]

[step.expect]
answers = { erased = false }

[[step]]
look = "mods"

[step.expect]
answers = ["mod-a"]
