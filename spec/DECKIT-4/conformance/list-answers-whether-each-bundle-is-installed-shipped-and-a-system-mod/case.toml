case = 3
name = "list-answers-whether-each-bundle-is-installed-shipped-and-a-system-mod"
note = "Each entry list answers says whether its bundle is installed, shipped and a system mod, so of mod-a, shipped and marked system, mod-b, shipped, and mod-c, read in place, only mod-a is a system mod and mod-c is neither installed nor shipped."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a", "mod-b"]
system = ["mod-a"]
sources = ["mod-c"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.list"
part = "installed"

[step.expect]
answers = [true, true, false]

[[step]]
input = "call"
mod = "mod-a"
member = "mods.list"
part = "shipped"

[step.expect]
answers = [true, true, false]

[[step]]
input = "call"
mod = "mod-a"
member = "mods.list"
part = "system"

[step.expect]
answers = [true, false, false]
