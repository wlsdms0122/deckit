case = 3
name = "a-dry-run-of-a-path-that-is-not-absolute-is-refused-at-read"
note = "folder is an absolute path, and a string that is not one names no folder, which refuses install, a dry run too, at read with NOT_LOADABLE. mod-a asks a dry run of mod-b, a path that does not begin with a slash."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.install"
args = ["mod-b", { dryRun = true }]

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
