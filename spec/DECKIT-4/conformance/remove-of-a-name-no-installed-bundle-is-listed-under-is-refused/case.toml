case = 3
name = "remove-of-a-name-no-installed-bundle-is-listed-under-is-refused"
note = "remove is refused at call with NOT_INSTALLED where no installed bundle is listed under id, as for mod-z."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.remove"
args = ["mod-z", false]

[step.expect]
refuses = "call"
kind = "NOT_INSTALLED"
