case = 1
name = "a-bundle-read-in-place-hides-a-shipped-one-of-its-name"
note = "Bundles read in place are found before the installed ones, and the first found under a name hides the rest, so mod-a read in place at 2.0.0 is the one held, and mod-a shipped at 1.0.0 is not listed."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]
sources = ["mod-b"]

[[step]]
input = "start"

[[step]]
look = "mods"

[step.expect]
answers = ["mod-a"]

[[step]]
look = "mod"
mod = "mod-a"
part = "version"

[step.expect]
answers = "2.0.0"

