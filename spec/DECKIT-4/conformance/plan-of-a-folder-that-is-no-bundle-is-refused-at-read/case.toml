case = 3
name = "plan-of-a-folder-that-is-no-bundle-is-refused-at-read"
note = "A folder that is not a bundle refuses plan at read with NOT_LOADABLE. mod-a plans a folder that holds no manifest."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.plan"
folders = ["mod-b"]

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
