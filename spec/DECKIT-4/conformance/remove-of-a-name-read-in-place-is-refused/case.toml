case = 3
name = "remove-of-a-name-read-in-place-is-refused"
note = "remove is refused at call with READ_IN_PLACE where a bundle read in place is listed under id, so the folder its author works in is never deleted. mod-b is read in place."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]
sources = ["mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.remove"
args = ["mod-b", false]

[step.expect]
refuses = "call"
kind = "READ_IN_PLACE"
