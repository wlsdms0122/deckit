case = 1
name = "shipped-bundles-are-listed-in-the-order-shipped"
note = "What a host ships is installed in the order shipped, and installed bundles are listed in the order each was first installed, so mod-c, mod-a, mod-b shipped in that order are listed in that order."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-c", "mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
look = "mods"

[step.expect]
answers = ["mod-c", "mod-a", "mod-b"]

