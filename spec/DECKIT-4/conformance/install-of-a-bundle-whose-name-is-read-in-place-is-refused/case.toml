case = 3
name = "install-of-a-bundle-whose-name-is-read-in-place-is-refused"
note = "install is refused at call with READ_IN_PLACE where a bundle read in place is listed under the same name, which would hide the bundle installed. mod-b is read in place, and mod-a installs another folder holding mod-b."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-a"]
system = ["mod-a"]
sources = ["mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "mods.install"
folders = ["mod-b-copy"]

[step.expect]
refuses = "call"
kind = "READ_IN_PLACE"
