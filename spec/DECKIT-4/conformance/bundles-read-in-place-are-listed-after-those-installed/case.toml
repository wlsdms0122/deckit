case = 1
name = "bundles-read-in-place-are-listed-after-those-installed"
note = "A bundle read in place is not installed, and the names of bundles not installed come after the installed ones, so mod-a read in place is listed after mod-b shipped."

[host]
base = "system"
api = "1.0.0"
ship = ["mod-b"]
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mods"

[step.expect]
answers = ["mod-b", "mod-a"]

