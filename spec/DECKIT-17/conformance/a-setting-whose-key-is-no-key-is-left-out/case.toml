case = 5
name = "a-setting-whose-key-is-no-key-is-left-out"
note = "An entry whose key is not a setting key is left out. mod-b declares a setting of the key \"tab size\"."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/configuration"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/configuration"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true
part = "mods"

[step.expect]
answers = []
