case = 5
name = "a-setting-with-a-choice-it-does-not-take-is-left-out"
note = "An entry is left out where a const of its oneOf is a value it does not take. mod-b declares theme, a string, with a choice of the const 1."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/configuration"]
ship = ["mod-a", "mod-b"]
