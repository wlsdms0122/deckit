case = 5
name = "a-setting-of-a-type-of-another-word-is-left-out"
note = "An entry whose type is not string, number or boolean is left out. mod-b declares tab-size of the type integer."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/configuration"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/configuration"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true
part = "mods"

[step.expect]
answers = []
