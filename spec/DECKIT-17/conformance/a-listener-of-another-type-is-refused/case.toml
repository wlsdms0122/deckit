case = 5
name = "a-listener-of-another-type-is-refused"
note = "onChange is refused at call with kind INVALID_ARGUMENT where listener is not a function. mod-a hears with the string x."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/configuration"]
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/configuration"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "onChange"
handed = true
args = ["x"]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
