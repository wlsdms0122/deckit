case = 5
name = "a-set-of-another-mods-setting-it-does-not-declare-is-refused"
note = "setOf is refused at call with kind NOT_DECLARED where the mod declares no setting of the key. mod-b declares theme, and mod-a sets its tab-size."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/configuration"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/configuration"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "setOf"
handed = true
args = ["mod-b", "tab-size", 2]

[step.expect]
refuses = "call"
kind = "NOT_DECLARED"
