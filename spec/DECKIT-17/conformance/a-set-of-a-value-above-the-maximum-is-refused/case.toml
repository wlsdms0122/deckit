case = 5
name = "a-set-of-a-value-above-the-maximum-is-refused"
note = "set is refused at call with kind INVALID_ARGUMENT where value is above the setting's maximum. mod-a sets tab-size, up to 8, to 9."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/configuration"]
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/configuration"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "set"
handed = true
args = ["tab-size", 9]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
