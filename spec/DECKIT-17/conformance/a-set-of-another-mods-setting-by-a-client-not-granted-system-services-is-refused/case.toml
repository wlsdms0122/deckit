case = 5
name = "a-set-of-another-mods-setting-by-a-client-not-granted-system-services-is-refused"
note = "setOf is refused at call with kind NOT_PERMITTED for a client not granted deckit.system-services, which reads and sets its own mod's settings alone."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/configuration"]
ship = ["mod-a", "mod-b"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/configuration"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "setOf"
handed = true
args = ["mod-b", "theme", "dark"]

[step.expect]
refuses = "call"
kind = "NOT_PERMITTED"
