case = 5
name = "a-setting-set-with-no-value-reads-as-its-default-again"
note = "set(key) with value left out unsets the setting, which reads as its default again. mod-a sets tab-size to 2, then sets it with no value."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/configuration"]
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/configuration"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "set"
handed = true
args = ["tab-size", 2]

[[step]]
input = "call"
mod = "mod-a"
member = "set"
handed = true
args = ["tab-size"]

[step.expect]
answers = 4
