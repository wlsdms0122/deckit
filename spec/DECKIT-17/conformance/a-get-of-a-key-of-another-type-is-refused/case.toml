case = 5
name = "a-get-of-a-key-of-another-type-is-refused"
note = "get is refused at call with kind INVALID_ARGUMENT where key is not a string. mod-a gets 4."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/configuration"]
ship = ["mod-a"]
system = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/configuration"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "get"
handed = true
args = [4]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
