case = 27
name = "a-press-on-the-item-shows-the-view-for-the-seat-and-a-second-puts-it-away"
note = "The host ships the status bar and the seats mod by their ids, on the base shell, 1280 by 800, under a bar 32 high. ada sits at s1 and bob at s2, and bob leaves. ada presses the item: the view stands under it on the screen of s1 alone. ada presses the item again, and the view is put away."

[host]
base = "shell"
api = "1.0.0"
owners = ["deckit/commands"]
mods = ["status-bar", "seats"]
bar = 32
users = [{ id = "ada", name = "Ada Lovelace" }, { id = "bob", name = "Bob Hope" }]
keys = [{ principal = "ada", key = "first" }, { principal = "bob", key = "second" }]

[[step]]
input = "start"

[[step]]
input = "attach"
party = "p"
principal = "ada"
key = "first"

[[step]]
input = "attach"
party = "q"
principal = "bob"
key = "second"

[[step]]
input = "detach"
party = "q"

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "desktop" }

[[step]]
input = "ask"
party = "p"
method = "seat/read"
params = { of = "window", window = "w1" }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "1.2", button = 0 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "1.2", button = 0 }

[[step]]
look = "windows"
seat = "s1"
[step.expect]
answers = [{ mod = "status-bar", name = "bar", level = "panel", frame = { x = 1225, y = 2, width = 47, height = 28 }, key = false, minimized = false }, { mod = "seats", name = "seats", level = "panel", frame = { x = 990, y = 40, width = 280, height = 80 }, key = false, minimized = false }]

[[step]]
look = "windows"
seat = "local"
[step.expect]
answers = [{ mod = "status-bar", name = "bar", level = "panel", frame = { x = 1225, y = 2, width = 47, height = 28 }, key = false, minimized = false }]

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "down", ref = "1.2", button = 0 }

[[step]]
input = "ask"
party = "p"
method = "seat/input"
params = { event = "pointer", type = "up", ref = "1.2", button = 0 }

[[step]]
look = "windows"
seat = "s1"
[step.expect]
answers = [{ mod = "status-bar", name = "bar", level = "panel", frame = { x = 1225, y = 2, width = 47, height = 28 }, key = false, minimized = false }]
