case = 1
name = "a-contributed-entry-that-is-no-table-is-refused"
note = "contributes maps an interface to an array of tables. An entry that is an integer refuses the bundle at read."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
