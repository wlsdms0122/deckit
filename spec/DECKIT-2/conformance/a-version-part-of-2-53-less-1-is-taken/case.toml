case = 1
name = "a-version-part-of-2-53-less-1-is-taken"
note = "A version's part is a number of at most 2^53 - 1. A version of 9007199254740991.0.0 is taken, and answered as written."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"
part = "version"

[step.expect]
answers = "9007199254740991.0.0"
