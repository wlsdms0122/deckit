case = 1
name = "a-manifest-writing-no-id-is-refused"
note = "id is required. A manifest that writes none refuses the bundle at read, which is listed under its folder's name."

[host]
base = "system"
api = "1.0.0"
sources = ["notes"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "notes"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
