case = 1
name = "a-bare-dotted-key-is-refused"
note = "A bare key holds no \".\"; a.b = 1 is not read as a table inside a table but refuses the bundle at read."

[host]
base = "system"
api = "1.0.0"
fields = ["extra"]
sources = ["notes"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "notes"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
