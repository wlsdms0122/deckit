case = 1
name = "an-array-header-at-a-table-a-header-opened-is-refused"
note = "An array-header whose path holds a table a table-header opened refuses the bundle at read."

[host]
base = "system"
api = "1.0.0"
fields = ["extra"]
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
