case = 1
name = "a-permission-id-past-u-ffff-comes-after-one-below-it"
note = "Permissions not usable come by their ids compared as Unicode scalar values: U+FF21 before U+1D400, which a comparison of UTF-16 code units would put first."

[host]
base = "system"
api = "1.0.0"
sources = ["notes"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "notes"
part = "permissions"

[step.expect]
answers = [
    { id = "\uff21", reason = "Wide.", usable = false },
    { id = "\U0001d400", reason = "Bold.", usable = false },
]
