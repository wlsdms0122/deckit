case = 1
name = "a-folder-whose-name-begins-with-a-dot-is-passed-over"
note = "Where the system looks through a folder of bundles it passes over every name that begins with a dot, and lists nothing for it, though .mod-b is a bundle."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-a", ".mod-b"]

[[step]]
input = "start"

[[step]]
look = "mods"

[step.expect]
answers = ["mod-a"]
