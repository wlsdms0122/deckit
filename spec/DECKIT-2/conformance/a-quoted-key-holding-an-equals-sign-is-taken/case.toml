case = 1
name = "a-quoted-key-holding-an-equals-sign-is-taken"
note = "A key is the string it writes, so a quoted key may hold \"=\". The host adds the field ex=tra, and a manifest writing \"ex=tra\" = 1 is taken with the field."

[host]
base = "system"
api = "1.0.0"
fields = ["ex=tra"]
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"
part = "fields"

[step.expect.answers]
"ex=tra" = 1
