case = 1
name = "a-blank-reason-is-refused"
note = "A permission asked for maps to a string, not blank, that says why. One of white space alone refuses the bundle at read."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
