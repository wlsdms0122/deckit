case = 1
name = "a-bundle-whose-manifest-does-not-read-is-listed-under-its-folder-name"
note = "A bundle whose manifest's text does not read is listed under its folder's name, though the text writes an id."

[host]
base = "system"
api = "1.0.0"
sources = ["shelf"]

[[step]]
input = "start"

[[step]]
look = "mods"

[step.expect]
answers = ["shelf"]

[[step]]
look = "mod"
mod = "shelf"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
