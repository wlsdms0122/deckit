case = 1
name = "a-main-holding-a-backslash-is-refused"
note = "A path's segment holds no backslash. A main of a\\b.js, naming a file of that name in the bundle, refuses the bundle at read."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
