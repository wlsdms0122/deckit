case = 1
name = "a-quoted-key-holding-an-equals-sign-is-refused"
note = "The key of a key-value is the text before the first \"=\" of its line, so a quoted key there holding \"=\" refuses the bundle at read."

[host]
base = "system"
api = "1.0.0"
fields = ["extra"]
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
