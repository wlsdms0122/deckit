case = 1
name = "permissions-not-usable-come-by-their-ids-as-scalar-values"
note = "Permissions no one defines come by their ids compared as Unicode scalar values: U+00D0 before U+212B, which normalizes to U+00C5."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"
part = "permissions"

[step.expect]
answers = [
    { id = "\u00d0", reason = "Eth.", usable = false },
    { id = "\u212b", reason = "Angstrom.", usable = false },
]
