case = 1
name = "a-major-below-0-is-refused"
note = "A major is an integer at least 0. A use at -1 refuses the bundle at read."

[host]
base = "system"
api = "1.0.0"
sources = ["notes"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "notes"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
