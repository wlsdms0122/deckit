case = 1
name = "a-permission-nothing-defines-is-taken-and-not-usable"
note = "A permission that neither the system, a layer nor the host defines is taken and is not usable. Its reach is told by its id, and its reason is answered without the white space at its ends."

[host]
base = "system"
api = "1.0.0"
sources = ["notes"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "notes"
part = "permissions"

[step.expect]
answers = [
    { id = "system.case-camera", reach = "system", reason = "Takes a photo of a page.", usable = false },
]
