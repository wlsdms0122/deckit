case = 1
name = "a-permission-nothing-defines-is-taken-and-not-usable"
note = "A permission asked for that neither the system, a layer nor the host defines leaves the bundle taken, and the permission is not usable."

[host]
base = "system"
api = "1.0.0"
sources = ["notes"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "notes"
part = "permissions"

[step.expect]
answers = [
    { id = "system.case-camera", reason = "Takes a photo of a page.", usable = false },
]
