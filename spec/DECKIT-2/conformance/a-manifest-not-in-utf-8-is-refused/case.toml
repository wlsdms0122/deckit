case = 1
name = "a-manifest-not-in-utf-8-is-refused"
note = "A manifest is UTF-8 text. One holding a byte that is not UTF-8 does not read, so the bundle is refused at read, and it is listed under its folder's name."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-b"]

[[step]]
input = "start"

[[step]]
look = "mods"

[step.expect]
answers = ["mod-b"]

[[step]]
look = "mod"
mod = "mod-b"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
