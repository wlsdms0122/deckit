case = 1
name = "contributed-entries-are-answered-in-the-order-written"
note = "contributes maps an interface to an array of tables, which may be empty; each entry is handed as a value, in the order written."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"
part = "contributes"

[step.expect]
answers = { "mod-a/empty" = [], "mod-b/actions" = [{ title = "New Page", command = "new-page" }, { title = "Open", command = "open" }] }
