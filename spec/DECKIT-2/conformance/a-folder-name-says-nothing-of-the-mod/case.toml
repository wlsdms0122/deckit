case = 1
name = "a-folder-name-says-nothing-of-the-mod"
note = "The folder a bundle is in says nothing about the mod: the manifest says who it is. A bundle in a folder named shelf whose manifest writes id notes is the mod notes."

[host]
base = "system"
api = "1.0.0"
sources = ["shelf"]

[[step]]
input = "start"

[[step]]
look = "mods"

[step.expect]
answers = ["notes"]

[[step]]
look = "mod"
mod = "notes"
part = "id"

[step.expect]
answers = "notes"
