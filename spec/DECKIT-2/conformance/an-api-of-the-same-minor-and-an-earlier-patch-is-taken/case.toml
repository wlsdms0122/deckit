case = 1
name = "an-api-of-the-same-minor-and-an-earlier-patch-is-taken"
note = "Of the same minor, a version satisfies another whose patch is at most its own. A host that runs 1.2.3 satisfies 1.2.2."

[host]
base = "system"
api = "1.2.3"
sources = ["notes"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "notes"
part = "api"

[step.expect]
answers = "1.2.2"
