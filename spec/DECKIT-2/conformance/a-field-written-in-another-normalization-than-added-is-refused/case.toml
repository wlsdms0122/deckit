case = 1
name = "a-field-written-in-another-normalization-than-added-is-refused"
note = "Two field names are one name when they are the same sequence of Unicode scalar values. A host adds caf\\u00e9, and a manifest writing cafe\\u0301 writes a field no one adds."

[host]
base = "system"
api = "1.0.0"
fields = ["caf\u00e9"]
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
