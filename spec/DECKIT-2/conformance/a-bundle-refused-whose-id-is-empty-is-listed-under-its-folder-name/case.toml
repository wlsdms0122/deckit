case = 1
name = "a-bundle-refused-whose-id-is-empty-is-listed-under-its-folder-name"
note = "A refused bundle is listed under its id only where that id is a non-empty string. An id of \"\" in a folder named mod-b is listed as mod-b."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-b"]

[[step]]
input = "start"

[[step]]
look = "mods"

[step.expect]
answers = ["mod-b"]

[[step]]
look = "mod"
mod = "mod-b"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
