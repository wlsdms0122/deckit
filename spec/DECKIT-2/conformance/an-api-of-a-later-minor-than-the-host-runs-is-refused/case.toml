case = 1
name = "an-api-of-a-later-minor-than-the-host-runs-is-refused"
note = "A bundle is taken only when the contract version the host runs satisfies its api. A host that runs 1.2.0 does not satisfy 1.3.0, of the same major and a greater minor, and the bundle refuses at read."

[host]
base = "system"
api = "1.2.0"
sources = ["notes"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "notes"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
