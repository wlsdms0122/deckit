case = 1
name = "an-interface-not-named-by-a-mod-id-and-a-name-is-refused"
note = "An interface is named <mod id>/<name>. A use of pages refuses the bundle at read."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
