case = 1
name = "a-permission-defined-without-privileged-is-taken-for-any-mod"
note = "A permission is privileged only where defined so, false where not given, and one not privileged is taken and usable for a bundle read in place."

[host]
base = "system"
api = "1.0.0"
permissions = [{ id = "case.sync", name = "Sync", means = "Syncs the pages." }]
sources = ["notes"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "notes"
part = "permissions"

[step.expect]
answers = [
    { id = "case.sync", reason = "Syncs.", usable = true, name = "Sync", means = "Syncs the pages.", privileged = false },
]
