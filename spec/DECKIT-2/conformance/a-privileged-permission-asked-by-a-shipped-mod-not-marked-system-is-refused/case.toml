case = 1
name = "a-privileged-permission-asked-by-a-shipped-mod-not-marked-system-is-refused"
note = "A system mod is one the host ships and marks system. A bundle shipped and not marked system is none, and asking for a privileged permission refuses it at read."

[host]
base = "system"
api = "1.0.0"
permissions = [{ id = "case.drive", name = "Drive", description = "Drives every other mod.", privileged = true }]
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
