case = 1
name = "inline-tables-nested-33-deep-are-refused"
note = "Arrays and inline tables nest at most 32 deep; inline tables 33 deep refuse the bundle at read."

[host]
base = "system"
api = "1.0.0"
fields = ["extra"]
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
