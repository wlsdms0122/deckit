case = 1
name = "an-id-beginning-with-a-dash-is-refused"
note = "A name-part begins with a lower-case letter or a digit. An id of -mod refuses the bundle at read, which is listed under the id it writes."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "-mod"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
