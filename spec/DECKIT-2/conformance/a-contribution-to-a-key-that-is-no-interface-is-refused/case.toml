case = 1
name = "a-contribution-to-a-key-that-is-no-interface-is-refused"
note = "contributes maps an interface to an array of tables. A key that is no interface, actions, refuses the bundle at read."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
