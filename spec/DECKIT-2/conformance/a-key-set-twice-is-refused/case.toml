case = 1
name = "a-key-set-twice-is-refused"
note = "A key set twice in one table refuses the bundle at read."

[host]
base = "system"
api = "1.0.0"
fields = ["extra"]
sources = ["notes"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "notes"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
