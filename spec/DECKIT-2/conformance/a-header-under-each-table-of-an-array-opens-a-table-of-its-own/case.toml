case = 1
name = "a-header-under-each-table-of-an-array-opens-a-table-of-its-own"
note = "A table-header opens the table its path reaches, and a path through an array of tables goes on in its last table. The same header under each of two tables of an array opens two tables, and the bundle is taken."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"
part = "contributes"

[step.expect]
answers = { "mod-b/actions" = [{ title = "New Page", when = { focused = true } }, { title = "Delete Page", when = { focused = false } }] }
