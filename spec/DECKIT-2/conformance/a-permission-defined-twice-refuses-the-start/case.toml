case = 1
name = "a-permission-defined-twice-refuses-the-start"
note = "A permission whose id is defined twice refuses the app's start at call with kind PERMISSION."

[host]
base = "system"
api = "1.0.0"
permissions = [
    { id = "case.sync", name = "Sync", means = "Syncs the pages." },
    { id = "case.sync", name = "Sync again", means = "Syncs the pages again." },
]

[[step]]
input = "start"

[step.expect]
refuses = "call"
kind = "PERMISSION"
