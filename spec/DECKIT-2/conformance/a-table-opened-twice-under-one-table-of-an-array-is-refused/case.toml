case = 1
name = "a-table-opened-twice-under-one-table-of-an-array-is-refused"
note = "A table opened by a table-header twice refuses. Under one table of an array of tables, a header that opens the same table twice refuses the bundle at read."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
