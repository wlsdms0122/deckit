case = 1
name = "a-main-in-another-case-than-its-file-is-refused"
note = "A path's segment names the entry of its folder whose name is the same sequence of Unicode scalar values. A main of Main.js names no entry of a bundle that holds main.js, and refuses the bundle at read."

