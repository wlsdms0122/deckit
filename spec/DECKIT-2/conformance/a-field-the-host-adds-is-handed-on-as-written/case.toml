case = 1
name = "a-field-the-host-adds-is-handed-on-as-written"
note = "A field the host adds is a top-level key a manifest may write, with any value. The system judges nothing of it and answers it as written, a table as a table and an integer as a number."

[host]
base = "system"
api = "1.0.0"
fields = ["view"]
sources = ["notes"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "notes"
part = "fields"

[step.expect.answers.view]
sidebar = true
size = [320, 200]
