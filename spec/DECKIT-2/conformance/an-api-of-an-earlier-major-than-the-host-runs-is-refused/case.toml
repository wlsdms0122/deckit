case = 1
name = "an-api-of-an-earlier-major-than-the-host-runs-is-refused"
note = "A version satisfies another only of the same major. A host that runs 1.2.0 does not satisfy 0.2.0, though it is greater, and the bundle refuses at read."

[host]
base = "system"
api = "1.2.0"
sources = ["notes"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "notes"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
