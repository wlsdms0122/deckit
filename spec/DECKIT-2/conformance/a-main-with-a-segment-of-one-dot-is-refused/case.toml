case = 1
name = "a-main-with-a-segment-of-one-dot-is-refused"
note = "A path's segment is never \".\". A main that names its file through a segment of one dot, a file that is there, is refused at read."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
