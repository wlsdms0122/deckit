case = 1
name = "a-table-header-ending-at-an-array-of-tables-is-refused"
note = "A table-header whose path ends at an array of tables refuses the bundle at read."

[host]
base = "system"
api = "1.0.0"
fields = ["extra"]
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
