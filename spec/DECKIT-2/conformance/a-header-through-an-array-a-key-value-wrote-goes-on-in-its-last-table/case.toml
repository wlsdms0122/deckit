case = 1
name = "a-header-through-an-array-a-key-value-wrote-goes-on-in-its-last-table"
note = "A header's path goes through an array in its last value, whether headers or a key-value wrote it. extra = [{ a = 1 }] then [extra.more] opens more in that table."

[host]
base = "system"
api = "1.0.0"
fields = ["extra"]
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"
part = "fields"

[step.expect]
answers = { extra = [{ a = 1, more = { m = 1 } }] }
