case = 1
name = "an-id-in-capitals-is-refused"
note = "An id is name-part, of lower-case letters, digits, \".\", \"_\" and \"-\". Mod-A refuses the bundle at read, which is listed under the id it writes."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "Mod-A"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
