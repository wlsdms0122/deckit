case = 1
name = "a-folder-holding-a-manifest-in-capitals-is-passed-over"
note = "The name manifest.toml names the entry whose name is that same sequence of Unicode scalar values. A folder holding Manifest.toml holds no manifest.toml, is not a bundle, and is passed over in a folder of bundles."

