case = 1
name = "the-interfaces-are-answered-as-written"
note = "provides is each interface with a non-empty array of majors, uses each interface with one major, a major an integer at least 0, each answered as written."

[host]
base = "system"
api = "1.0.0"
sources = ["notes"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "notes"
part = "provides"

[step.expect]
answers = { "notes/pages" = [0, 2] }

[[step]]
look = "mod"
mod = "notes"
part = "uses"

[step.expect]
answers = { "switcher/actions" = 0 }
