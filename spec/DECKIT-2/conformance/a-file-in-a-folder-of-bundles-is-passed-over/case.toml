case = 1
name = "a-file-in-a-folder-of-bundles-is-passed-over"
note = "Nothing but a folder is a bundle. mod-b is a regular file beside the bundle mod-a in the folder of bundles read in place, and nothing is listed for it."

[host]
base = "system"
api = "1.0.0"
sources = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
look = "mods"

[step.expect]
answers = ["mod-a"]
