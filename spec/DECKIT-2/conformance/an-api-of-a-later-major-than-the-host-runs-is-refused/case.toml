case = 1
name = "an-api-of-a-later-major-than-the-host-runs-is-refused"
note = "A version satisfies another only of the same major. A host that runs 1.2.0 does not satisfy 2.0.0, and the bundle refuses at read."

[host]
base = "system"
api = "1.2.0"
sources = ["mod-a"]

[[step]]
input = "start"

[[step]]
look = "mod"
mod = "mod-a"

[step.expect]
refuses = "read"
kind = "NOT_LOADABLE"
