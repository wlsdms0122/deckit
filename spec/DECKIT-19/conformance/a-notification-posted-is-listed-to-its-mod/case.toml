case = 5
name = "a-notification-posted-is-listed-to-its-mod"
note = "post(notification) keeps the notification, and list() answers it to a client of the mod that posted it, with its title and body. mod-a posts Standup, in 5 min."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/notifications"]
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/notifications"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "post"
handed = true
args = [{ title = "Standup", body = "in 5 min" }]

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true
part = "title"

[step.expect]
answers = ["Standup"]

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true
part = "body"

[step.expect]
answers = ["in 5 min"]
