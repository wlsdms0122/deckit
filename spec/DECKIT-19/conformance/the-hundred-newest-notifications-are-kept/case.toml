case = 5
name = "the-hundred-newest-notifications-are-kept"
note = "The owner keeps the 100 newest notifications, and takes the oldest away as one more is posted. mod-a posts 101, n1 to n101, and lists n101 to n2."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/notifications"]
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
