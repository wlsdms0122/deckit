case = 5
name = "a-post-with-args-of-another-type-is-refused"
note = "post is refused at call with kind INVALID_ARGUMENT where args is not a table. mod-a posts Standup with the command show and the args [1]."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/notifications"]
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/notifications"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "post"
handed = true
args = [{ title = "Standup", body = "in 5 min", command = "show", args = [1] }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
