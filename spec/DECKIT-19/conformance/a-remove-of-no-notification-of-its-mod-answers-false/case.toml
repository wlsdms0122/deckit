case = 5
name = "a-remove-of-no-notification-of-its-mod-answers-false"
note = "remove(id) answers false where no notification of the client's own mod has the id, and takes nothing away. mod-a posts Standup and removes x."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/notifications"]
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/notifications"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "post"
handed = true
args = [{ title = "Standup", body = "in 5 min" }]

[[step]]
input = "call"
mod = "mod-a"
member = "remove"
handed = true
args = ["x"]

[step.expect]
answers = false

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true
part = "title"

[step.expect]
answers = ["Standup"]
