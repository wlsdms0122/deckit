case = 5
name = "a-post-with-an-action-with-no-command-is-refused"
note = "post is refused at call with kind INVALID_ARGUMENT where an action has no command. mod-a posts Standup with the action Snooze and no command."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/notifications"]
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/notifications"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "post"
handed = true
args = [{ title = "Standup", body = "in 5 min", actions = [{ title = "Snooze" }] }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
