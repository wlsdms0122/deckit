case = 5
name = "a-post-of-a-notification-of-another-type-is-refused"
note = "post is refused at call with kind INVALID_ARGUMENT where notification is not a table. mod-a posts the string Standup."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/notifications"]
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/notifications"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "post"
handed = true
args = ["Standup"]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
