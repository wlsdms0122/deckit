case = 5
name = "a-post-with-silent-of-another-type-is-refused"
note = "post is refused at call with kind INVALID_ARGUMENT where silent is not a boolean, never read as one. mod-a posts Standup with silent the string yes."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/notifications"]
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/notifications"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "post"
handed = true
args = [{ title = "Standup", body = "in 5 min", silent = "yes" }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
