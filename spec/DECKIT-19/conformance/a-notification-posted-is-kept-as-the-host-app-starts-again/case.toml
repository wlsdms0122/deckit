case = 5
name = "a-notification-posted-is-kept-as-the-host-app-starts-again"
note = "The owner keeps what is posted in its storage, so it is listed as the host app starts again. mod-a posts Standup, and the host app quits and starts."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/notifications"]
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/notifications"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "post"
handed = true
args = [{ title = "Standup", body = "in 5 min" }]

[[step]]
input = "quit"

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/notifications"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true
part = "title"

[step.expect]
answers = ["Standup"]
