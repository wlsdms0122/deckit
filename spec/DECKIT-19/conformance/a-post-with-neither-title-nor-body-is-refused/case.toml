case = 5
name = "a-post-with-neither-title-nor-body-is-refused"
note = "post is refused at call with kind INVALID_ARGUMENT where title and body are both left out or empty. mod-a posts the title and body empty."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/notifications"]
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/notifications"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "post"
handed = true
args = [{ title = "", body = "" }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
