case = 5
name = "a-post-with-a-body-of-another-type-is-refused"
note = "post is refused at call with kind INVALID_ARGUMENT where body is not a string. mod-a posts the title Standup and the body true."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/notifications"]
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/notifications"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "post"
handed = true
args = [{ title = "Standup", body = true }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
