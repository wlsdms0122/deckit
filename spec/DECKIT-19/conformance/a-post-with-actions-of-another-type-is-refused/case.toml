case = 5
name = "a-post-with-actions-of-another-type-is-refused"
note = "post is refused at call with kind INVALID_ARGUMENT where actions is not an array. mod-a posts Standup with the actions a table."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/notifications"]
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/notifications"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "post"
handed = true
args = [{ title = "Standup", body = "in 5 min", actions = { title = "Snooze", command = "snooze" } }]

[step.expect]
refuses = "call"
kind = "INVALID_ARGUMENT"
