case = 5
name = "notifications-are-listed-newest-first"
note = "list() answers the client's own mod's notifications newest first. mod-a posts one, then two."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/notifications"]
ship = ["mod-a"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/notifications"]
listener = true

[[step]]
input = "call"
mod = "mod-a"
member = "post"
handed = true
args = [{ title = "one" }]

[[step]]
input = "call"
mod = "mod-a"
member = "post"
handed = true
args = [{ title = "two" }]

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true
part = "title"

[step.expect]
answers = ["two", "one"]
