case = 5
name = "a-notification-of-another-mod-is-not-listed"
note = "list() answers the notifications of the client's own mod alone: a mod's notifications are its own. mod-b posts Standup, and mod-a lists none."

[host]
base = "system"
api = "1.0.0"
owners = ["deckit/notifications"]
ship = ["mod-a", "mod-b"]

[[step]]
input = "start"

[[step]]
input = "call"
mod = "mod-a"
member = "dependencies.onConnect"
args = ["deckit/notifications"]
listener = true

[[step]]
input = "call"
mod = "mod-b"
member = "dependencies.onConnect"
args = ["deckit/notifications"]
listener = true

[[step]]
input = "call"
mod = "mod-b"
member = "post"
handed = true
args = [{ title = "Standup", body = "in 5 min" }]

[[step]]
input = "call"
mod = "mod-a"
member = "list"
handed = true

[step.expect]
answers = []

[[step]]
input = "call"
mod = "mod-b"
member = "list"
handed = true
part = "title"

[step.expect]
answers = ["Standup"]
