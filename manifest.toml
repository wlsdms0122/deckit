[open-package]
version = "1.0.0"

[package]
name = "deckit"
version = "1.0.0"
description = "A library a host app embeds to take mods, the way a game does, and Deckit.app, deckit embedded by itself. Builds the archive a host app embeds."
requires = ["node", "npm", "npx", "shasum"]

# Each line is what actually runs, from the package root, through one script.
#
# `build` is what this package is for: the archive an app embeds, into .build/. `app` makes
# Deckit.app from it. The rest are here because each is also worth running on its own.
[command]
build   = "source/cli/deckit build"
app     = "source/cli/deckit app"
check   = "source/cli/deckit check"
dev     = "source/cli/deckit dev"
install = "source/cli/deckit install"
engine  = "source/cli/deckit engine"
