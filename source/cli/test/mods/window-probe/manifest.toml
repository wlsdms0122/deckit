id = "window-probe"
name = "Window Probe"
version = "1.0.0"
api = "1.0.0"
main = "main.js"
view = {}

[permissions]
"system.main-process" = "to test what a main process module finds of the panel's window"
"deckit.mods" = "to install what the test hands it, and open the mods it names"
"deckit.system-services" = "to test opening the switcher by its command, and binding another mod's key again"

[interfaces]
uses = { "deckit/commands" = 1, "deckit/keys" = 1 }
