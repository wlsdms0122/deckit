id = "keys-user"
name = "Keys User"
version = "1.0.0"
api = "1.0.0"
main = "main.js"
activationPolicy = "accessory"

[permissions]
"deckit.app-keys" = "to test a key it declares that works anywhere in the app"

[interfaces]
uses = { "deckit/keys" = 1 }

[[contributes."deckit/commands"]]
id = "mark"
title = "Mark"

[[contributes."deckit/keys"]]
command = "mark"
keystroke = "mod+shift+9"
scope = "app"
