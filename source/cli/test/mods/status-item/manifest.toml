id = "status-item"
name = "Status Item"
version = "1.0.0"
api = "1.0.0"
main = "main.js"
activationPolicy = "accessory"

[permissions]
"deckit.panel-windows" = "to test a view standing under its item in the status bar"

[interfaces]
uses = { "deckit/notifications" = 1, "status-bar/items" = 2 }

[[contributes."deckit/commands"]]
id = "show"
title = "Show Status Item"

[[contributes."deckit/commands"]]
id = "noted"
title = "Note a Word"
params = { type = "object", properties = { word = { type = "string", title = "Word", description = "What to mark." } }, required = ["word"] }
