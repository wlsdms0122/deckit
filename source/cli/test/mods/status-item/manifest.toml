id = "status-item"
name = "Status Item"
version = "1.0.0"
api = "1.0.0"
main = "main.js"
activationPolicy = "accessory"

[permissions]
"deckit.panel-windows" = "to test a view standing under its item in the status bar"

[interfaces]
uses = { "status-bar/items" = 2, "notifications/center" = 1 }

[[contributes."deckit/commands"]]
id = "show"
title = "Show Status Item"
