id = "settings"
name = "Settings"
version = "1.0.0"
api = "1.0.0"
main = "main.js"

[permissions]
"deckit.plugins" = "Its Plugins section installs a plugin from a folder you pick and removes installed ones."
"deckit.plugin-settings" = "Its Plugin Settings section shows and changes every plugin's settings."
"deckit.key-map" = "Its Keyboard section is where every plugin's shortcuts are shown and changed."
"deckit.url-schemes" = "Its URL Schemes section sets which plugin is asked first to open an address, scheme by scheme."
