id = "deckit"
name = "Deckit"
version = "1.0.0"
api = "1.0.0"
main = "main.js"
activationPolicy = "accessory"
icon = "<svg viewBox='0 0 24 24' aria-hidden='true' width='18' height='18' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z'/><path d='M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12'/><path d='M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17'/></svg>"
keywords = ["deckit", "deck"]

[permissions]
"deckit.mods" = "Restarts a mod you pick, or the whole app."
"system.file-handlers" = "Opens a file:// address you type."
"system.clipboard-write" = "Copies a version you pick from About, for a report."

[interfaces]
uses = { "switcher/actions" = 1, "deckit/urls" = 1 }

[[contributes."deckit/commands"]]
id = "open-address"
title = "Open Address"
params = { type = "object", properties = { address = { type = "string", title = "Address", description = "With its scheme: https://…, file:///…" } }, required = ["address"] }

[[contributes."deckit/commands"]]
id = "restart-mod"
title = "Restart Mod"
params = { type = "object", properties = { mod = { type = "string", title = "Mod" } }, required = ["mod"] }

[[contributes."deckit/commands"]]
id = "restart-app"
title = "Restart the App"

[[contributes."deckit/commands"]]
id = "show-mods-folder"
title = "Show Mods Folder"

[[contributes."deckit/commands"]]
id = "show-data-folder"
title = "Show Data Folder"

[[contributes."deckit/commands"]]
id = "show-log"
title = "Show Log"

[[contributes."deckit/commands"]]
id = "copy-version"
title = "Copy Version"
params = { type = "object", properties = { version = { type = "string", title = "Version", description = "The app's, deckit's or an engine's, as About lists it." } }, required = ["version"] }

[[contributes."switcher/actions"]]
label = "Show Mods Folder"
keywords = ["finder", "reveal"]
command = "show-mods-folder"

[[contributes."switcher/actions"]]
label = "Show Data Folder"
keywords = ["finder", "reveal"]
command = "show-data-folder"

[[contributes."switcher/actions"]]
label = "Show Log"
keywords = ["finder", "reveal", "로그"]
command = "show-log"
