id = "deckit"
name = "Deckit"
version = "1.0.0"
api = "1.0.0"
main = "main.js"

[permissions]
"deckit.mods" = "Restarts a mod you pick, or the whole app."
"system.file-handlers" = "Shows deckit's folders and its log in Finder, and opens a file:// address you type."
"system.clipboard-write" = "Copies a version you pick from About, for a report."

[dependencies]
switcher = { version = "1.0.0", optional = true }
