id = "notifications"
name = "Notifications"
version = "1.0.0"
api = "1.0.0"
main = "main.js"
activationPolicy = "accessory"
background = "Takes the notifications mods send from the start, so none is missed."
icon = "icon.svg"
keywords = ["notifications", "알림", "toast"]

[permissions]
"system.notifications" = "Shows a notification as the system's while you are in another app."
"deckit.panel-windows" = "Shows each notification at the top right of the app as it comes, and the recent ones under its item in the status bar when you ask."
"deckit.system-services" = "Runs the command of a notification you press, which launches its sender if it does not run."

[interfaces]
provides = { "deckit/notifications" = [1] }
uses = { "deckit/commands" = 1, "status-bar/items" = 2 }

[[contributes."status-bar/items"]]
name = "Notifications"
icon = "bell"
command = "toggle"

[[contributes."deckit/commands"]]
id = "toggle"
title = "Show or Hide Notifications"

[[contributes."deckit/commands"]]
id = "show"
title = "Show Notifications"

[[contributes."switcher/actions"]]
label = "Show Notifications"
keywords = ["알림", "recent"]
command = "show"
