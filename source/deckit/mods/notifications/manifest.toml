id = "notifications"
name = "Notifications"
version = "1.0.0"
api = "1.0.0"
main = "main.js"
background = "Takes the notifications mods send from the start, so none is missed."
icon = "<svg viewBox='0 0 24 24' aria-hidden='true' width='18' height='18' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9'/><path d='M10.3 21a1.94 1.94 0 0 0 3.4 0'/></svg>"
keywords = ["notifications", "알림", "toast"]

[permissions]
"system.notifications" = "Shows a notification as the system's while you are in another app."
"system.overlay-windows" = "Shows notifications over the app, and the recent ones when you ask."
"deckit.system-services" = "Runs the command of a notification you press, which launches its sender if it does not run."

[interfaces]
provides = { "deckit/notifications" = [1] }
uses = { "deckit/commands" = 1 }

[[contributes."deckit/commands"]]
id = "show"
title = "Show Notifications"

[[contributes."switcher/actions"]]
label = "Show Notifications"
keywords = ["알림", "recent"]
command = "show"
