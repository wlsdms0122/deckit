id = "settings"
name = "Settings"
version = "1.0.0"
api = "1.0.0"
main = "main.js"

[permissions]
"deckit.mods" = "Its Mods section installs a mod from a folder you pick, removes installed ones, restarts a mod or the app, shows a mod's folder in Finder and pins a mod to the mod list."
"deckit.mod-configuration" = "Its Mod Settings section shows and changes every mod's configuration."
"deckit.keymap" = "Its Keyboard section is where every mod's shortcuts are shown and changed."
"deckit.url-schemes" = "Its URL Schemes section sets which mod is asked first to open an address, scheme by scheme."
"deckit.fonts" = "Its Fonts section sets the fonts and the text size mods write text in."

[extends]
switcher = "1.0.0"
