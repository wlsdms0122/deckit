id = "bot"
name = "Bot"
version = "1.0.0"
api = "1.0.0"
main = "main.js"
icon = "icon.svg"
keywords = [
    "bot",
    "forge",
    "daemon",
    "supervisor",
    "runner",
    "service",
    "llmemory",
    "brain",
    "memory",
    "봇",
    "데몬",
    "서비스",
    "러너",
    "브레인",
    "기억",
    "지식",
]

[permissions]
"system.main-process" = "Reads the brain, by running the llmemory command."
"system.clipboard-write" = "The copy button on a code block in a note puts the block on the clipboard."

[interfaces]
uses = { "forge/sessions" = 1, "deckit/configuration" = 1, "deckit/urls" = 1, "switcher/actions" = 1 }

[[contributes."deckit/configuration"]]
key = "llmemory"
type = "string"
title = "LLMemory command"
description = "Where the llmemory program is, as a full path. Empty: the llmemory on your login shell's PATH."
default = ""
placeholder = "llmemory"

[[contributes."deckit/configuration"]]
key = "brain"
type = "string"
title = "Brain folder"
description = "The brain's folder, the one llmemory reads with --home. Brain lists nothing until it is set."
default = ""
placeholder = "Not set"

[[contributes."deckit/configuration"]]
key = "wrapCode"
type = "boolean"
title = "Wrap code in notes"
description = "Long lines in a note's code blocks wrap instead of scrolling sideways. The wrap button on a block switches it too."
default = false

[[contributes."deckit/commands"]]
id = "show"
title = "Show in Bot"

[contributes."deckit/commands".params]
type = "object"
required = ["view"]

[contributes."deckit/commands".params.properties.view]
type = "string"
title = "View"
oneOf = [
    { const = "supervisor", title = "Services" },
    { const = "workflows", title = "Workflows" },
    { const = "schedules", title = "Schedules" },
    { const = "brain", title = "Brain" },
]

[contributes."deckit/commands".params.properties.session]
type = "string"
title = "Forge session"
description = "The session the Forge views show. Absent: the one chosen."

[[contributes."deckit/commands"]]
id = "choose-session"
title = "Choose Forge Session"
params = { type = "object", properties = { session = { type = "string", title = "Forge session" } }, required = ["session"] }

[[contributes."deckit/commands"]]
id = "search-brain"
title = "Search the Brain"
params = { type = "object", properties = { query = { type = "string", title = "Search" } }, required = ["query"] }

[[contributes."deckit/commands"]]
id = "read-note"
title = "Read a Brain Note"
params = { type = "object", properties = { note = { type = "string", title = "Note" } }, required = ["note"] }
