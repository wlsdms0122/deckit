id = "clock"
name = "Clock"
version = "1.0.0"
api = "1.0.0"
main = "main.js"
activationPolicy = "accessory"
background = "Keeps the time in the status bar from the start."
icon = "icon.svg"
keywords = ["clock", "time", "date", "시계"]

[interfaces]
uses = { "status-bar/items" = 2, "notifications/center" = 1 }

[[contributes."status-bar/items"]]
name = "Clock"
command = "toggle-center"

[[contributes."deckit/commands"]]
id = "toggle-center"
title = "Show or Hide Notifications"
