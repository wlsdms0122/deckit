id = "calendar"
name = "Calendar"
version = "1.0.0"
api = "1.0.0"
main = "main.js"
background = "Reminds you of a meeting before it starts."
icon = "icon.svg"
keywords = ["캘린더", "일정", "달력", "calendar", "schedule"]

[interfaces]
provides = { "calendar/accounts" = [1] }
uses = { "deckit/configuration" = 1, "deckit/notifications" = 1, "settings/buttons" = 1, "switcher/actions" = 1 }

[[contributes."deckit/configuration"]]
key = "notify"
type = "string"
title = "Notify me"
description = "Meetings you are invited to, and every event on your own calendars. A calendar's ✎ changes which it is. A hidden calendar reminds too."
default = "10"
oneOf = [
    { const = "off", title = "Off" },
    { const = "0", title = "At start time" },
    { const = "1", title = "1 min before" },
    { const = "5", title = "5 min before" },
    { const = "10", title = "10 min before" },
    { const = "15", title = "15 min before" },
    { const = "30", title = "30 min before" },
]

[[contributes."deckit/commands"]]
id = "send-test"
title = "Send a Test Notification"

[[contributes."deckit/commands"]]
id = "show-date"
title = "Show Date in Calendar"
params = { type = "object", properties = { date = { type = "string", title = "Date", description = "A day, as YYYY-MM-DD." } }, required = ["date"] }

[[contributes."deckit/commands"]]
id = "go-to-date"
title = "Go to Date"
params = { type = "object", properties = { date = { type = "string", title = "Date", description = "A day, as YYYY-MM-DD." } }, required = ["date"] }

[[contributes."deckit/commands"]]
id = "show-view"
title = "Show Calendar View"
params = { type = "object", properties = { view = { type = "string", title = "View", oneOf = [{ const = "day", title = "Day" }, { const = "week", title = "Week" }, { const = "month", title = "Month" }] } }, required = ["view"] }
