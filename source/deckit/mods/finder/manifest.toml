id = "finder"
name = "Finder"
version = "1.0.0"
api = "1.0.0"
main = "main.js"
icon = "<svg viewBox='0 0 24 24' aria-hidden='true' width='18' height='18' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z'/></svg>"
keywords = ["finder", "files", "file", "folder", "explorer", "browse", "파인더", "파일", "폴더", "탐색기"]

[permissions]
"system.main-process" = "Lists and watches the folders you browse, draws their icons, shows Quick Look, and makes, renames, moves and trashes files there."
"system.file-handlers" = "Opens a file in the mod or the app that handles it, and shows a file or folder in the macOS Finder."
"system.clipboard-write" = "Copy Path in a file's or a folder's menu puts its path on the clipboard."

[interfaces]
uses = { "deckit/configuration" = 1, "deckit/urls" = 1, "switcher/actions" = 1 }

[[contributes."deckit/configuration"]]
key = "showHidden"
type = "boolean"
title = "Show hidden files"
description = "Names that start with a dot, such as .git or .env."
default = false

[[contributes."deckit/configuration"]]
key = "foldersFirst"
type = "boolean"
title = "Keep folders on top"
description = "Folders come before files whichever column the list is sorted by."
default = true

[[contributes."deckit/commands"]]
id = "open-folder"
title = "Open Folder in Finder"
params = { type = "object", properties = { path = { type = "string", title = "Folder", description = "A path from / or ~." } }, required = ["path"] }

[[contributes."deckit/commands"]]
id = "go-to-place"
title = "Go to Place in Finder"

[contributes."deckit/commands".params]
type = "object"
required = ["place"]

[contributes."deckit/commands".params.properties.place]
type = "string"
title = "Place"
oneOf = [
    { const = "home", title = "Home" },
    { const = "desktop", title = "Desktop" },
    { const = "documents", title = "Documents" },
    { const = "downloads", title = "Downloads" },
    { const = "applications", title = "Applications" },
]
