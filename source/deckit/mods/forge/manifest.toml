id = "forge"
name = "Forge"
version = "1.0.0"
api = "1.0.0"
main = "main.js"
activationPolicy = "accessory"
background = "Follows the forge daemons and the runs on them while the app is open."
icon = "icon.svg"
keywords = ["forge", "daemon", "workflow", "service", "schedule"]

[permissions]
"system.main-process" = "Starts and stops the forge daemons and runs forge's operations on them, by running the forge command."

[interfaces]
provides = { "forge/sessions" = [1] }
uses = { "deckit/configuration" = 1 }

[[contributes."deckit/configuration"]]
key = "forge"
type = "string"
title = "Forge command"
description = "Where the forge program is, as a full path. Empty: the forge on your login shell's PATH."
default = ""
placeholder = "forge"

[[contributes."deckit/configuration"]]
key = "forgeConfig"
type = "string"
title = "Forge configuration"
description = "The config.toml the default session is served with. Empty: forge's own, in the session's folder."
default = ""
placeholder = "~/.config/forge/default/config.toml"

[[contributes."deckit/commands"]]
id = "start"
title = "Start Forge"
params = { type = "object", properties = { session = { type = "string", title = "Session", description = "A forge session. Absent: default." } } }

[[contributes."deckit/commands"]]
id = "stop"
title = "Stop Forge"
params = { type = "object", properties = { session = { type = "string", title = "Session", description = "A forge session. Absent: default." } } }

[[contributes."deckit/commands"]]
id = "restart"
title = "Restart Forge"
params = { type = "object", properties = { session = { type = "string", title = "Session", description = "A forge session. Absent: default." } } }
