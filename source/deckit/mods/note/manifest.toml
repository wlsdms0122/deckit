id = "note"
name = "Notes"
version = "1.0.0"
api = "1.0.0"
main = "main.js"
icon = "icon.svg"
keywords = [
    "notes",
    "note",
    "memo",
    "markdown",
    "md",
    "checklist",
    "todo",
    "노트",
    "메모",
    "메모장",
    "마크다운",
    "체크리스트",
    "할일",
]

[permissions]
"system.main-process" = "Keeps your notes as Markdown files in its own data folder, and puts the ones you delete in the Trash."
"system.file-handlers" = "A file:// address in a note opens in the mod or the app that opens it."
"system.clipboard-write" = "Copy as Markdown in a note's menu, and Copy in the menu over a note's text, put the text on the clipboard."

[interfaces]
uses = { "deckit/configuration" = 1, "deckit/urls" = 1, "switcher/actions" = 1 }

[[contributes."deckit/configuration"]]
key = "sort"
type = "string"
title = "Sort notes by"
description = "How a folder's notes are laid out in its gallery."
default = "modified"
oneOf = [
    { const = "modified", title = "Date Edited" },
    { const = "created", title = "Date Created" },
    { const = "name", title = "Name" },
]

[[contributes."deckit/configuration"]]
key = "textSize"
type = "number"
title = "Text size"
description = "Default follows the text size in the General section."
minimum = 11
maximum = 22
unit = " px"
inherits = "textSize"

[[contributes."deckit/configuration"]]
key = "font"
type = "string"
title = "Font"
description = "The face a note is written in, its title too; code stays monospaced. Default follows the General section."
default = "default"
choices = "textFonts"

[[contributes."deckit/commands"]]
id = "new-note"
title = "New Note"

[[contributes."deckit/commands"]]
id = "open"
title = "Open Note"
params = { type = "object", properties = { id = { type = "string", title = "Note" } }, required = ["id"] }

[[contributes."deckit/commands"]]
id = "show-folder"
title = "Show Folder in Notes"
params = { type = "object", properties = { path = { type = "string", title = "Folder" } }, required = ["path"] }
