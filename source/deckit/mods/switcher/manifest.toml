id = "switcher"
name = "Switcher"
version = "1.0.0"
api = "1.0.0"
main = "main.js"

[permissions]
"deckit.command-registry" = "Lists every command of the mods and the app, and runs the one you pick."
"system.global-keys" = "Opens on its key from any app."
"system.overlay-windows" = "Opens over the app you are in."
