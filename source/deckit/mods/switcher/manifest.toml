id = "switcher"
name = "Switcher"
version = "1.0.0"
api = "1.0.0"
main = "main.js"

[permissions]
"deckit.command-registry" = "Lists each mod the app can show, and shows the one you pick."
"system.global-keys" = "Opens on its key from any app."
"system.overlay-windows" = "Opens over the app you are in."
"system.notifications" = "Tells you why an action did not run once the switcher had gone."
