id = "switcher"
name = "Switcher"
version = "1.0.0"
api = "1.0.0"
main = "main.js"
activationPolicy = "accessory"
background = "Opens on its key from any app, so it is ready for the key from the start."
icon = "icon.svg"
keywords = ["switcher", "command", "palette"]

[permissions]
"deckit.mods" = "Lists each mod the app can show, and shows the one you pick."
"deckit.system-services" = "Runs the command of an action a mod declares, which launches the mod if it does not run."
"system.overlay-windows" = "Opens over the app you are in."
"system.global-keys" = "Its key, Option-Space unless you set another, opens it from any app."

[interfaces]
provides = { "switcher/actions" = [1] }
uses = { "deckit/commands" = 1, "deckit/notifications" = 1 }

[[contributes."deckit/commands"]]
id = "show"
title = "Show Switcher"

[[contributes."deckit/keys"]]
command = "show"
keystroke = "alt+space"
scope = "global"
