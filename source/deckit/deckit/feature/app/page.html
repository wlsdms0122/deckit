<!doctype html>
<meta charset="utf-8">
<title></title>
<!-- deckit and a plugin's entry run in the preload's isolated world, whose code this policy leaves alone. The
     page's own world runs only scripts from its origin: a plugin's own files. What the isolated world loads the
     policy still holds, so the ranker's blob worker is named. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'">
<!-- Transparent: the view is a rectangle, and the rounded corners and shadow are drawn inside it over
     the app around the edges. No drag selection: text meant to be copied opts in (ui.selectable). -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { -webkit-user-select: none; user-select: none; }
</style>
