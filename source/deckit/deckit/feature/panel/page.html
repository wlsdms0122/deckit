<!-- Transparent: the view is a rectangle, and the rounded corners and shadow are drawn inside it over
     the app around the edges. No drag selection: text meant to be copied opts in (ui.selectable). -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { -webkit-user-select: none; user-select: none; }
</style>
